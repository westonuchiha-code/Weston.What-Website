<style>
  :root { --page: #171624; --pad: #3b4278; --padHi: #639bff; --fire: #ac3232; --fireLabel: #f8f8f8; --cb: 0px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--page); transition: background-color .25s; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block;
    image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  /* portrait on a touch device: game at the top, controls get the space below */
  body.ptop canvas { top: env(safe-area-inset-top, 0px); transform: translateX(-50%); }
  body.idle, body.idle canvas { cursor: none; }

  /* ---- touch controls: absent unless the player actually touches ---- */
  #tc { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; --fs: clamp(84px, 22vmin, 124px); --bs: clamp(64px, 16vmin, 90px);
    --R: calc(env(safe-area-inset-right, 0px) + 18px); --B: calc(env(safe-area-inset-bottom, 0px) + 18px); }
  body.touch #tc { display: block; }
  body.touch.ptop #tc { --B: calc(env(safe-area-inset-bottom, 0px) + 14vh); }
  #tc .b, #tc .ring, #tc .knob { position: fixed; border-radius: 50%; touch-action: none; -webkit-touch-callout: none; }
  #tc .b { pointer-events: auto; background: var(--pad); border: 3px solid var(--padHi); opacity: .42; transition: opacity .08s, transform .08s; }
  #tc .b.on { opacity: .8; transform: scale(.93); background: var(--padHi); }
  #fire { width: var(--fs); height: var(--fs); right: var(--R); bottom: var(--B); }
  #boost { width: var(--bs); height: var(--bs); right: calc(var(--R) + var(--fs) + 10px); bottom: calc(var(--B) + var(--fs) * .5); }
  #fire::after { content: ""; position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%; border-radius: 50%; background: var(--fire); border: 3px solid var(--fireLabel); }
  /* boost glyph: two chevrons drawn with borders */
  #boost::before, #boost::after { content: ""; position: absolute; top: 50%; width: 22%; height: 22%; margin-top: -11%; border-top: 4px solid var(--fireLabel); border-right: 4px solid var(--fireLabel); transform: rotate(45deg); }
  #boost::before { left: 24%; } #boost::after { left: 44%; }
  #pause { width: 48px; height: 48px; right: calc(env(safe-area-inset-right, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 8px); opacity: .38; }
  body.ptop #pause { top: calc(var(--cb) + 10px); }
  #pause::before, #pause::after { content: ""; position: absolute; top: 30%; width: 9%; height: 40%; background: var(--fireLabel); }
  #pause::before { left: 35%; } #pause::after { right: 35%; }
  #tc .ring { display: none; width: 96px; height: 96px; left: 0; top: 0; margin: -48px 0 0 -48px; border: 2px solid var(--padHi); opacity: .4; background: radial-gradient(circle, transparent 55%, var(--pad) 100%); }
  #tc .knob { display: none; width: 40px; height: 40px; left: 0; top: 0; margin: -20px 0 0 -20px; background: var(--padHi); opacity: .55; }
  #tc.stick .ring, #tc.stick .knob { display: block; }
</style>

// ---------------- zone F: the scrapyard core ----------------
function fGear(W, teeth, Ro, Rr, Rh, a0) {
  const g = G(W, W), c = (W - 1) / 2, step = Math.PI * 2 / teeth;
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const dx = x - c, dy = y - c, r = Math.hypot(dx, dy), a = Math.atan2(dy, dx) - a0; let f = (a / step) % 1; if (f < 0) f += 1;
    const tooth = f > .15 && f < .6 ? 1 : 0;   // chunky asymmetric-ish teeth
    if (r <= Rr - 1 && r >= Rh && r >= Rr - 9) sp(g, x, y, r > Rr - 5.5 && r < Rr - 4.5 ? 3 : 2);
    else if (r <= Rr + (Ro - Rr) * tooth && r > Rr - 2) sp(g, x, y, 2);
    else if (r < 8) sp(g, x, y, 2);
  }
  for (let k = 0; k < 5; k++) { const an = a0 + k * 1.2566; for (let r = 4; r < Rr - 8; r++) rf(g, Math.round(c + Math.cos(an) * r) - 1, Math.round(c + Math.sin(an) * r) - 1, 3, 3, 2); }
  sp(g, Math.round(c), Math.round(c), 4); sp(g, Math.round(c) - 3, Math.round(c) - 3, 3); sp(g, Math.round(c) + 3, Math.round(c) + 3, 3);

// Bullet-pattern stage: open strip -> skyline with rooftop turrets -> high rollers (towers above and below)
// -> casino saucer mid-boss -> jackpot rings -> boulevard canyon -> last call showpiece -> Ice Cream Truck.
// Rings of hubcaps where only some members shoot: readable yellow rings instead of a wall of bullets.
// A ring of n hubcaps around (cx, cy); every `k`-th one fires a slow bullet ring. cx is shared so nested rings share a centre.

function bossBase(o) { return Object.assign({ x: GW + 8, t: 0, flash: 0, state: 'enter', dead: false, phase: 1 }, o); }
// Second phase of the truck bosses: one loud announcement, then they trail smoke.
function wreck(b) {
  if (!b.wrecked) { b.wrecked = true; explodeBig(b.x + b.w / 2, b.y + b.h / 2); debris(b.x + b.w / 2, b.y + b.h / 2, 8); shake = 10; sfx.bigboom(); floatText('DAMAGED', b.x + b.w / 2 - 14, b.y - 4); }
  if (tick % 9 === 0) puffs.push({ x: b.x + rnd(24, b.w - 16), y: b.y + rnd(6, 22), vx: 0.4, vy: -0.35, life: 34 });
}
function enterStep(b, speed) { b.x -= speed; if (b.x <= b.tx) { b.x = b.tx; b.state = 'fight'; b.t = 0; } }

// Boss A, THE WRECKER: an armoured heavy tow truck. Twin bumper guns fire fans, the crane whips its hook
// at the van, and once wrecked it calls in rolling tires.
function makeTow() {
  return bossBase({
    name: 'TOW TRUCK', w: 86, h: 46, y: 50, by: 50, tx: GW - 96, hp: 260, maxHp: 260, bonus: 5000, fireT: 70, hookT: 150, tireT: 240, hook: null, gun: 0,
    update() {
      this.t++; if (this.flash > 0) this.flash--;
      if (this.state === 'enter') return enterStep(this, 0.8);
      this.phase = this.hp < this.maxHp / 2 ? 2 : 1;
      if (this.phase === 2) wreck(this);
      this.y = this.by + Math.sin(this.t * 0.018) * 34;
      if (--this.fireT <= 0) {
        const gy = this.y + (this.gun ? 28 : 21); this.gun ^= 1;
        fan(this.x - 1, gy, this.phase === 1 ? 3 : 5, 0.28, 1.25 * diff()); this.fireT = this.phase === 1 ? 80 : 58; sfx.eshot();
      }
      if (this.t % 14 === 0) puffs.push({ x: this.x + 39 + (this.t % 28 ? 5 : 0), y: this.y + 1, vx: 0.35, vy: -0.45, life: 28 });
      const ax = this.x + 82, ay = this.y + 3;
      if (!this.hook) {
        if (--this.hookT <= 0) {
          const tx = P.x + 11, ty = P.y + 7, d = Math.hypot(tx - ax, ty - ay) || 1;
          this.hook = { x: ax, y: ay + 7, vx: (tx - ax) / d * 2.6, vy: (ty - ay) / d * 2.6, out: true, dist: 0, max: d + 24 };
          this.hookT = this.phase === 1 ? 230 : 160; sfx.whip();
        }
      } else {
        const h = this.hook;
        if (h.out) { h.x += h.vx; h.y += h.vy; h.dist += 2.6; if (h.dist >= h.max || h.x < 4 || h.y < TOP + 6 || h.y > GH - 6) h.out = false; }
        else { const dx = ax - h.x, dy = ay + 7 - h.y, d = Math.hypot(dx, dy); if (d < 3.5) this.hook = null; else { h.x += dx / d * 3.2; h.y += dy / d * 3.2; } }
      }
      if (this.phase === 2 && --this.tireT <= 0) { W.snake('tire', 4, rnd(30, 100), 14, { drop: null }); this.tireT = 330; }
      if (this.hp <= 0) this.dead = true;
    },
    boxes() {
      return [{ x: this.x + 4, y: this.y + 6, w: 34, h: 38, vuln: true }, { x: this.x + 38, y: this.y + 13, w: 46, h: 31, vuln: true }];
    },
    barName() { return 'WRECKER'; },
    hazards() { return this.hook ? [{ x: this.hook.x - 3, y: this.hook.y - 3, w: 7, h: 7 }] : []; },
    draw(fl) {
      const x = Math.round(this.x), y = Math.round(this.y), ax = x + 82, ay = y + 3;
      if (this.hook) {
        const hx = this.hook.x, hy = this.hook.y - 7, n = Math.max(1, Math.floor(Math.hypot(hx - ax, hy - ay) / 3));
        ctx.fillStyle = M.chain; for (let i = 1; i < n; i++) ctx.fillRect(Math.round(ax + (hx - ax) * i / n), Math.round(ay + (hy - ay) * i / n), 2, 2);
      } else { ctx.fillStyle = M.chain; for (let i = 0; i < 3; i++) ctx.fillRect(ax - 1, ay + 3 + i * 3, 1, 2); }
      sd('tow', x, y, this.phase === 2 ? 1 : 0, fl);
      const wf = (this.t >> 2) & 3;
      for (const [cx, cy] of TOW_WHEELS) sd('towWheel', x + cx - 8, y + cy - 8, wf, fl);
      sd('hook', this.hook ? this.hook.x - 5 : ax - 5, this.hook ? this.hook.y - 7 : ay + 12);
      if (fl) return;
      const on = (tick >> 3) & 1;                                                  // light bar, reactor, gun tell
      ctx.fillStyle = M.lampA; for (let i = 0; i < 4; i++) if ((i + (tick >> 3)) % 2) ctx.fillRect(x + 20 + i * 3, y + 2, 2, 1);
      ctx.fillStyle = on ? M.lampA : M.lampB; ctx.fillRect(x + 42, y + 30, 2, 2);
      if (this.fireT < 16 && (tick >> 1) & 1) { ctx.fillStyle = M.lampA; ctx.fillRect(x - 1, y + (this.gun ? 27 : 20), 2, 3); }
    }
  });

function optVal(k) {
  switch (k) {
    case 'diff': return D().name;
    case 'sound': return muted ? 'OFF' : 'ON';
    case 'music': return musicMuted ? 'OFF' : 'ON';
    case 'pal': return M.name.toUpperCase();
    case 'shake': return opts.shake ? 'ON' : 'OFF';
    case 'full': return document.fullscreenElement ? 'ON' : 'OFF';
  }
  return '';
}
function optDesc(k) {
  const kb = inputKind() === 'kbd';
  switch (k) {
    case 'diff': return DIFF_DESC[opts.diff] || '';
    case 'sound': return 'SOUND EFFECTS' + (kb ? ' (M)' : '');
    case 'music': return 'BACKGROUND MUSIC' + (kb ? ' (N)' : '');
    case 'pal': return 'COLOR, GREEN OR GRAY SCREEN' + (kb ? ' (C)' : '');
    case 'shake': return 'THE SCREEN RUMBLES ON BIG BOOMS';
    case 'full': return 'FILL THE WHOLE SCREEN (F)';
    default: return 'BACK TO THE TITLE';
  }
}
function optChange(k, d) {
  if (k === 'diff') opts.diff = (opts.diff + d + 3) % 3;
  else if (k === 'sound') toggleSound();
  else if (k === 'music') toggleMusic();
  else if (k === 'pal') { cyclePalette(); if (d < 0) cyclePalette(); }
  else if (k === 'shake') opts.shake = !opts.shake;
  else if (k === 'full') toggleFullscreen();
  else return;

}

      ctext('SCORE ' + pad6(run.score), 58, M.hudDim);
      if (modeT > 40) {
        [['CONTINUE ZONE ' + run.zone], ['QUIT TO TITLE']].forEach(([s], i) => {
          const y = 70 + i * 11, sel = overSel === i, col = rowBar(80, y, 96, sel, true);
          text(s, (GW - textW(s)) >> 1, y + 2, col);
        });
        ctext('CONTINUING RESETS YOUR SCORE', 95, M.hudDim);
      }
    }
  },

  entry: {
    music: 'over',
    enter() {
      const n = (opts.name || 'AAA').padEnd(3, 'A').slice(0, 3);
      entry = { ch: n.split('').map(c => Math.max(0, CHARSET.indexOf(c))), pos: 0 };
    },
    update() {
      const e = entry;
      if (e.pos < 3) {
        if (rep('u')) { e.ch[e.pos] = (e.ch[e.pos] + 1) % CHARSET.length; sfx.select(); }
        if (rep('d')) { e.ch[e.pos] = (e.ch[e.pos] + CHARSET.length - 1) % CHARSET.length; sfx.select(); }
      }
      if (modeT < 20) return;
      if (pressed('l') || pressed('back')) { if (e.pos > 0) { e.pos--; sfx.select(); } }
      if (pressed('r') && e.pos < 3) { e.pos++; sfx.select(); }
      if (ok()) {
        if (e.pos < 3) { e.pos++; sfx.select(); }
        else {
          const name = e.ch.map(i => CHARSET[i]).join(''), rec = { name, score: run.score, route: run.path.join(''), diff: opts.diff };
          hiscores.push(rec); hiscores = hiscores.map((h, i) => [h, i]).sort((a, b) => b[0].score - a[0].score || b[1] - a[1]).map(x => x[0]).slice(0, 5);
          best = Math.max(best, run.score, hiscores[0] ? hiscores[0].score : 0); opts.name = name; run.entered = true; saveSave(); sfx.start();
          scoreHi = hiscores.indexOf(rec); scoreNext = entryNext; scoreAttract = false; goto('scores');
        }
      }
    },
    draw() {
      scene('A');
      panelBox(32, 10, 192, 118);
      ctext('NEW HIGH SCORE!', 17, M.hudText, 2);
      ctext('SCORE ' + pad6(run.score), 38, M.hudDim);
      ctext('RANK ' + (rankFor(run.score) + 1), 48, M.hudDim);
      for (let i = 0; i < 3; i++) {
        const x = 88 + i * 20, act = entry.pos === i, c = CHARSET[entry.ch[i]];
        if (act) { ctx.fillStyle = M.hudText; ctx.fillRect(x - 3, 62, 15, 19); }
        text(c === ' ' ? '_' : c, x, 64, act ? M.hud : M.hudText, 3);
        if (act && (tick >> 4) % 2 === 0) { text('^', x + 3, 55, M.hudText); text('~', x + 3, 84, M.hudText); }
      }
      const okSel = entry.pos === 3, ox = 152;
      ctx.fillStyle = okSel ? M.hudText : M.hudEmpty; ctx.fillRect(ox, 66, 26, 11);
      text('OK', ox + 8, 69, okSel ? M.hud : M.hudText);
      ctext('UP/DOWN: LETTER   FIRE: NEXT', 102, M.hudDim);
      ctext('LEFT: BACK', 112, M.hudDim);
    }
  },

  ending: {
    music: 'ending',
    enter() { endPage = 0; endT = 0; endVan = { x: -30, y: 96 }; scrollY = GH; },
    update() {
      endT++;
      endVan.x += 1.3; if (endVan.x > GW + 40) endVan.x = -40;
      endVan.y = (endPage === 1 ? 122 : 98) + Math.sin(modeT * 0.04) * 6;
      const adv = () => { endPage++; endT = 0; sfx.select(); };
      if (endPage === 2) {
        scrollY -= 0.45;
        const last = 12 * 14; if (scrollY < GH - last - 10) scrollY = GH - last - 10;
        if (endT > (GH + last) / 0.45 + 160) leaveEnding();
      }
      if (ok() && modeT > 40 && endT > 20) { if (endPage < 2) adv(); else leaveEnding(); }
    },
    draw() {
      const th = scene(endZone());
      if (endPage === 0) {
        const E = ENDINGS[endZone()];
        ctext('DELIVERY COMPLETE!', 12, M.text);
        ctext(E.head, 24, M.text, 2);
        panelBox(20, 46, 216, 34);
        E.lines.forEach((s, i) => { if (endT > 20 + i * 24) ctext(s, 51 + i * 10, M.hudText); });
        if (endT > 100 && (tick >> 5) & 1) ctext('FIRE: NEXT', 134, M.text);
      } else if (endPage === 1) {
        ctext('RUN REPORT', 8, M.text, 2);
        panelBox(36, 26, 184, 82);
        const rt = run.path.map(z => z + ' ' + ZONES[z].name);
        text('ROUTE', 46, 33, M.hudDim);
        rt.slice(0, 3).forEach((s, i) => text(s, 90, 33 + i * 9, M.hudText));
        text('SCORE', 46, 64, M.hudDim); text(pad6(run.score), 90, 64, M.hudText);
        text('LEVEL', 46, 75, M.hudDim); text(D().name, 90, 75, M.hudText);
        text('CONTINUES', 46, 86, M.hudDim); text(String(run.continues || 0), 90 + 20, 86, M.hudText);
        ctext(run.continues ? 'THE VAN FORGIVES YOU.' : 'NO CONTINUES. PURE SWAGGER.', 97, M.hudText);
        if ((tick >> 5) & 1) ctext('FIRE: NEXT', 134, M.text);
      } else {
        drawShip(Math.round(endVan.x), 126, 'boost');
        CREDITS.forEach(([s, k], i) => {
          const y = Math.round(scrollY + i * 14); if (!s || y < -20 || y > GH) return;
          if (k === 'T') ctext(s, y, M.text, 2); else if (k === 'S') ctext(s, y + 4, M.text); else ctext(s, y, k === 'N' ? M.text : M.textDim, k === 'N' ? 2 : 1);
        });
      }
      if (endPage < 2) drawShip(Math.round(endVan.x), Math.round(endVan.y), 'boost');
    }
  }
};
/* ---- 90_main.js ---- */
/* ============ Loop ============ */
let last = 0, acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  pollPad();
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
function boot() {
  for (const [n, s, w, ms] of [['hurt', 1, .6, 260], ['bigboom', .8, .8, 340], ['boom', .0, .35, 70]]) { const f = sfx[n]; sfx[n] = function () { rumble(s, w, ms); return f.apply(this, arguments); }; }
  loadSave(); muted = !opts.sound; musicMuted = !opts.music;
  buildSprites(); buildExtraSprites();
  if (typeof buildBgSprites === 'function') buildBgSprites();
  if (typeof buildEnemySprites === 'function') buildEnemySprites();
  applyPalette(MODES[opts.palette] ? opts.palette : 'color'); makeStars();
  requestAnimationFrame(t => { last = t; frame(t); });
}
let loaded = 0; const ready = () => { if (++loaded === 2) boot(); };
for (const im of [sheet, esheet]) { if (im.complete && im.naturalWidth) ready(); else im.onload = ready; }
})();
