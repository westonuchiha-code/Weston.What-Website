function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return(n>>>0)/4294967296}
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'.':s;

R:'uhhukih',S:'fgge11u',T:'v444444',U:'hhhhhhe',V:'hhhhha4',W:'hhhllla',X:'hha4ahh',Y:'hha4444',Z:'v1248gv',
'0':'ehjlphe','1':'4c4444e','2':'eh1248v','3':'u11e11u','4':'26aiv22','5':'vgu11he','6':'68guhhe','7':'v124888',
'8':'ehhehhe','9':'ehhf12c',' ':'0000000','.':'00000cc',',':'0000c48','!':'4444404','?':'eh12404','-':'000e000',
"'":'4480000',':':'0cc0cc0','/':'11248gg','+':'044v440','>':'8421248','<':'248g842','$':'4fke5u4','(':'2488842',
')':'8422248','#':'aavavaa','*':'04lel40','=':'00v0v00','%':'pq248bj','"':'aa00000'};
const B32='0123456789abcdefghijklmnopqrstuv';
const glyphCache=new Map();
function glyph(ch,col){const k=ch+col;let g=glyphCache.get(k);if(g)return g;const d=FONT[ch]||FONT['?'];
  g=mk(5,7);const x=g.getContext('2d');x.fillStyle=col;
  for(let r=0;r<7;r++){const v=B32.indexOf(d[r]);for(let c=0;c<5;c++)if(v&(16>>c))x.fillRect(c,r,1,1)}
  glyphCache.set(k,g);return g}
function text(s,x,y,col=C.ink,sc=1){s=String(s).toUpperCase();x=Math.round(x);y=Math.round(y);
  for(let i=0;i<s.length;i++){const ch=s[i];if(ch!==' ')ctx.drawImage(glyph(ch,col),x+i*6*sc,y,5*sc,7*sc)}}
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
const textC=(s,cx,y,col,sc=1)=>text(s,cx-tw(s,sc)/2,y,col,sc);
const textR=(s,rx,y,col,sc=1)=>text(s,rx-tw(s,sc),y,col,sc);
function textSh(s,cx,y,col,sh,sc=1){textC(s,cx+sc,y+sc,sh,sc);textC(s,cx,y,col,sc)}
function wrap(s,n){const out=[];let cur='';for(const w of s.split(' ')){if(cur&&(cur+' '+w).length>n){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}if(cur)out.push(cur);return out}
function box(x,y,w,h,fill=C.paper){ctx.fillStyle=C.ink;ctx.fillRect(x,y,w,h);ctx.fillStyle=C.lpurp;ctx.fillRect(x+1,y+1,w-2,h-2);ctx.fillStyle=fill;ctx.fillRect(x+2,y+2,w-4,h-4)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function ring(cx,cy,rx,ry,col,step=0.3){ctx.fillStyle=col;for(let a=0;a<6.283;a+=step)ctx.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),1,1)}

const held={},pressed={},rep={};
const DIRS=['up','down','left','right'];
function press(b){audioInit();if(!held[b]){held[b]=true;pressed[b]=true;rep[b]=0}}
function release(b){held[b]=false}
function btn(b){if(pressed[b]){pressed[b]=false;return true}return false}
const ok=()=>btn('a')||btn('start');
function tickInput(dt){for(const d of DIRS)if(held[d]){rep[d]+=dt;if(rep[d]>0.32){rep[d]-=0.085;pressed[d]=true}}}
function clearPressed(){for(const k in pressed)pressed[k]=false}
// Controller: standard-mapping gamepad. D-pad or left stick moves, A confirms, B goes back, Start pauses, X or Select = favorite/filter.
const PADMAP={0:'a',1:'b',2:'select',8:'select',9:'start',12:'up',13:'down',14:'left',15:'right',4:'left',5:'right'};
let padHeld={};
function pollPad(){try{const gps=navigator.getGamepads?navigator.getGamepads():[];const now={};
  for(const gp of gps){if(!gp||!gp.connected)continue;
   gp.buttons.forEach((b,i)=>{if(b.pressed&&PADMAP[i])now[PADMAP[i]]=1});
   const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(ay<-0.55)now.up=1;if(ay>0.55)now.down=1;if(ax<-0.55)now.left=1;if(ax>0.55)now.right=1}
  for(const k in now)if(!padHeld[k])press(k);
  for(const k in padHeld)if(!now[k])release(k);
  padHeld=now}catch(e){}}
function fitScreen(){const dpr=window.devicePixelRatio||1,aw=window.innerWidth||640,ah=window.innerHeight||576;const f=Math.min(aw/W,ah/H);
  let sc=Math.floor(f*dpr)/dpr;if(sc<f*0.85)sc=f;if(cv.style){cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px'}}
addEventListener('resize',fitScreen);fitScreen();
addEventListener('pointerdown',()=>audioInit());
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyZ:'a',KeyJ:'a',Space:'a',
  KeyX:'b',KeyK:'b',Backspace:'b',Escape:'b',Enter:'start',ShiftLeft:'select',ShiftRight:'select'};
addEventListener('keydown',e=>{const b=KEYS[e.code];if(!b)return;e.preventDefault();if(!e.repeat)press(b)});
addEventListener('keyup',e=>{const b=KEYS[e.code];if(b)release(b)});

function applyVol(){if(S&&S.opt){const L=[0,0.2,0.4,0.7,1];if(MG)MG.gain.value=L[S.opt.vol];if(MUSG)MUSG.gain.value=L[S.opt.mus]}}
// Music bus: tracks would play through MUSG so the MUSIC setting already controls them. The game ships with no music yet.
const MUSIC={};function playTrack(name){/* no tracks yet */}
function audioInit(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain();MG.connect(AC.destination);MUSG=AC.createGain();MUSG.connect(AC.destination);applyVol();NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
  if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(t,f,d,type='square',vol=0.05,slide=0){const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MG||AC.destination);o.start(t);o.stop(t+d+0.02)}
function noise(t,d,vol){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;
  f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(MG||AC.destination);s.start(t);s.stop(t+d+0.02)}
function sfx(n,arg){if(!S||!S.snd||!AC)return;try{const t=AC.currentTime;
  switch(n){
  case'move':tone(t,660,.035,'square',.035);break;
  case'ok':tone(t,880,.05);tone(t+.05,1320,.07);break;
  case'back':tone(t,520,.06);tone(t+.05,330,.08);break;
  case'bad':tone(t,160,.18,'square',.05);break;
  case'slam':noise(t,.25,.4*Math.min(1.4,arg||1));tone(t,150,.2,'triangle',.3,-100);break;
  case'flip':tone(t,1400,.05,'triangle',.08);tone(t+.05,1900,.07,'triangle',.06);break;
  case'tick':tone(t,280,.03,'square',.03);break;
  case'point':tone(t,1047,.05,'square',.04);break;
  case'good':[784,988,1175].forEach((f,i)=>tone(t+i*.07,f,.08));break;
  case'win':[523,659,784,1047,784,1047].forEach((f,i)=>tone(t+i*.1,f,.12));break;
  case'lose':[392,330,262,196].forEach((f,i)=>tone(t+i*.15,f,.17));break;
  case'buy':tone(t,988,.06);tone(t+.06,1319,.16);break;
  case'rip':noise(t,.35,.25);break;
  case'rare':[1047,1319,1568,2093].forEach((f,i)=>tone(t+i*.06,f,.1,'triangle',.09));break;
  }}catch(e){}}

  return{b:r.b,r:r.r,won:r.won|0,lost:r.lost|0,coins:r.coins|0,seed:Number.isInteger(r.seed)?r.seed:0,mods:Array.isArray(r.mods)?validMods(r.mods):[]}}catch(e){return null}}
function fixSave(s){if(!s||typeof s!=='object')return null;const n=newSave();
  if(Number.isFinite(s.coins))n.coins=Math.max(0,Math.floor(s.coins));
  if(s.owned&&typeof s.owned==='object'){n.owned={};for(const k in s.owned){let id=+k;if(s.v!==2)id=OLD_IDS[id];const c=Math.floor(s.owned[k]);if(POGS[id]&&c>0){const tot=own2(n,id)+c,m=capMax(id);n.owned[id]=Math.min(m,tot);if(tot>m)n.coins+=(tot-m)*RVAL[POGS[id].r]}}}

 draw(){drawBG(this.t);header();textSh('MODIFIERS',80,13,C.yel,C.ink);text(`ON ${S.mods.length}/2`,4,13,C.paper);
  box(4,21,152,76);
  for(let r=0;r<8;r++){const i=this.top+r;if(i>=MODS.length)break;const m=MODS[i],y=24+r*9,on=S.mods.includes(m.id),lock=!m.ok(),sel=i===this.cur;
   if(on){rect(8,y,7,7,C.ink);rect(9,y+1,5,5,C.grass)}else if(lock){rect(9,y,5,2,C.dgray);rect(8,y+2,7,5,C.dgray)}else{rect(8,y,7,7,C.ink);rect(9,y+1,5,5,C.paper)}
   text(m.name,20,y,sel?C.berry:lock?C.dgray:C.ink);if(on)textR('ON',152,y,C.grass);
   if(sel&&blink(this.t,0.3))text('>',1,y,C.berry)}
  if(this.top>0){rect(150,25,5,1,C.berry);rect(151,24,3,1,C.berry);rect(152,23,1,1,C.berry)}if(this.top+8<MODS.length){rect(150,91,5,1,C.berry);rect(151,92,3,1,C.berry);rect(152,93,1,1,C.berry)}
  const m=MODS[this.cur],lock=!m.ok();box(4,100,152,42);
  if(lock){text('LOCKED',10,104,C.berry);wrap('UNLOCK: '+m.req,23).forEach((l,i)=>text(l,10,113+i*9,C.ink))}
  else{wrap(m.desc,23).slice(0,3).forEach((l,i)=>text(l,10,104+i*9));}
  if(this.note)text(trunc(this.note,24),10,131,C.berry);else if(!lock&&blink(this.t))text(S.mods.includes(m.id)?'A: TURN OFF':'A: TURN ON',10,131,C.berry)}
};

const Rules={
 enter(){this.pg=0;this.t=0},
 update(dt){this.t+=dt;if(btn('b')){sfx('back');go(Menu);return}
  if(btn('left')&&this.pg>0){this.pg--;sfx('move')}
  if(btn('right')||ok()){if(this.pg<RULES.length-1){this.pg++;sfx('move')}else{sfx('ok');go(Menu)}}},
 draw(){drawBG(this.t);header();const[t,b]=RULES[this.pg];textSh(t,80,15,C.yel,C.ink);box(6,26,148,96);
  wrap(b,23).forEach((l,i)=>text(l,12,32+i*10));textC(`< ${this.pg+1}/${RULES.length} >`,80,130,C.paper)}
};

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.1)dt=0.1;acc+=dt;let steps=0;
  try{while(acc>=STEP&&steps<6){acc-=STEP;pollPad();tickInput(STEP);if(S&&S.st)S.st.play+=STEP;if(scene&&scene.update)scene.update(STEP);clearPressed();shakeT=Math.max(0,shakeT-STEP);steps++}
   ctx.save();if(shakeT>0&&S&&S.opt&&S.opt.shake)ctx.translate(Math.round((rnd()-.5)*4),Math.round((rnd()-.5)*4));if(scene)scene.draw();ctx.restore()}
  catch(err){console.error(err);try{ctx.restore()}catch(e){}if(S&&scene!==Menu)go(Menu)}
  requestAnimationFrame(frame)}
go(Boot);requestAnimationFrame(frame);
loadGame().then(s=>{S=s||newSave();applyVol();applyCB();if(!S.fav)S.fav={};
  // A match was left unfinished (game closed mid-battle): the caps you put up are gone and the run ends.
  if(S.escrow){S.l++;if(S.run){S.run.lost+=S.escrow.ids.length;endRun()}Menu.notice='YOUR LAST MATCH WAS ABANDONED, SO YOUR RUN ENDED. THE CAPS YOU PUT UP ARE GONE.';S.escrow=null;saveGame()}
  if(!s)saveGame();go(Title)});
</script>
