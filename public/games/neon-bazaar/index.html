const RIFT_ARCHS = ['grove','cavern','isles','ruins','ring','maze'];
const RIFT_ARCH_NAME = { grove:'GROVE', cavern:'CAVERN', isles:'ISLES', ruins:'RUINS', ring:'RING', maze:'MAZE', hall:'HALL' };
const RIFT_BIOME_NAME = { verdant:'VERDANT', ember:'EMBER', glacier:'GLACIER', voidic:'VOIDIC', gloom:'GLOOM' };
let riftPrevArch = null;                                 // the previous normal floor's archetype this run (never repeated back to back)
function riftWalkCh(ch){ return RIFT_SOLID.indexOf(ch)<0; }
function riftSeedRnd(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pickArch(depth, biome, prev){
  const w={ grove:Math.max(1.0,3.2-depth*0.18), cavern:2.2, isles:1.6, ruins:2+Math.min(2,depth*0.12), ring:1.4, maze:1+Math.min(1.5,depth*0.1) };   // grove fades with depth
  const bw={ verdant:{grove:1.6}, ember:{cavern:1.5,ring:1.5}, glacier:{cavern:1.3,isles:1.4}, voidic:{isles:2.6,ring:1.3}, gloom:{cavern:1.5,ruins:1.4,maze:1.3} }[biome]||{};
  let tot=0; const list=RIFT_ARCHS.filter(a=>a!==prev).map(a=>{ const v=w[a]*(bw[a]||1); tot+=v; return [a,v]; });
  let r=Math.random()*tot; for(const [a,v] of list){ if((r-=v)<0) return a; } return list[0][0];
}
function riftSeaCh(biome){ return biome==='ember'?'l':(biome==='voidic'||biome==='gloom')?'u':'q'; }   // what fills the gaps of an isles / ring floor

/* ---- context: sizes, noise, grid helpers ---- */
function riftNewCtx(depth, seed, opts){
  const big=!!opts.big, rnd=riftSeedRnd(seed), ri=n=>Math.floor(rnd()*n);
  const C={ depth, seed, big, rnd, ri, biome:opts.biome||'verdant', arch:opts.arch||'grove', plain:!!(opts.plain||big), pockets:[], pads:[], objs:[] };
  const sz=big?1:RIFT_SIZE_MIN+rnd()*(RIFT_SIZE_MAX-RIFT_SIZE_MIN);   // tight or sprawling, independent of depth
  let W,H;
  if(big){ W=62+Math.min(16,(depth-1)*2); H=52+Math.min(12,(depth-1)*2); }
  else { W=Math.round((44+Math.min(20,(depth-1)*3))*sz); H=Math.round((38+Math.min(14,(depth-1)*2))*sz); }
  if(C.arch==='ring'){ W=Math.max(W,48); H=Math.max(H,44); }
  W=Math.max(36,Math.min(78,W)); H=Math.max(32,Math.min(64,H));
  C.W=W; C.H=H; C.corW=1+ri(3); C.dens=big?1:0.8+rnd()*0.45; C.fill='t'; C.floorCh='e'; C.carveCh='e';
  const NS=[]; for(let i=0;i<5;i++){ const gw=W+2, gh=H+2, gr=[]; for(let j=0;j<gw*gh;j++) gr.push(rnd()); NS.push({gw,gh,gr}); }
  C.noise=(k,x,y,sc)=>{ const n=NS[k], fx=x/sc, fy=y/sc, x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0, s=v=>v*v*(3-2*v);
    const g=(i,j)=>n.gr[(Math.max(0,Math.min(n.gh-1,j)))*n.gw+Math.max(0,Math.min(n.gw-1,i))];
    const a0=g(x0,y0)+(g(x0+1,y0)-g(x0,y0))*s(tx), a1=g(x0,y0+1)+(g(x0+1,y0+1)-g(x0,y0+1))*s(tx); return a0+(a1-a0)*s(ty); };
  C.noise2=(k,x,y,sc)=>C.noise(k,x,y,sc)*0.7+C.noise((k+1)%5,x+17,y+29,sc/2.3)*0.3;
  C.inb=(x,y)=>x>1&&y>1&&x<W-2&&y<H-2;
  C.fillAll=ch=>{ C.fill=ch; C.g=[]; for(let y=0;y<H;y++) C.g.push(new Array(W).fill(ch)); };
  C.set=(x,y,ch)=>{ if(C.inb(x,y)) C.g[y][x]=ch; };
  C.disc=(x,y,r,ch)=>{ const R=Math.ceil(r); for(let oy=-R;oy<=R;oy++) for(let ox=-R;ox<=R;ox++) if(ox*ox+oy*oy<=r*r) C.set(x+ox,y+oy,ch); };
  C.rect=(x0,y0,x1,y1,ch)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) C.set(x,y,ch); };
  // drunk-walk toward a target, stamping a disc (used for winding passages, rivers, pockets)
  C.wander=(x,y,tx,ty,wide,ch)=>{ let n=0;
    while((Math.abs(x-tx)>1||Math.abs(y-ty)>1) && n++<400){
      if(rnd()<0.62){ if(Math.abs(tx-x)>Math.abs(ty-y)*(0.6+rnd())) x+=Math.sign(tx-x); else y+=Math.sign(ty-y); }
      else { const d=RIFT_DIRS[ri(4)]; x=Math.max(2,Math.min(W-3,x+d[0])); y=Math.max(2,Math.min(H-3,y+d[1])); }
      C.disc(x,y,wide*(0.7+C.noise(1,x,y,4)*0.9),ch);
    } return [x,y]; };
  // a straight two-segment path of width w; only overwrites cells that are NOT walkable (never paves over existing ground)
  C.path=(x0,y0,x1,y1,w,ch,vertFirst)=>{ const cells=[]; let x=x0, y=y0;
    const put=()=>{ const o=w>>1; for(let j=0;j<w;j++) for(let i=0;i<w;i++){ const X=x-o+i, Y=y-o+j; if(C.inb(X,Y) && !riftWalkCh(C.g[Y][X])) C.g[Y][X]=ch; } cells.push([x,y]); };
    put(); const seg=(horiz)=>{ if(horiz){ while(x!==x1){ x+=Math.sign(x1-x); put(); } } else { while(y!==y1){ y+=Math.sign(y1-y); put(); } } };
    if(vertFirst){ seg(false); seg(true); } else { seg(true); seg(false); } return cells; };
  C.walk=(x,y)=>C.g[y]&&C.g[y][x]!==undefined&&riftWalkCh(C.g[y][x]);
  C.near=(x,y,r)=>Math.abs(x-C.entry.x)<=r&&Math.abs(y-C.entry.y)<=r;   // inside the safe square around the entry
  return C;
}
const RIFT_DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function riftPickEntry(C){   // any side or corner; the arrival facing points into the map
  const {W,H,rnd,ri}=C, s=ri(8), m=4; let ex=Math.floor(W/2)+ri(9)-4, ey=Math.floor(H/2)+ri(7)-3, ix=0, iy=0;
  const N=s===0||s===4||s===5, S=s===1||s===6||s===7, Wd=s===2||s===4||s===6, E=s===3||s===5||s===7;
  if(N){ ey=m; iy=1; } if(S){ ey=H-1-m; iy=-1; } if(Wd){ ex=m; ix=1; } if(E){ ex=W-1-m; ix=-1; }
  let dir; if(ix&&iy) dir=rnd()<0.5?(iy>0?'down':'up'):(ix>0?'right':'left'); else if(iy) dir=iy>0?'down':'up'; else dir=ix>0?'right':'left';
  C.entry={x:ex,y:ey,ix,iy,dir};
}
// label the 4-connected walkable regions; returns {lab,sizes}
function riftComps(C){
  const {W,H,g}=C, lab=new Int32Array(W*H), sizes=[0]; let n=0; const st=[];
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ if(lab[y*W+x]||!riftWalkCh(g[y][x])) continue;
    n++; sizes[n]=0; lab[y*W+x]=n; st.push(y*W+x);
    while(st.length){ const i=st.pop(); sizes[n]++; const cx=i%W, cy=(i/W)|0;
      for(const [dx,dy] of RIFT_DIRS){ const nx=cx+dx, ny=cy+dy; if(nx<1||ny<1||nx>=W-1||ny>=H-1) continue; const j=ny*W+nx; if(!lab[j]&&riftWalkCh(g[ny][nx])){ lab[j]=n; st.push(j); } } } }
  return {lab,sizes,n};
}
// carve the entry nook and tie it to the biggest walkable region
function riftAttachEntry(C){
  const e=C.entry, {W,H,g}=C;
  const cm=riftComps(C); let main=0; for(let k=1;k<=cm.n;k++) if(!main||cm.sizes[k]>cm.sizes[main]) main=k;
  let best=null;
  for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++){ if(cm.lab[y*W+x]!==main) continue; const d=Math.abs(x-e.x)+Math.abs(y-e.y); if(d>2&&(!best||d<best.d)) best={x,y,d}; }
  for(let y=e.y-1;y<=e.y+1;y++) for(let x=e.x-1;x<=e.x+1;x++) C.set(x,y,C.floorCh);
  if(best){ const vf=Math.abs(e.x-best.x)<Math.abs(e.y-best.y); C.path(e.x,e.y,best.x,best.y,Math.max(2,C.corW),C.carveCh,vf); }
  g[e.y][e.x]=C.floorCh;
}
// everything walkable that the entry cannot reach turns back into the floor's solid fill
function riftPrune(C){
  const {W,H,g}=C, cm=riftComps(C), want=cm.lab[C.entry.y*W+C.entry.x];
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++) if(riftWalkCh(g[y][x]) && cm.lab[y*W+x]!==want) g[y][x]=C.fill;
  C.pockets=C.pockets.filter(p=>riftWalkCh(g[p.y][p.x]));
}
// smooth ground texture: patches of dirt and the lighter grass
function riftTexture(C){
  const {W,H,g}=C; for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ if(g[y][x]!=='e') continue; const v=C.noise2(4,x,y,5); if(v>0.7) g[y][x]='m'; else if(v<0.34) g[y][x]='j'; }
}

/* ---- LAYOUT: GROVE (the original: organic clearings joined by winding paths) ---- */
function riftLayoutGrove(C){
  const {W,H,rnd,ri}=C, e=C.entry; C.fillAll('t');
  const cl=[{ x:Math.max(7,Math.min(W-8,e.x+e.ix*5)), y:Math.max(6,Math.min(H-7,e.y+e.iy*4)), rx:5, ry:3 }];
  const want=Math.round((7+Math.floor(W*H/600))*(C.big?1:C.dens));
  for(let t=0;t<1500 && cl.length<want;t++){
    const c={x:7+ri(W-14), y:7+ri(H-12), rx:4+ri(6), ry:3+ri(4)};
    if(cl.every(o=>Math.hypot(o.x-c.x,(o.y-c.y)*1.3)>(o.rx+c.rx)*0.9+3)) cl.push(c);
  }
  cl.forEach(c=>{ for(let y=c.y-c.ry-3;y<=c.y+c.ry+3;y++) for(let x=c.x-c.rx-3;x<=c.x+c.rx+3;x++){
    const d=((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2; if(d<1+(C.noise2(0,x,y,3)-0.5)*1.3) C.set(x,y,'e'); } });
  const E=[]; const inT=[0], left=cl.map((_,i)=>i).slice(1);
  while(left.length){ let best=null; inT.forEach(i=>left.forEach(j=>{ const d=Math.hypot(cl[i].x-cl[j].x,cl[i].y-cl[j].y); if(!best||d<best.d) best={i,j,d}; }));
    E.push([best.i,best.j,best.d]); inT.push(best.j); left.splice(left.indexOf(best.j),1); }
  const deg=cl.map(()=>0); E.forEach(([i,j])=>{deg[i]++;deg[j]++;});
  const ext=[]; for(let i=0;i<cl.length;i++) for(let j=i+1;j<cl.length;j++){ if(E.some(q=>(q[0]===i&&q[1]===j)||(q[0]===j&&q[1]===i))) continue; const d=Math.hypot(cl[i].x-cl[j].x,cl[i].y-cl[j].y); if(d<24) ext.push([i,j,d]); }
  ext.sort((p,q)=>p[2]-q[2]).slice(0,1+ri(2)).forEach(q=>{ E.push(q); deg[q[0]]++; deg[q[1]]++; });
  const pw=1.4+C.corW*0.45;                               // passage width varies per floor
  E.forEach(([i,j])=>C.wander(cl[i].x,cl[i].y,cl[j].x,cl[j].y,pw,'e'));
  for(let k=0;k<2+ri(3);k++){ const c=cl[1+ri(cl.length-1)]||cl[0], ang=rnd()*Math.PI*2, L=6+ri(6);
    const tx=Math.round(c.x+Math.cos(ang)*(c.rx+L)), ty=Math.round(c.y+Math.sin(ang)*(c.ry+L*0.7));
    if(C.inb(tx,ty)){ const end=C.wander(c.x,c.y,tx,ty,1.2,'e'); C.pockets.push({x:end[0],y:end[1]}); for(let oy=-1;oy<=1;oy++) for(let ox=-2;ox<=2;ox++) C.set(end[0]+ox,end[1]+oy,'e'); } }
  const g=C.g;
  { const c=g.map(r=>r.slice());   // drop lone specks, keep ragged shapes
    for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++){ let n=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if((i||j)&&g[y+j][x+i]==='t') n++;
      if(g[y][x]==='t' && n<=1) c[y][x]='e'; else if(g[y][x]==='e' && n>=8) c[y][x]='t'; }
    for(let y=0;y<H;y++) g[y]=c[y]; }
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const v=C.noise2(2,x,y,6), w=C.noise2(3,x,y,9);   // lakes + rock ridges in the forest mass
    if(g[y][x]==='t'){ if(w>0.64) g[y][x]='q'; else if(v>0.7) g[y][x]='M'; } }
  const clutter=[];
  for(let k=0;k<Math.floor(W*H/90);k++){ const x=3+ri(W-6), y=4+ri(H-7); if(g[y][x]!=='e') continue; const ch=rnd()<0.6?'t':'M', n=2+ri(4); const cells=[[x,y]];
    for(let m=1;m<n;m++){ const b=cells[ri(cells.length)], d=RIFT_DIRS[ri(4)]; cells.push([b[0]+d[0],b[1]+d[1]]); }
    clutter.push({ch,cells}); }
  const keys=[[e.x,e.y]].concat(cl.map(c=>[c.x,c.y]), C.pockets.map(p=>[p.x,p.y])).filter(([x,y])=>riftWalkCh(g[y][x]));
  const reachOK=()=>{ const seen=new Uint8Array(W*H), st=[[e.x,e.y]]; seen[e.y*W+e.x]=1;
    while(st.length){ const [x,y]=st.pop(); for(const [dx,dy] of RIFT_DIRS){ const nx=x+dx, ny=y+dy; if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&!seen[ny*W+nx]&&riftWalkCh(g[ny][nx])){ seen[ny*W+nx]=1; st.push([nx,ny]); } } }
    return keys.every(([x,y])=>seen[y*W+x]); };
  g[e.y][e.x]='e';
  clutter.forEach(c=>{ const prev=c.cells.map(([x,y])=>C.inb(x,y)?g[y][x]:null);
    if(c.cells.some(([x,y])=>!C.inb(x,y)||g[y][x]!=='e'||keys.some(k=>Math.abs(k[0]-x)+Math.abs(k[1]-y)<2))) return;
    c.cells.forEach(([x,y])=>g[y][x]=c.ch);
    if(!reachOK()) c.cells.forEach(([x,y],i)=>g[y][x]=prev[i]); });
  { const seen={}; for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ if(g[y][x]!=='q'||seen[x+','+y]) continue; const st=[[x,y]], body=[]; seen[x+','+y]=1;   // whole lakes only
      while(st.length){ const [cx,cy]=st.pop(); body.push([cx,cy]); RIFT_DIRS.forEach(([dx,dy])=>{ const nx=cx+dx, ny=cy+dy, k=nx+','+ny; if(g[ny]&&g[ny][nx]==='q'&&!seen[k]){ seen[k]=1; st.push([nx,ny]); } }); }
      if(body.length<8) body.forEach(([bx,by])=>g[by][bx]='t'); }
    for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ if(g[y][x]!=='t') continue; let n=0; RIFT_DIRS.forEach(([dx,dy])=>{ if(g[y+dy][x+dx]==='q') n++; }); if(n>=3) g[y][x]='q'; } }
  riftTexture(C);
  const road=(x0,y0,x1,y1)=>{ const sx=Math.sign(x1-x0), sy=Math.sign(y1-y0); let x=x0, y=y0, n=0;   // a little decorative old road
    while((x!==x1||y!==y1) && n++<200){ for(const [ox,oy] of [[0,0],[1,0],[0,1],[1,1]]){ const X=x+ox, Y=y+oy; if(C.inb(X,Y) && riftWalkCh(g[Y][X])) g[Y][X]='p'; } if(x!==x1) x+=sx; else y+=sy; }
    for(const [ox,oy] of [[0,0],[1,0],[0,1],[1,1]]){ const X=x+ox, Y=y+oy; if(C.inb(X,Y) && riftWalkCh(g[Y][X])) g[Y][X]='p'; } };
  E.filter(q=>q[2]<18).sort(()=>rnd()-0.5).slice(0,1+ri(2)).forEach(([i,j])=>{ const A=cl[i], B=cl[j];
    const s0=0.2+rnd()*0.15, s1=0.65+rnd()*0.2, ax=Math.round(A.x+(B.x-A.x)*s0), ay=Math.round(A.y+(B.y-A.y)*s0), bx=Math.round(A.x+(B.x-A.x)*s1), by=Math.round(A.y+(B.y-A.y)*s1);
    if(Math.abs(bx-ax)>=Math.abs(by-ay)){ road(ax,ay,bx,ay); road(bx,ay,bx,by); } else { road(ax,ay,ax,by); road(ax,by,bx,by); } });
  C.cl=cl; C.deg=deg;
}

/* ---- LAYOUT: CAVERN (cellular automata: twisty, pinch points, big chambers) ---- */
function riftLayoutCavern(C){
  const {W,H,rnd,ri}=C; C.fillAll('k'); C.floorCh='e';
  let open;
  for(let attempt=0;attempt<6;attempt++){
    const wallP=0.43+rnd()*0.06-attempt*0.01; open=new Uint8Array(W*H);
    for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++) open[y*W+x]=rnd()<wallP?0:1;
    for(let k=0;k<3+ri(3);k++){ const cx=8+ri(W-16), cy=7+ri(H-14), r=4+rnd()*4;   // a few big chambers
      for(let y=cy-9;y<=cy+9;y++) for(let x=cx-9;x<=cx+9;x++){ if(x<3||y<3||x>=W-3||y>=H-3) continue; const d=Math.hypot((x-cx),(y-cy)*1.2)+(C.noise2(0,x,y,3)-0.5)*3; if(d<r) open[y*W+x]=1; } }
    for(let it=0;it<4+ri(2);it++){ const nx=new Uint8Array(W*H);
      for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++){ let n=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if((i||j)&&!open[(y+j)*W+x+i]) n++; nx[y*W+x]=n>=5?0:n<=3?1:open[y*W+x]; }
      open=nx; }
    let tot=0; for(let i=0;i<W*H;i++) tot+=open[i]; if(tot>W*H*0.32) break;
  }
  for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++) if(open[y*W+x]) C.g[y][x]='e';
  riftTexture(C);
  for(let y=3;y<H-3;y++) for(let x=3;x<W-3;x++){ const v=C.noise2(2,x,y,5); if(C.g[y][x]==='e'||C.g[y][x]==='j'||C.g[y][x]==='m'){ if(v>0.66) C.g[y][x]='m'; } }   // more bare earth underfoot
  // stalagmites in the big chambers, and a few puddles
  for(let y=3;y<H-3;y++) for(let x=3;x<W-3;x++){ if(!'ejm'.includes(C.g[y][x])) continue; let n=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if(riftWalkCh(C.g[y+j][x+i])) n++;
    if(n===9 && rnd()<0.035) C.g[y][x]='M'; else if(n===9 && C.noise2(3,x,y,8)>0.74) C.g[y][x]='q'; }
}

/* ---- LAYOUT: ISLES (islands in a sea, joined by narrow causeways) ---- */
function riftLayoutIsles(C){
  const {W,H,rnd,ri}=C, e=C.entry, sea=riftSeaCh(C.biome); C.fillAll(sea); C.carveCh='b';
  const isl=[{ x:Math.max(7,Math.min(W-8,e.x+e.ix*4)), y:Math.max(6,Math.min(H-7,e.y+e.iy*3)), rx:4, ry:3 }];
  const want=Math.round((6+Math.floor(W*H/520))*C.dens);
  for(let t=0;t<2500 && isl.length<want;t++){
    const c={x:6+ri(W-12), y:6+ri(H-11), rx:2.5+rnd()*5, ry:2+rnd()*3.5};
    if(isl.every(o=>Math.hypot(o.x-c.x,(o.y-c.y)*1.25)>(o.rx+c.rx)+5)) isl.push(c);
  }
  isl.forEach(c=>{ for(let y=Math.floor(c.y-c.ry-3);y<=c.y+c.ry+3;y++) for(let x=Math.floor(c.x-c.rx-3);x<=c.x+c.rx+3;x++){
    const d=((x-c.x)/c.rx)**2+((y-c.y)/c.ry)**2; if(d<1+(C.noise2(0,x,y,3)-0.5)*0.9) C.set(x,y,'e'); } });
  const E=[], inT=[0], left=isl.map((_,i)=>i).slice(1);
  while(left.length){ let best=null; inT.forEach(i=>left.forEach(j=>{ const d=Math.hypot(isl[i].x-isl[j].x,isl[i].y-isl[j].y); if(!best||d<best.d) best={i,j,d}; }));
    E.push([best.i,best.j,best.d]); inT.push(best.j); left.splice(left.indexOf(best.j),1); }
  const deg=isl.map(()=>0); E.forEach(([i,j])=>{deg[i]++;deg[j]++;});
  const ext=[]; for(let i=0;i<isl.length;i++) for(let j=i+1;j<isl.length;j++){ if(E.some(q=>(q[0]===i&&q[1]===j)||(q[0]===j&&q[1]===i))) continue; const d=Math.hypot(isl[i].x-isl[j].x,isl[i].y-isl[j].y); if(d<26) ext.push([i,j,d]); }
  ext.sort((p,q)=>p[2]-q[2]).slice(0,1+ri(3)).forEach(q=>{ E.push(q); deg[q[0]]++; deg[q[1]]++; });
  E.forEach(([i,j])=>{ const A=isl[i], B=isl[j], w=1+(rnd()<0.4?1:0);
    C.path(Math.round(A.x),Math.round(A.y),Math.round(B.x),Math.round(B.y),w,'b',rnd()<0.5); });   // causeways: straight, 1-2 tiles wide, only over sea
  isl.forEach((c,i)=>{ if(i>0 && deg[i]===1) C.pockets.push({x:Math.round(c.x),y:Math.round(c.y)}); });   // leaf islands are the side areas
  riftTexture(C);
  const g=C.g;   // a few trees and rocks on the islands
  for(let k=0;k<Math.floor(W*H/120);k++){ const x=3+ri(W-6), y=4+ri(H-7); if(g[y][x]!=='e'&&g[y][x]!=='j'&&g[y][x]!=='m') continue;
    if(isl.some(c=>Math.abs(c.x-x)<2&&Math.abs(c.y-y)<2)) continue; if(C.near(x,y,3)) continue;
    let n=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if(riftWalkCh(g[y+j][x+i])) n++; if(n===9) g[y][x]=rnd()<0.6?'t':'M'; }
  C.cl=isl; C.deg=deg;
}

/* ---- LAYOUT: RUINS (rectangular rooms, straight corridors, broken walls, pillars, collapsed passages) ---- */
function riftLayoutRuins(C){
  const {W,H,rnd,ri}=C, e=C.entry; C.fillAll('t'); C.floorCh='f'; C.carveCh='f';
  const rooms=[]; const want=Math.round((5+Math.floor(W*H/430))*C.dens);
  for(let t=0;t<1500 && rooms.length<want;t++){
    const w=5+ri(10), h=4+ri(6), x0=4+ri(W-w-8), y0=4+ri(H-h-8);
    if(rooms.every(r=>x0>r.x1+4||x0+w-1<r.x0-4||y0>r.y1+4||y0+h-1<r.y0-4)) rooms.push({x0,y0,x1:x0+w-1,y1:y0+h-1,cx:x0+(w>>1),cy:y0+(h>>1),w,h});
  }
  // first room near the entry
  rooms.forEach(r=>C.rect(r.x0,r.y0,r.x1,r.y1,'f'));
  const E=[], inT=[0], left=rooms.map((_,i)=>i).slice(1);
  while(left.length){ let best=null; inT.forEach(i=>left.forEach(j=>{ const d=Math.abs(rooms[i].cx-rooms[j].cx)+Math.abs(rooms[i].cy-rooms[j].cy); if(!best||d<best.d) best={i,j,d}; }));
    E.push([best.i,best.j,best.d]); inT.push(best.j); left.splice(left.indexOf(best.j),1); }
  const ext=[]; for(let i=0;i<rooms.length;i++) for(let j=i+1;j<rooms.length;j++){ if(E.some(q=>(q[0]===i&&q[1]===j)||(q[0]===j&&q[1]===i))) continue; const d=Math.abs(rooms[i].cx-rooms[j].cx)+Math.abs(rooms[i].cy-rooms[j].cy); if(d<34) ext.push([i,j,d]); }
  ext.sort((p,q)=>p[2]-q[2]);
  const carve=(A,B,w)=>{ const vf=rnd()<0.5; const cells=[]; let x=A.cx, y=A.cy; const put=()=>{ const o=w>>1; for(let j=0;j<w;j++) for(let i=0;i<w;i++) C.set(x-o+i,y-o+j,'f'); cells.push([x,y]); };
    put(); const seg=h=>{ if(h){ while(x!==B.cx){ x+=Math.sign(B.cx-x); put(); } } else { while(y!==B.cy){ y+=Math.sign(B.cy-y); put(); } } }; if(vf){ seg(false); seg(true); } else { seg(true); seg(false); } return cells; };
  const inRoom=(x,y)=>rooms.some(r=>x>=r.x0-1&&x<=r.x1+1&&y>=r.y0-1&&y<=r.y1+1);
  E.forEach(([i,j])=>carve(rooms[i],rooms[j],1+ri(Math.max(1,C.corW))));
  const collapses=[];
  ext.slice(0,1+ri(3)).forEach(([i,j])=>{ const w=1+ri(2), cells=carve(rooms[i],rooms[j],w);
    if(rnd()<0.75){ const mids=cells.filter(([x,y])=>!inRoom(x,y)); if(mids.length>4){ const m=mids[mids.length>>1]; collapses.push({m,w}); } } });
  // pillars in the bigger rooms, a little rubble inside, alcoves through the walls
  rooms.forEach(r=>{ if(r.w>=8&&r.h>=6){ for(let y=r.y0+1;y<=r.y1-1;y+=3) for(let x=r.x0+1;x<=r.x1-1;x+=3) if(rnd()<0.8 && Math.abs(x-r.cx)+Math.abs(y-r.cy)>1) C.set(x,y,'c'); }
    if(rnd()<0.5){ const x=r.x0+1+ri(r.w-2), y=r.y0+1+ri(r.h-2); C.set(x,y,'R'); if(rnd()<0.5) C.set(x+1,y,'R'); } });
  // walls: brick ring around anything walkable; some pieces broken away
  const g=C.g, ring=[];
  for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++){ if(g[y][x]!=='t') continue; let n=false; for(let j=-1;j<=1&&!n;j++) for(let i=-1;i<=1;i++) if(riftWalkCh(g[y+j][x+i])){ n=true; break; } if(n) ring.push([x,y]); }
  ring.forEach(([x,y])=>{ g[y][x]=rnd()<0.14?'t':'B'; });                                 // 14% are broken gaps showing the overgrowth behind
  rooms.forEach((r,i)=>{ if(i>0 && rnd()<0.6){ const side=ri(4); let ax,ay,dx=0,dy=0; if(side===0){ ax=r.x0+1+ri(r.w-2); ay=r.y0-1; dy=-1; } else if(side===1){ ax=r.x0+1+ri(r.w-2); ay=r.y1+1; dy=1; } else if(side===2){ ax=r.x0-1; ay=r.y0+1+ri(r.h-2); dx=-1; } else { ax=r.x1+1; ay=r.y0+1+ri(r.h-2); dx=1; }
    const L=2+ri(3); let ok=true; for(let k=0;k<=L;k++){ const X=ax+dx*k, Y=ay+dy*k; if(!C.inb(X,Y)||(g[Y][X]!=='B'&&g[Y][X]!=='t')){ ok=false; break; } }
    if(ok){ for(let k=0;k<=L;k++) C.set(ax+dx*k,ay+dy*k,'f'); C.pockets.push({x:ax+dx*L,y:ay+dy*L}); for(let k=0;k<=L;k++) for(const s of [-1,1]){ const X=ax+dx*k+(dy?s:0), Y=ay+dy*k+(dx?s:0); if(C.inb(X,Y)&&g[Y][X]==='t') g[Y][X]='B'; } const X=ax+dx*(L+1), Y=ay+dy*(L+1); if(C.inb(X,Y)&&g[Y][X]==='t') g[Y][X]='B'; } } });
  collapses.forEach(({m,w})=>{ for(let j=-w;j<=w;j++) for(let i=-w;i<=w;i++){ const X=m[0]+i, Y=m[1]+j; if(C.inb(X,Y)&&g[Y][X]==='f'&&Math.abs(i)+Math.abs(j)<=w) g[Y][X]='R'; } });
  C.rooms=rooms;
}

/* ---- LAYOUT: RING (one or two concentric ring paths around a lake / pit, spokes between them) ---- */
function riftLayoutRing(C){
  const {W,H,rnd,ri}=C; C.fillAll('t'); const sea=riftSeaCh(C.biome);
  const cx=Math.floor(W/2)+ri(5)-2, cy=Math.floor(H/2)+ri(5)-2, k=(H-8)/(W-8);
  const Rmax=Math.min(cx-4,W-cx-5,(cy-4)/k,(H-cy-5)/k), hw=1+C.corW*0.5;
  const rad=(x,y)=>Math.hypot(x-cx,(y-cy)/k)+(C.noise2(0,x,y,4)-0.5)*1.4;
  const L=Math.max(5,Rmax*(0.26+rnd()*0.1)), r1=L+hw+1.5, two=r1+hw*2+4+ri(3)+hw<Rmax-1, r2=two?r1+hw*2+4+ri(3):0;
  for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++){ const d=rad(x,y);
    if(d<L) C.g[y][x]=sea; else if(Math.abs(d-r1)<=hw||(two&&Math.abs(d-r2)<=hw)) C.g[y][x]='e'; else if(d<r1+hw+0.9&&d>=L) C.g[y][x]='e'; }   // a shore strip on the lake side of ring 1
  const spokes=4+ri(3), a0=rnd()*Math.PI*2; const out=(two?r2:r1)+hw+1+ri(3);
  for(let s=0;s<spokes;s++){ const a=a0+s*Math.PI*2/spokes+(rnd()-0.5)*0.3, dx=Math.cos(a), dy=Math.sin(a);
    for(let d=r1-1;d<=Math.min(out,Rmax);d+=0.5){ const x=Math.round(cx+dx*d), y=Math.round(cy+dy*d*k); C.disc(x,y,1.1+(C.corW>2?0.5:0),'e'); }
    if(rnd()<0.6 && Rmax>out+3){ const ex2=Math.round(cx+dx*(Rmax-2)), ey2=Math.round(cy+dy*(Rmax-2)*k); for(let d=out;d<=Rmax-2;d+=0.5) C.disc(Math.round(cx+dx*d),Math.round(cy+dy*d*k),1.1,'e'); C.pockets.push({x:ex2,y:ey2}); C.rect(ex2-2,ey2-1,ex2+2,ey2+1,'e'); } }
  // the island in the middle, tied to ring 1 by one causeway; the gate wants to sit there
  const ir=2.5+rnd()*1.2; C.disc(cx,cy,ir,'e'); C.disc(cx,cy,ir+0.4,'e');
  const a=rnd()*Math.PI*2; for(let d=ir;d<=L+1;d+=0.5) C.disc(Math.round(cx+Math.cos(a)*d),Math.round(cy+Math.sin(a)*d*k),0.9,'b');
  C.gateHint={x:cx,y:cy};
  riftTexture(C);
  for(let n=0;n<Math.floor(W*H/160);n++){ const x=3+ri(W-6), y=4+ri(H-7); if(C.g[y][x]!=='e'&&C.g[y][x]!=='j'&&C.g[y][x]!=='m') continue; if(C.near(x,y,4)||(Math.abs(x-cx)<ir+2&&Math.abs(y-cy)<ir+2)) continue;
    let q=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if(riftWalkCh(C.g[y+j][x+i])) q++; if(q===9) C.g[y][x]=rnd()<0.5?'t':'M'; }
}

/* ---- LAYOUT: MAZE (a wide-hall maze: broad corridors, loops, dead ends) ---- */
function riftLayoutMaze(C){
  const {W,H,rnd,ri}=C; C.fillAll('t'); const P=4+(C.corW>1?1:0), ox=3, oy=3, cols=Math.floor((W-6)/P), rows=Math.floor((H-6)/P), fw=P-1;
  const seen=new Uint8Array(cols*rows), open=[]; for(let i=0;i<cols*rows;i++) open.push([0,0,0,0]);   // 0=E 1=W 2=S 3=N openings
  const st=[[ri(cols),ri(rows)]]; seen[st[0][1]*cols+st[0][0]]=1;
  while(st.length){ const [x,y]=st[st.length-1], nb=[]; [[1,0,0,1],[-1,0,1,0],[0,1,2,3],[0,-1,3,2]].forEach(([dx,dy,a,b])=>{ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&!seen[ny*cols+nx]) nb.push([nx,ny,a,b]); });
    if(!nb.length){ st.pop(); continue; } const [nx,ny,a,b]=nb[ri(nb.length)]; open[y*cols+x][a]=1; open[ny*cols+nx][b]=1; seen[ny*cols+nx]=1; st.push([nx,ny]); }
  for(let k=0;k<cols*rows*0.14;k++){ const x=ri(cols-1), y=ri(rows-1); if(rnd()<0.5){ open[y*cols+x][0]=1; open[y*cols+x+1][1]=1; } else { open[y*cols+x][2]=1; open[(y+1)*cols+x][3]=1; } }   // braid: loops
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ const X=ox+x*P, Y=oy+y*P; C.rect(X,Y,X+fw-1,Y+fw-1,'e');
    const o=open[y*cols+x], inset=rnd()<0.5?0:1; if(o[0]) C.rect(X+fw,Y+inset,X+fw,Y+fw-1-inset,'e'); if(o[2]) C.rect(X+inset,Y+fw,X+fw-1-inset,Y+fw,'e'); }
  riftTexture(C);
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ if(rnd()<0.22){ const X=ox+x*P+(fw>>1), Y=oy+y*P+(fw>>1); if(!C.near(X,Y,3)) C.set(X,Y,rnd()<0.5?'M':'t'); } }   // an obstacle in some halls
}

/* ---- LAYOUT: HALL (an open field with scattered rocks - the guaranteed fallback) ---- */
function riftLayoutHall(C){
  const {W,H,rnd,ri}=C; C.fillAll('t'); C.rect(3,3,W-4,H-4,'e'); riftTexture(C);
  for(let k=0;k<W*H/60;k++){ const x=4+ri(W-8), y=4+ri(H-8); if(!C.near(x,y,4)) C.set(x,y,rnd()<0.5?'M':'t'); }
}
const RIFT_LAYOUT={ grove:riftLayoutGrove, cavern:riftLayoutCavern, isles:riftLayoutIsles, ruins:riftLayoutRuins, ring:riftLayoutRing, maze:riftLayoutMaze, hall:riftLayoutHall };

/* ---- ANALYSIS: the real movement rules as a graph. Nodes are tiles you can STAND on; moving steps onto the next tile, an
   ICE tile keeps you sliding the same way until the next tile is blocked or is not ice, and a WARP PAD sends you to its twin.
   Returns the forward-reachable set, walking distances, and (when a gate is given) which nodes can still reach it. ---- */
function riftAnalyze(C, gate, blk, startIdx){
  const {W,H,g}=C, N=W*H, cls=new Uint8Array(N), partner=new Int32Array(N).fill(-1);
  for(let y=0;y<H;y++){ const row=g[y]; for(let x=0;x<W;x++){ const ch=row[x]; cls[y*W+x]=RIFT_SOLID.indexOf(ch)>=0?0:ch==='i'?2:ch==='w'?3:1; } }
  if(blk) for(let i=0;i<N;i++) if(blk[i]) cls[i]=0;
  for(const p of C.pads){ partner[p[0]]=p[1]; partner[p[1]]=p[0]; }
  const D=[1,-1,W,-W], seen=new Uint8Array(N), dist=new Int32Array(N).fill(-1), E=new Int32Array(N*4).fill(-1), q=new Int32Array(N);
  const i0=startIdx!=null?startIdx:C.entry.y*W+C.entry.x; let qh=0, qt=0, maxD=0; seen[i0]=1; dist[i0]=0; q[qt++]=i0;
  while(qh<qt){ const i=q[qh++]; if(dist[i]>maxD) maxD=dist[i];
    for(let d=0;d<4;d++){ let j=i+D[d]; if(cls[j]===0){ continue; }
      while(cls[j]===2){ const k=j+D[d]; if(cls[k]===0) break; j=k; }
      if(cls[j]===3 && partner[j]>=0) j=partner[j];
      E[i*4+d]=j; if(!seen[j]){ seen[j]=1; dist[j]=dist[i]+1; q[qt++]=j; } } }
  const out={ seen, dist, n:qt, maxD, E, cls, order:q, bad:0 };
  if(gate){ const gi=gate.y*W+gate.x, cnt=new Int32Array(N+1);
    for(let a=0;a<qt;a++){ const i=q[a]; for(let d=0;d<4;d++){ const j=E[i*4+d]; if(j>=0) cnt[j+1]++; } }
    for(let i=0;i<N;i++) cnt[i+1]+=cnt[i];
    const pos=cnt.slice(0,N), pred=new Int32Array(cnt[N]);
    for(let a=0;a<qt;a++){ const i=q[a]; for(let d=0;d<4;d++){ const j=E[i*4+d]; if(j>=0) pred[pos[j]++]=i; } }
    const can=new Uint8Array(N), st=[]; for(let a=0;a<qt;a++){ const i=q[a]; if(i+1===gi||i-1===gi||i+W===gi||i-W===gi){ can[i]=1; st.push(i); } }
    while(st.length){ const j=st.pop(); for(let p=cnt[j];p<cnt[j+1];p++){ const i=pred[p]; if(!can[i]){ can[i]=1; st.push(i); } } }
    let bad=0; for(let a=0;a<qt;a++) if(!can[q[a]]) bad++; out.bad=bad; out.can=can; }
  return out;
}

/* ---- BIOME DRESSING: each biome adds terrain that changes how you move ---- */
function riftRiver(C, ch, wMin, wMax){   // a winding stream of ch across the floor (only over walkable ground)
  const {W,H,rnd,ri}=C, horiz=rnd()<0.5; let x,y,tx,ty;
  if(horiz){ x=3; y=6+ri(H-12); tx=W-4; ty=6+ri(H-12); } else { x=6+ri(W-12); y=3; tx=6+ri(W-12); ty=H-4; }
  const w=wMin+rnd()*(wMax-wMin); let n=0;
  while(n++<900 && (Math.abs(x-tx)>1||Math.abs(y-ty)>1)){
    const mx=horiz?x:y, mt=horiz?tx:ty, cx=horiz?y:x, ct=horiz?ty:tx;   // main axis runs edge to edge, the cross axis meanders
    let nm=mx, nc=cx;
    if(Math.abs(mx-mt)>1) nm+=Math.sign(mt-mx);
    if(rnd()<0.45 || Math.abs(mx-mt)<=1) nc+=(Math.abs(cx-ct)>2&&rnd()<0.7)||Math.abs(mx-mt)<=1 ? Math.sign(ct-cx) : (rnd()<0.5?1:-1);
    if(horiz){ x=nm; y=nc; } else { y=nm; x=nc; }
    x=Math.max(2,Math.min(W-3,x)); y=Math.max(2,Math.min(H-3,y));
    const r=w*0.5*(0.8+C.noise(1,x,y,5)*0.5), R=Math.ceil(r);
    for(let oy=-R;oy<=R;oy++) for(let ox=-R;ox<=R;ox++) if(ox*ox+oy*oy<=r*r){ const X=x+ox, Y=y+oy; if(C.inb(X,Y)&&!C.near(X,Y,4)&&C.walk(X,Y)&&C.g[Y][X]!=='b') C.g[Y][X]=ch; }
  }
}
// join walkable regions that a stream (conv) split apart with 1-wide stone crossings (bch)
function riftBridge(C, conv, bch){
  const {W,H,g}=C;
  for(let iter=0;iter<14;iter++){
    const cm=riftComps(C), main=cm.lab[C.entry.y*W+C.entry.x]; if(cm.n<=1) break;
    const prev=new Int32Array(W*H).fill(-2), q=[]; let found=-1;
    for(let i=0;i<W*H;i++) if(cm.lab[i]===main){ prev[i]=-1; q.push(i); }
    for(let h=0;h<q.length&&found<0;h++){ const i=q[h], x=i%W, y=(i/W)|0;
      for(const [dx,dy] of RIFT_DIRS){ const nx=x+dx, ny=y+dy; if(nx<1||ny<1||nx>=W-1||ny>=H-1) continue; const j=ny*W+nx; if(prev[j]!==-2) continue; const c=g[ny][nx];
        if(riftWalkCh(c)){ if(cm.lab[j]!==main){ prev[j]=i; found=j; break; } } else if(c===conv){ prev[j]=i; q.push(j); } } }
    if(found<0) break;
    for(let j=prev[found];j>=0;j=prev[j]){ const x=j%W, y=(j/W)|0; if(g[y][x]===conv) g[y][x]=bch; }
  }
}
function riftExtraCrossing(C, conv, bch, tries){   // one more crossing so the regions are not a pure tree
  const {W,H,g,ri}=C;
  for(let t=0;t<tries;t++){ const x=3+ri(W-6), y=3+ri(H-6); if(g[y][x]!==conv) continue;
    for(const [dx,dy] of [[1,0],[0,1]]){ let a=0; while(g[y-dy*a-dy]&&g[y-dy*a-dy][x-dx*a-dx]===conv&&a<4) a++; const x0=x-dx*a-dx, y0=y-dy*a-dy; if(!C.walk(x0,y0)||g[y0][x0]===conv) continue;
      let b=0; while(g[y+dy*b]&&g[y+dy*b][x+dx*b]===conv&&b<5) b++; const x1=x+dx*b, y1=y+dy*b; if(b===0||a+b>5||!g[y1]||!C.walk(x1,y1)||g[y1][x1]===conv) continue;
      for(let k=-a;k<b;k++) g[y+dy*k][x+dx*k]=bch; return true; } }
  return false;
}
function riftIce(C){   // ice sheets: always ringed by plain ground, rocks only inside, so a slide always ends
  const {W,H,g,rnd,ri}=C, want=Math.max(3,Math.round(W*H/430*(0.8+rnd()*0.6))); let made=0;
  const plain=ch=>RIFT_PLAIN.indexOf(ch)>=0;
  for(let t=0;t<500&&made<want;t++){
    const cx=5+ri(W-10), cy=5+ri(H-10), rx=2+ri(4), ry=2+ri(3), cells=[], set=new Set();
    for(let y=cy-ry-1;y<=cy+ry+1;y++) for(let x=cx-rx-1;x<=cx+rx+1;x++){ const d=((x-cx)/(rx+0.5))**2+((y-cy)/(ry+0.5))**2; if(d<1+(C.noise2(1,x,y,2.5)-0.5)*0.5){ cells.push([x,y]); set.add(x+','+y); } }
    if(cells.length<6) continue; let ok=true;
    for(const [x,y] of cells){ if(!C.inb(x,y)||C.near(x,y,5)){ ok=false; break; }
      for(let j=-1;j<=1&&ok;j++) for(let i=-1;i<=1;i++){ const X=x+i, Y=y+j; if(!C.inb(X,Y)||!plain(g[Y][X])){ ok=false; break; } } if(!ok) break; }
    if(!ok) continue;
    cells.forEach(([x,y])=>g[y][x]='i'); made++;
    cells.forEach(([x,y])=>{ let inner=true; for(let j=-1;j<=1&&inner;j++) for(let i=-1;i<=1;i++) if(g[y+j][x+i]!=='i'){ inner=false; break; }   // an interior rock now and then (never touching another)
      if(!inner||rnd()>0.14) return; for(let j=-1;j<=1&&inner;j++) for(let i=-1;i<=1;i++) if(g[y+j][x+i]==='M') inner=false; if(inner) g[y][x]='M'; });
  }
}
function riftPads(C){   // warp pads in linked pairs, far apart by walking distance
  const {W,H,g,rnd,ri}=C, n=1+(W*H>2300?1:0)+(rnd()<0.4?1:0), D=[1,-1,W,-W];
  const okAt=(x,y)=>{ if(!C.inb(x,y)||C.near(x,y,5)||RIFT_PLAIN.indexOf(g[y][x])<0) return false;
    for(let j=-2;j<=2;j++) for(let i=-2;i<=2;i++){ const c=(g[y+j]||[])[x+i]; if(c==='i'||c==='w') return false; } return true; };
  const A0=riftAnalyze(C,null,null);
  for(let p=0;p<n;p++){
    for(let t=0;t<200;t++){ const x=3+ri(W-6), y=3+ri(H-6); if(!okAt(x,y)||!A0.seen[y*W+x]) continue;
      const ia=y*W+x, dd=new Int32Array(W*H).fill(-1), q=[ia]; dd[ia]=0;   // plain walking distance from A
      for(let h=0;h<q.length;h++){ const i=q[h]; for(let d=0;d<4;d++){ const j=i+D[d]; if(dd[j]<0&&riftWalkCh(g[(j/W)|0][j%W])){ dd[j]=dd[i]+1; q.push(j); } } }
      for(let t2=0;t2<200;t2++){ const x2=3+ri(W-6), y2=3+ri(H-6), ib=y2*W+x2; if(!okAt(x2,y2)||dd[ib]<16) continue;
        g[y][x]='w'; g[y2][x2]='w'; C.pads.push([ia,ib]); t=999; break; } }
  }
}
function riftDress(C){
  const {W,H,g,rnd,ri,biome}=C, plain=ch=>'ejm'.indexOf(ch)>=0;
  if(biome==='verdant'){ const sc=4+rnd()*3, th=0.58+rnd()*0.07;   // tall grass: risk you can read from the map
    for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++) if(plain(g[y][x]) && !C.near(x,y,3) && C.noise2(2,x,y,sc)>th) g[y][x]='g'; }
  else if(biome==='ember'){
    for(let y=2;y<H-2;y++) for(let x=2;x<W-2;x++) if(plain(g[y][x]) && C.noise2(4,x,y,5)>0.3) g[y][x]='a';   // ash and cracked ground
    if(C.arch!=='isles' && C.arch!=='ring'){ const n=1+(W*H>2200?1:0)+ri(2); for(let k=0;k<n;k++) riftRiver(C,'l',2,4); riftBridge(C,'l','b'); if(rnd()<0.8) riftExtraCrossing(C,'l','b',300); } }
  else if(biome==='glacier'){ riftIce(C); }
  else if(biome==='voidic'){
    if(C.arch!=='isles' && C.arch!=='ring' && rnd()<0.6){ riftRiver(C,'u',2,3); riftBridge(C,'u','b'); riftExtraCrossing(C,'u','b',200); }
    riftPrune(C); riftPads(C); }
}

/* ---- GATE + GUARDIAN ---- */
function riftPlaceGate(C, guardFloor){
  const {W,H,g}=C, A=riftAnalyze(C,null,null), cand=[];
  for(let a=0;a<A.n;a++){ const i=A.order[a], x=i%W, y=(i/W)|0; if(RIFT_PLAIN.indexOf(g[y][x])<0||C.near(x,y,8)) continue;
    let open=0, ok=true; for(let j=-1;j<=1;j++) for(let k=-1;k<=1;k++){ if(!j&&!k) continue; const c=g[y+j][x+k]; if(riftWalkCh(c)) open++; if(c==='i'||c==='w'||c==='b') ok=false; }
    if(ok&&open>=(C.relaxGate?4:6)) cand.push(i); }
  cand.sort((p,q)=>A.dist[q]-A.dist[p]);
  const list=cand.slice(0,40); if(C.gateHint){ const hi=C.gateHint.y*W+C.gateHint.x; if(A.seen[hi]&&RIFT_PLAIN.indexOf(g[C.gateHint.y][C.gateHint.x])>=0) list.unshift(hi); }
  for(const i of list){ const x=i%W, y=(i/W)|0, old=g[y][x]; g[y][x]='X';
    const B=riftAnalyze(C,{x,y},C.blk);
    if(B.n===A.n-1 && B.bad===0){
      if(!guardFloor) return {x,y,A:B};
      const nbs=RIFT_DIRS.map(([dx,dy])=>[x+dx,y+dy]).filter(([nx,ny])=>RIFT_PLAIN.indexOf(g[ny][nx])>=0&&B.seen[ny*W+nx]).sort((p,q)=>B.dist[p[1]*W+p[0]]-B.dist[q[1]*W+q[0]]);
      for(const [nx,ny] of nbs){ C.blk[ny*W+nx]=1; const B2=riftAnalyze(C,{x,y},C.blk);
        if(B2.n===B.n-1 && B2.bad===0) return {x,y,gx:nx,gy:ny,A:B2}; C.blk[ny*W+nx]=0; } }
    g[y][x]=old; }
  return null;
}

/* ---- THINGS TO FIND: spring, altar, cache + key, wanderer, nests, roamers, the guardian, chests, flora ---- */
const WANDERER_SPR = ['villager1','villager2','villager3','xenomerchant'];
const WANDERER_LINES = [
  ["The floor remembers","every step you take.","It is not fond of you."],
  ["I was a door once.","Now I only walk.","Go on. The gate waits."],
  ["Do not count the","stars down here. They","count you back."],
  ["Something sleeps near","the gate. Something","hungry and polite."],
  ["Your shadow left an","hour ago. Did you not","notice? How odd."],
  ["The rift hums your","name. Wrongly.","Do not correct it."],
  ["Take care. The dark","is only the rift","blinking slowly."],
  ["I would trade, but","I forgot what I own.","Perhaps this is it."],
];
function riftPlaceThings(C, gate, guard, pool){
  const {W,H,g,rnd,ri,depth}=C, objs=C.objs, blk=C.blk, gx=gate.x, gy=gate.y, ex=C.entry.x, ey=C.entry.y;
  const used=new Uint8Array(W*H); used[ey*W+ex]=1; used[gy*W+gx]=1; if(guard) used[guard.y*W+guard.x]=1;
  let A=gate.A; const maxD=Math.max(1,A.maxD), placed=[];
  const P=[];
  for(let a=0;a<A.n;a++){ const i=A.order[a], x=i%W, y=(i/W)|0; if(RIFT_PLAIN.indexOf(g[y][x])<0||used[i]||blk[i]) continue;
    let open=0, solid4=0; for(let j=-1;j<=1;j++) for(let k=-1;k<=1;k++){ if((j||k)&&riftWalkCh(g[y+j][x+k])) open++; }
    for(const [dx,dy] of RIFT_DIRS) if(!riftWalkCh(g[y+dy][x+dx])) solid4++;
    P.push({i,x,y,d:A.dist[i],open,solid4,man:Math.abs(x-ex)+Math.abs(y-ey)}); }
  for(let k=P.length-1;k>0;k--){ const j=ri(k+1), t=P[k]; P[k]=P[j]; P[j]=t; }
  const free=p=>!used[p.i]&&!blk[p.i];
  const spaced=(p,r)=>placed.every(q=>Math.abs(q.x-p.x)+Math.abs(q.y-p.y)>=r);
  const mark=(p,tag)=>{ used[p.i]=1; placed.push({x:p.x,y:p.y,tag}); };
  const solidAt=(p,obj)=>{ blk[p.i]=1; const B=riftAnalyze(C,{x:gx,y:gy},blk); if(B.n===A.n-1&&B.bad===0){ A=B; obj.tx=p.x; obj.ty=p.y; objs.push(obj); mark(p,obj.type); return true; } blk[p.i]=0; return false; };
  const placeSolid=(pred,mk)=>{ let tries=0; for(const p of P){ if(!free(p)||!pred(p)) continue; if(++tries>14) break; const obj=mk(p); if(solidAt(p,obj)) return obj; } return null; };
  const walkAt=(p,obj)=>{ obj.tx=p.x; obj.ty=p.y; objs.push(obj); mark(p,obj.type); return obj; };
  const placeWalk=(pred,mk)=>{ for(const p of P){ if(free(p)&&pred(p)) return walkAt(p,mk(p)); } return null; };
  const out={ chests:0, flora:0, roamers:0, nests:0, spring:0, altar:0, cache:0, key:0, wanderer:0 };
  if(guard){ objs.push({tx:guard.x,ty:guard.y,type:'guardian',sp:guard.sp}); }
  if(!C.plain){
    // SPRING: tucked away at a middling distance; always on a guardian floor
    if(guard||rnd()<RIFT_SPRING_CHANCE){ if(placeSolid(p=>p.d>maxD*0.22&&p.d<maxD*0.9&&p.man>=8&&p.open<=6&&spaced(p,6),()=>({type:'spring'}))) out.spring=1; }
    // ALTAR: out in the open
    if(rnd()<RIFT_ALTAR_CHANCE){ const pick=ri(4); if(placeSolid(p=>p.open>=7&&p.d>maxD*0.2&&p.man>=8&&spaced(p,6),()=>({type:'altar',bless:pick}))) out.altar=1; }
    // CACHE + KEY: the sealed vault chest sits in a dead end, the key lies far away
    if(depth>=2 && rnd()<RIFT_CACHE_CHANCE){ const cache=placeSolid(p=>p.open<=5&&p.d>maxD*0.4&&p.man>=10&&spaced(p,5),()=>({type:'rcache',opened:false}));
      if(cache){ const k=placeWalk(p=>Math.abs(p.x-cache.tx)+Math.abs(p.y-cache.ty)>=18&&p.man>=6&&p.open<=6&&spaced(p,5),()=>({type:'rkey',taken:false}));
        if(k) out.cache=out.key=1; else { const ci=objs.indexOf(cache); objs.splice(ci,1); blk[cache.ty*W+cache.tx]=0; used[cache.ty*W+cache.tx]=0; placed.pop(); A=riftAnalyze(C,{x:gx,y:gy},blk); } } }
    // WANDERER: a lone traveller beside the path
    if(rnd()<RIFT_WANDERER_CHANCE+(depth>=8?0.2:0)){ const mode=rnd(); if(placeSolid(p=>p.open>=5&&p.man>=7&&spaced(p,6),()=>({type:'wanderer',sp:WANDERER_SPR[ri(WANDERER_SPR.length)],line:ri(WANDERER_LINES.length),mode:mode<0.4?'gift':mode<0.7?'sell':'talk',item:['repair_kit','energy_cell','mega_repair','revive_chip','stim_pack','bulwark'][ri(6)]}))) out.wanderer=1; }
    // NESTS: dens in dead ends - step in and the brood wakes
    const nestN=(rnd()<0.55?1:0)+(depth>=6&&rnd()<0.45?1:0);
    for(let k=0;k<nestN;k++){ if(placeWalk(p=>p.open<=5&&p.d>maxD*0.3&&p.man>=9&&spaced(p,6),()=>({type:'nest',done:false}))) out.nests++; }
    // ROAMERS: wandering monsters in the open ground
    const roamN=depth===1?(rnd()<0.5?1:0):Math.min(RIFT_ROAMER_MAX,1+(depth>=4?1:0)+(depth>=9?1:0));
    for(let k=0;k<roamN;k++){ const sp=pool[ri(pool.length)]; if(placeWalk(p=>p.open>=7&&p.man>=12&&spaced(p,9),()=>({type:'roamer',sp,hx:0,hy:0,rad:4})) ){ const o=objs[objs.length-1]; o.hx=o.tx; o.hy=o.ty; out.roamers++; } }
  }
  // CHESTS: dead ends and side areas first, then wherever is far from the entry
  const chestN=5+ri(4)+Math.floor(depth/2), pk=new Set(C.pockets.map(p=>p.y*W+p.x));
  const scored=P.filter(p=>free(p)&&p.man>=5&&g[p.y][p.x]!=='p').map(p=>{ let near=false; for(const q of C.pockets) if(Math.abs(q.x-p.x)+Math.abs(q.y-p.y)<=2){ near=true; break; }
    return { p, s:(near?4:0)+(p.open<=4?2.5:p.open<=6?1:0)+p.d/maxD*2+rnd()*1.6 }; }).sort((a,b)=>b.s-a.s);
  for(const {p} of scored){ if(out.chests>=chestN) break; if(!free(p)||!spaced(p,4)) continue; walkAt(p,{type:'riftchest',opened:false}); out.chests++; }
  // FLORA: glowing plants along the edges (the landmarks of a dark floor)
  const floraN=(C.biome==='gloom'?26+ri(12):12+ri(10));
  for(const p of P){ if(out.flora>=floraN) break; if(!free(p)||p.solid4===0||!spaced(p,2)||g[p.y][p.x]==='p') continue; walkAt(p,{type:'rflora',hue:ri(3)}); out.flora++; }
  C.finalA=A; C.counts=out;
  return out;
}

/* ---- one attempt at a whole floor; null when any check fails ---- */
function riftBuildFloor(depth, opts, seed){
  const C=riftNewCtx(depth,seed,opts); riftPickEntry(C);
  RIFT_LAYOUT[C.arch](C);
  riftAttachEntry(C); riftPrune(C);
  C.blk=new Uint8Array(C.W*C.H);
  if(!C.plain){ riftDress(C); riftPrune(C); }
  const {W,H,g}=C, e=C.entry; if(!riftWalkCh(g[e.y][e.x])||'iw'.indexOf(g[e.y][e.x])>=0) return null;
  const A0=riftAnalyze(C,null,null); if(A0.n<Math.max(260,W*H*RIFT_MIN_OPEN)) return null;   // too cramped to be a floor
  const guardFloor=!C.plain && depth%GUARDIAN_EVERY===0;
  let gate=riftPlaceGate(C,guardFloor); if(!gate){ C.relaxGate=true; gate=riftPlaceGate(C,guardFloor); } if(!gate) return null;
  const pool=realmEnemyPool(depth);
  let guard=null; if(gate.gx!=null){ const top=pool.slice(-Math.min(6,pool.length)); guard={x:gate.gx,y:gate.gy,sp:top[C.ri(top.length)]}; }
  C.objs=[]; const counts=riftPlaceThings(C,gate,guard,pool);
  const objects=[{tx:gate.x,ty:gate.y,type:'riftgate'}].concat(C.objs);
  const cls=(C.cl||[]).map((c,i)=>({x:Math.round(c.x),y:Math.round(c.y),rx:c.rx,ry:c.ry,deg:C.deg?C.deg[i]:0,d:A0.dist[Math.round(c.y)*W+Math.round(c.x)]}));
  if(!cls.length){ cls.push({x:e.x,y:e.y,rx:4,ry:3,deg:1,d:0}); }   // archetypes without clearings still give town / grove fields a spot to start from
  MAPS.realm={ str:g.map(r=>r.join('')), objects, doors:[] };
  const pads=C.pads.map(([a,b])=>[[a%W,(a/W)|0],[b%W,(b/W)|0]]);
  return { ex:e.x, ey:e.y, dir:e.dir, gate:{x:gate.x,y:gate.y}, W, H, reach:A0.n, clearings:cls, farIdx:-1, arch:C.arch, biome:C.biome, seed, pads, guardian:guard?{x:guard.x,y:guard.y,sp:guard.sp}:null, counts, maxDist:A0.maxD };
}
let riftGenFails=0;   // attempts thrown away (diagnostics)
// the dispatcher: opts {arch, biome, seed, big, plain}; same result shape as before plus arch/biome/seed/pads/guardian
function generateRealm(depth, opts){
  opts=opts||{}; const big=!!opts.big, biome=opts.biome||'verdant';
  const arch=big?'grove':(opts.arch||pickArch(depth,biome,null));
  const seed0=opts.seed!=null?(opts.seed>>>0):((depth*2654435761+(Date.now()&0xffffffff)+Math.floor(Math.random()*1e9))>>>0);
  let lastErr=null;
  for(let k=0;k<12;k++){
    const seed=(seed0+Math.imul(k,0x9E3779B1))>>>0;
    try{ const r=riftBuildFloor(depth,{big,arch:k<9?arch:'hall',biome,plain:opts.plain},seed); if(r){ r.attempts=k+1; r.seedUsed=seed; r.seed=seed; return r; } }
    catch(err){ lastErr=err; if(opts.strict) throw err; }
    riftGenFails++;
  }
  throw lastErr||new Error('rift floor generation failed');
}

/* ---- SPECIAL RIFT FLOORS: a small chance a DESCENT lands somewhere strange ----
   The generic realm is unchanged. On descent we roll a rare 'biome'; more kinds slot
   into rollRiftKind over time (vault now; shrine / town / mush-field to come). */
function rollRiftKind(depth){
  if(depth < 2) return 'normal';                     // the very first dive is always an ordinary realm
  const r=Math.random();
  if(depth >= 4 && r < SHRINE_CHANCE) return 'shrine';                                                   // a LEGENDARY's lair
  if(depth >= 4 && r < SHRINE_CHANCE + TOWN_CHANCE) return 'town';                                       // an alien village
  if(depth >= 3 && r < SHRINE_CHANCE + TOWN_CHANCE + MUSHFIELD_CHANCE) return 'mushfield';               // an abandoned spore grove
  if(r < SHRINE_CHANCE + TOWN_CHANCE + MUSHFIELD_CHANCE + VAULT_CHANCE) return 'vault';                  // a treasure vault
  return 'normal';
}

// TREASURE VAULT: a void chamber packed with chests + an exit gate, and NOTHING to fight.
function generateVault(depth){
  const W=30, H=20, g=[];
  for(let y=0;y<H;y++){ const row=[]; for(let x=0;x<W;x++){
    row.push((x===0||y===0||x===W-1||y===H-1) ? 'W' : (((x*3+y*5)%7===0)?'v':'V')); } g.push(row); }
  const ex=Math.floor(W/2), ey=2; g[ey][ex]='V'; if(g[ey+1]) g[ey+1][ex]='V';
  const gx=Math.floor(W/2), gy=H-3; g[gy][gx]='X';                 // exit gate on the far side
  const objects=[{tx:gx,ty:gy,type:'riftgate'}];
  const used=new Set([ex+','+ey, ex+','+(ey+1), gx+','+gy, gx+','+(gy-1)]);
  const chestN = 18 + Math.floor(depth/2) + Math.floor(Math.random()*7);
  let placed=0, tries=0;
  while(placed<chestN && tries++<800){
    const x=1+Math.floor(Math.random()*(W-2)), y=1+Math.floor(Math.random()*(H-2)), k=x+','+y;
    if(used.has(k)) continue;
    if(Math.abs(x-ex)+Math.abs(y-ey)<2) continue;                 // keep the entry clear
    if(Math.abs(x-gx)+Math.abs(y-gy)<2) continue;                 // keep the gate reachable
    used.add(k); objects.push({tx:x,ty:y,type:'riftchest',opened:false,vault:true}); placed++;
  }
  MAPS.realm={ str:g.map(r=>r.join('')), objects, doors:[] };
  return {ex, ey, gate:{x:gx,y:gy}, W, H, reach:W*H};
}
// LEGENDARY SHRINE: a small lair holding one hidden legendary. Challenge it, or slip past to the gate.
function generateShrine(depth, legId){
  const W=22, H=16, g=[];
  for(let y=0;y<H;y++){ const row=[]; for(let x=0;x<W;x++){
    row.push((x===0||y===0||x===W-1||y===H-1) ? 'W' : (((x+y)%6===0)?'v':'V')); } g.push(row); }
  const ex=Math.floor(W/2), ey=2; g[ey][ex]='V'; if(g[ey+1]) g[ey+1][ex]='V';
  const lx=Math.floor(W/2), ly=Math.floor(H/2);                  // legendary on a central altar
  const gx=Math.floor(W/2), gy=H-3; g[gy][gx]='X';               // exit gate beyond it
  const objects=[ {tx:gx,ty:gy,type:'riftgate'}, {tx:lx,ty:ly,type:'legendmon',sp:legId} ];
  [[2,2],[W-3,2],[2,H-3],[W-3,H-3]].forEach(c=>{ if(Math.abs(c[0]-lx)+Math.abs(c[1]-ly)>3) objects.push({tx:c[0],ty:c[1],type:'riftchest',opened:false,vault:true}); });
  MAPS.realm={ str:g.map(r=>r.join('')), objects, doors:[] };
  return {ex, ey, gate:{x:gx,y:gy}, W, H, reach:W*H};
}

// ABANDONED SPORE GROVE: a dark wild field strewn with grown mushrooms to harvest -- but tougher beasts roam it.
function generateMushField(depth){   // (3.74) a big new-style floor; wild mushrooms grow in patches in its clearings
  const r = generateRealm(depth, {big:true, biome:'gloom'});
  const mp = MAPS.realm, rows = mp.str.map(z=>z.split(''));
  const occ = new Set(mp.objects.map(o=>o.tx+','+o.ty)); occ.add(r.ex+','+r.ey);
  const els = Object.keys(MUSH);
  const mushN = 70 + depth*5 + Math.floor(Math.random()*20);                 // a bumper crop: worth braving the tougher packs for
  const patches = [r.clearings[0]].concat(r.clearings.slice(1).sort(()=>Math.random()-0.5));   // a patch right where you land, so it's obvious from the start
  let placed=0;
  for(let pi=0; pi<patches.length*6 && placed<mushN; pi++){ const c=patches[pi%patches.length], el=els[Math.floor(Math.random()*els.length)], n=5+Math.floor(Math.random()*6);
    for(let k=0, t=0; k<n && t<60 && placed<mushN; t++){ const x=c.x+Math.round((Math.random()-0.5)*c.rx*1.8), y=c.y+Math.round((Math.random()-0.5)*c.ry*1.8), key=x+','+y;
      if(occ.has(key) || !rows[y] || !'ejm'.includes(rows[y][x])) continue;
      occ.add(key); mp.objects.push({tx:x,ty:y,type:'wildmush', el:Math.random()<0.75?el:els[Math.floor(Math.random()*els.length)], picked:false}); placed++; k++; } }
  return r;
}
function pickWildMush(o){
  if(o.picked) return; o.picked=true;
  const mk=MUSH[o.el]; if(mk){ G.items[mk.id]=(G.items[mk.id]||0)+1; toast('HARVESTED '+mk.name); }
}
function drawWildMush(px,py,el,picked){
  if(picked){ ctx.fillStyle=PAL.dbrown; ctx.fillRect(px+3,py+6,2,1); return; }            // a picked stub
  const mk=MUSH[el]||MUSH.fire;

  ctx.globalAlpha=0.2+tw*0.6; ctx.fillStyle=mk.glow; ctx.fillRect(px+3,py+2,1,1); ctx.globalAlpha=1;   // wild caps twinkle
}
// ALIEN VILLAGE: a walkable settlement of strange folk, an exclusive vendor, and the gate tucked among the huts.
const ALIEN_NPC_SPR = ['villager1','villager2','villager3'];
const ALIEN_LINES = [
  ["A two-legs, from the OLD","world... we have not seen","your kind since the rift","first tore the sky."],
  ["You reek of the COLISEUM.","Here we do not cage our","beasts, outsider. We trade","with them. Strange of you."],
  ["The gate wanders where it","wills. Look among the","dwellings - it hides where","a stranger forgets to look."],

function generateTown(depth){   // (3.74) a big, quiet stretch of the rift with two or three homes, a couple of locals at each
  const r = generateRealm(depth, {big:true, biome:'voidic'});
  const mp = MAPS.realm, rows = mp.str.map(z=>z.split('')), W=rows[0].length, H=rows.length;
  mp.objects = mp.objects.filter(o=>o.type!=='riftchest');                 // people live here - no loot lying around
  const walk=c=>'ejmpX'.includes(c);
  const used=new Set(mp.objects.map(o=>o.tx+','+o.ty)); used.add(r.ex+','+r.ey);
  const blocks=(x,y)=>mp.objects.some(o=>o.tx===x&&o.ty===y&&(o.type==='hut'||o.type==='npc'||o.type==='merchant'));
  const reachOK=()=>{ const seen=new Uint8Array(W*H), st=[[r.ex,r.ey]]; seen[r.ey*W+r.ex]=1;
    while(st.length){ const [x,y]=st.pop(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H||seen[ny*W+nx]) continue; if(walk(rows[ny][nx])&&!blocks(nx,ny)){ seen[ny*W+nx]=1; st.push([nx,ny]); } } }
    const near=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>seen[(y+dy)*W+(x+dx)]);
    return seen[r.gate.y*W+r.gate.x] && mp.objects.every(o=>!(o.type==='npc'||o.type==='merchant'||o.type==='hut') || near(o.tx,o.ty)); };
  const tryPut=(o)=>{ const k=o.tx+','+o.ty; if(used.has(k)||!rows[o.ty]||!walk(rows[o.ty][o.tx])||rows[o.ty][o.tx]==='X') return false;
    mp.objects.push(o); if(!reachOK()){ mp.objects.pop(); return false; } used.add(k); return true; };
  const homes=[]; const cands=r.clearings.slice(1).filter(c=>c.rx>=4);
  const nHomes=2+Math.floor(Math.random()*2);
  while(homes.length<nHomes && cands.length){ let best=-1, bd=-1;
    cands.forEach((c,i)=>{ const d=Math.min(Math.hypot(c.x-r.ex,c.y-r.ey), ...homes.map(h=>Math.hypot(c.x-h.x,c.y-h.y))); if(d>bd){ bd=d; best=i; } });
    homes.push(cands.splice(best,1)[0]); }
  const HUTS=['althut','althut2','althut3']; let li=0, merchantDone=false;
  homes.forEach((c,hi)=>{
    if(!tryPut({tx:c.x, ty:c.y-1, type:'hut', spr:HUTS[hi%HUTS.length]})) return;
    const spots=[[c.x+2,c.y],[c.x-2,c.y],[c.x+1,c.y+2],[c.x-2,c.y+1],[c.x+3,c.y+1],[c.x,c.y+2]].sort(()=>Math.random()-0.5);
    if(!merchantDone){ for(const [x,y] of spots){ if(tryPut({tx:x,ty:y,type:'merchant',sp:'xenomerchant'})){ merchantDone=true; break; } } }
    let folk=1+Math.floor(Math.random()*2);
    for(const [x,y] of spots){ if(folk<=0) break; if(tryPut({tx:x,ty:y,type:'npc', sp:ALIEN_NPC_SPR[li%ALIEN_NPC_SPR.length], lines:ALIEN_LINES[li%ALIEN_LINES.length]})){ li++; folk--; } }
  });
  if(!merchantDone){ for(let t=0;t<400&&!merchantDone;t++){ const c=r.clearings[1+Math.floor(Math.random()*(r.clearings.length-1))]||r.clearings[0]; merchantDone=tryPut({tx:c.x,ty:c.y,type:'merchant',sp:'xenomerchant'}); } }
  const townMon = (typeof SECRET_IDS!=='undefined' && SECRET_IDS.length) ? SECRET_IDS[Math.floor(Math.random()*SECRET_IDS.length)] : null;
  return {ex:r.ex, ey:r.ey, gate:r.gate, W, H, townMon};
}

/* ===== RIFT RUNTIME (overhaul): encounter rate by terrain, ice + warps, the things to find ===== */
// how fast the encounter counter runs on the tile you just stepped onto (1 = the old flat rate). Verdant floors make terrain
// matter (tall grass is risky, open ground and roads are calm); every other biome stays flat except roads.
function riftEncMult(){
  const t=map[player.ty][player.tx];
  if(realm.biome==='verdant' && realm.kind==='normal') return t==='rtall'?RIFT_ENC_GRASS:(t==='rpath'||t==='rbridge')?RIFT_ENC_ROAD:RIFT_ENC_OPEN;
  return (t==='rpath'||t==='rbridge')?RIFT_ENC_FLAT_ROAD:RIFT_ENC_FLAT;
}
// one step on a rift floor: true when an encounter fires now. VOID REPEL silences it, LURE LAMP triples the rate.
function riftEncStep(){
  if(G.repel>0){ G.repel--; return false; }
  let inc=riftEncMult(); if(G.lure>0){ G.lure--; inc*=3; }
  realm.steps+=inc;
  if(realm.steps>=realm.nextEnc){ realm.steps=0; realm.nextEnc=realmNextEnc(realm.kind); return true; }
  return false;
}
function sfxWarp(){ if(!audioCtx||audioMuted) return; try{ resumeAudio(); sweep(260,1100,0.22,'triangle',0.12); }catch(e){} }
function riftWarpTo(x,y){   // a warp pad: appear on its twin with a flash; stepping off and on again re-uses it
  player.tx=x; player.ty=y; player.px=x*8; player.py=y*8; player.fx=player.px; player.fy=player.py; player.t=1; player.moving=false;
  realm.padLock=true; realm.flashAt=Date.now(); resetFollowers(); sfxWarp();
}
// ICE: after a step lands on ice you keep sliding the same way until the next tile is blocked or is not ice
function riftSlideDir(){
  if(!realm || curMap!=='realm' || G.screen!=='OVERWORLD' || dialogue || cut || encTrans || winExit) return null;
  if(map[player.ty][player.tx]!=='rice') return null;
  const d=player.dir, dx=d==='left'?-1:d==='right'?1:0, dy=d==='up'?-1:d==='down'?1:0;
  return tileWalkable(player.tx+dx, player.ty+dy) ? d : null;
}
// everything that happens when a step ends on a rift floor
function riftStepEnd(){
  if(map[player.ty][player.tx]==='rwarp'){ if(!realm.padLock){ const to=realm.padMap&&realm.padMap[player.tx+','+player.ty]; if(to) riftWarpTo(to[0],to[1]); } }
  else realm.padLock=false;
  const lo=objAt(player.tx,player.ty);
  if(lo && lo.type==='wildmush' && !lo.picked){ pickWildMush(lo); }
  else if(lo && lo.type==='legendmon'){ held=null; startLegendEncounter(lo.sp, realm.depth); return; }
  let _got=false;   // forgiving pickup: grab any unopened chest (or a key) on OR right next to the player
  for(const _o of objects){ const near=(Math.abs(_o.tx-player.tx)+Math.abs(_o.ty-player.ty))<=1;
    if(_o.type==='riftchest' && !_o.opened && near){ openRiftChest(_o); _got=true; }
    else if(_o.type==='rkey' && !_o.taken && near){ _o.taken=true; realm.keys=(realm.keys||0)+1; toast('FOUND A KEY'); _got=true; } }
  if(_got) sfxChest();
  if(lo && lo.type==='nest' && !lo.done){ held=null; riftNestFight(lo); return; }
  for(const _o of objects){ if(_o.type==='roamer' && !_o.dead && (Math.abs(_o.tx-player.tx)+Math.abs(_o.ty-player.ty))<=1){ held=null; riftRoamerFight(_o); return; } }
  G.party.forEach(m=>{ const st=computeStats(m); if(m.mp<st.mp) m.mp=Math.min(st.mp, m.mp+1); });   // MP trickles back as you walk; HP must be managed
  if(realm.kind==='normal'||realm.kind==='mushfield'){ if(riftEncStep()){ held=null; startRealmEncounter(); } }
}

function riftLootRoll(rich){   // one roll of the chest table; rich = cache / reward quality (double gold, better mushrooms, fewer scraps)
  const r=Math.random(), d=realm?realm.depth:1;
  if(r<(rich?0.25:0.30)){ const g=Math.round((30+d*18+Math.floor(Math.random()*40))*(rich?2:1)); G.gold+=g; return '+'+g+' GOLD'; }
  if(r<(rich?0.60:0.85)){ const it=['repair_kit','energy_cell','mega_repair','revive_chip','stim_pack','bulwark'][Math.floor(Math.random()*(rich?6:6))]; G.items[it]=(G.items[it]||0)+1; return ITEMS[it].name; }
  const els=Object.keys(MUSH), el=els[Math.floor(Math.random()*els.length)], id=mushIdOf(el, rich?(Math.random()<0.6?2:3):1);
  G.items[id]=(G.items[id]||0)+1; return MUSH_BY_ID[id].name;
}
function riftReward(title, n, rich){   // a guaranteed haul after a roamer / nest / guardian / cache

/* ---- roamers: visible wanderers that notice you and lunge, then lose interest ---- */
const RIFT_ROAM_OK = { rgrass:1, rgrass2:1, rdirt:1, rpath:1, rash:1, rflag:1, rtall:1 };
function riftRoamFree(x,y,self){ if(x<1||y<1||x>=curW-1||y>=curH-1) return false; if(!RIFT_ROAM_OK[map[y][x]]) return false;
  if(player.tx===x&&player.ty===y) return false; for(const o of objects){ if(o!==self && o.tx===x && o.ty===y) return false; } return true; }
function riftRoamUpdate(dt){
  if(!realm || curMap!=='realm' || G.screen!=='OVERWORLD' || dialogue || cut || encTrans || winExit) return;
  for(let n=0;n<objects.length;n++){ const o=objects[n]; if(o.type!=='roamer'||o.dead) continue;
    if(o.mt==null){ o.mt=1; o.fx=o.tx; o.fy=o.ty; o.px=o.tx*8; o.py=o.ty*8; o.wait=700+Math.random()*900; o.cool=1500; o.lunge=0; o.flip=false; o._d=null; }
    o.cool=Math.max(0,o.cool-dt);
    if(o.mt<1){ o.mt=Math.min(1,o.mt+dt/(o.lunge>0?170:480)); o.px=(o.fx+(o.tx-o.fx)*o.mt)*8; o.py=(o.fy+(o.ty-o.fy)*o.mt)*8; continue; }
    if(!player.moving && Math.abs(o.tx-player.tx)+Math.abs(o.ty-player.ty)<=1){ held=null; riftRoamerFight(o); return; }   // touching you: fight
    o.wait-=dt; if(o.wait>0) continue;
    const pdx=player.tx-o.tx, pdy=player.ty-o.ty, pd=Math.abs(pdx)+Math.abs(pdy); let mx=0, my=0;
    if(o.lunge<=0 && o.cool<=0 && pd<=5){ o.lunge=3; o.alertAt=Date.now(); }   // notices you: a short lunge (never a chase)
    if(o.lunge>0){ o.lunge--; if(o.lunge===0) o.cool=3200; const ax=Math.abs(pdx)>=Math.abs(pdy);
      const tryAx=[ax?[Math.sign(pdx),0]:[0,Math.sign(pdy)], ax?[0,Math.sign(pdy)]:[Math.sign(pdx),0]];
      for(const [a,b] of tryAx){ if((a||b) && riftRoamFree(o.tx+a,o.ty+b,o)){ mx=a; my=b; break; } } o.wait=60; }
    else { const opts=RIFT_DIRS.filter(([a,b])=>riftRoamFree(o.tx+a,o.ty+b,o) && Math.abs(o.tx+a-o.hx)+Math.abs(o.ty+b-o.hy)<=o.rad);
      if(opts.length && Math.random()<0.8){ const [a,b]=opts[Math.floor(Math.random()*opts.length)]; mx=a; my=b; } o.wait=500+Math.random()*1100; }
    if(mx||my){ o.fx=o.tx; o.fy=o.ty; o.tx+=mx; o.ty+=my; o.mt=0; if(mx) o.flip=mx<0; }
  }
}

const riftP={ x:new Float32Array(RIFT_PART_N), y:new Float32Array(RIFT_PART_N), vx:new Float32Array(RIFT_PART_N), vy:new Float32Array(RIFT_PART_N), ph:new Float32Array(RIFT_PART_N), bio:null, t0:0, last:0 };
function riftDrawParts(){
  const cfg=RIFT_PART_CFG[realm.biome]; if(!cfg||realm.kind==='vault'||realm.kind==='shrine') return;
  if(riftP.bio!==realm.biome || riftP.t0!==realm.t0){ riftP.bio=realm.biome; riftP.t0=realm.t0; riftP.last=riftT;
    for(let i=0;i<RIFT_PART_N;i++){ riftP.x[i]=Math.random()*W; riftP.y[i]=Math.random()*H; riftP.vx[i]=cfg.vx[0]+Math.random()*(cfg.vx[1]-cfg.vx[0]); riftP.vy[i]=cfg.vy[0]+Math.random()*(cfg.vy[1]-cfg.vy[0]); riftP.ph[i]=Math.random()*6.28; } }
  const dt=Math.min(50,Math.max(0,riftT-riftP.last))/1000; riftP.last=riftT;
  const cols=cfg.cols, n=Math.min(cfg.n,RIFT_PART_N), t=riftT/1000;
  for(let i=0;i<n;i++){
    let x=riftP.x[i]+(riftP.vx[i]+Math.sin(t*0.9+riftP.ph[i])*4)*dt, y=riftP.y[i]+riftP.vy[i]*dt;
    if(x<-2) x+=W+4; else if(x>W+2) x-=W+4; if(y<-2) y+=H+4; else if(y>H+2) y-=H+4;

    ctx.globalAlpha=a; ctx.fillStyle=cols[i%cols.length]; ctx.fillRect(Math.round(x),Math.round(y),(realm.biome==='glacier'&&(i&3)===0)?2:1,(realm.biome==='glacier'&&(i&3)===0)?2:1);
  }

}

function riftPadMap(pads){ const m={}; (pads||[]).forEach(([a,b])=>{ m[a[0]+','+a[1]]=b; m[b[0]+','+b[1]]=a; }); return m; }   // 'x,y' of a warp pad -> [x,y] of its twin
function enterRealm(depth, kind, forced){   // forced = {arch, biome, seed}: test hook to pick the floor's layout / biome / seed
  // Dying in the rift is a real game over that reverts to your LAST SAVE -- but nothing in the dive path saved,
  // so a death could wipe out everything since your last shop/recruit/mission (cup winnings, purchases, fusions,
  // an entire session). Autosave as a run BEGINS so a rift death costs you the RUN -- the intended risk, since
  // you forfeit the depth core you'd have banked -- rather than hours of progress made before you ever dived.
  if(depth===1){ try{ saveGame(); }catch(e){} }
  kind = kind || rollRiftKind(depth);
  let legId=null, r, biome='verdant';
  if(kind==='shrine'){ legId=pickLegend(); r=generateShrine(depth, legId); }
  else if(kind==='vault'){ r=generateVault(depth); }
  else if(kind==='mushfield'){ r=generateMushField(depth); biome='gloom'; }
  else if(kind==='town'){ r=generateTown(depth); biome='voidic'; }
  else { kind='normal'; biome=(forced&&forced.biome)||pickBiome(); if(depth<=1) riftPrevArch=null; r=generateRealm(depth,{biome, arch:(forced&&forced.arch)||pickArch(depth,biome,riftPrevArch), seed:forced&&forced.seed}); riftPrevArch=r.arch; }   // a new layout archetype every floor (never the same twice running)
  G.party.forEach(m=>{ const st=computeStats(m); if(depth===1){ m.hp=st.hp; m.mp=st.mp; } if(depth>(m.maxFloor||0)) m.maxFloor=depth; });  // top off on the way IN + track deepest floor
  const hasEnc = (kind==='normal'||kind==='mushfield');
  realm={ depth, kind, legId, biome, townMon:r.townMon||null, kills:0, steps:0, nextEnc: (hasEnc ? realmNextEnc(kind) : Infinity), gate:r.gate,
          arch:r.arch||null, seed:r.seed||0, padMap:riftPadMap(r.pads), sealed:!!r.guardian, guardian:r.guardian||null, keys:0, springUsed:false, t0:Date.now(), flash:0, padLock:false };   // (new: arch, seed, pads, guardian seal, keys, spring, arrival time)
  loadMap('realm', r.ex, r.ey, r.dir||'down'); setScreen('OVERWORLD');
  biomeRemap = (kind==='vault'||kind==='shrine') ? null : BIOMES[biome];      // recolor terrain for this floor's biome
  if(depth>=REBIRTH_DROP_FLOOR && Math.random()<rebirthDropChance(depth)){ G.rebirthCores=(G.rebirthCores||0)+1; toast('FOUND A REBIRTH CORE!'); }   // one roll per floor = at most one drop
  // (no room-entry toast -- show, don't tell: let the player discover what each floor is on their own)
}

function startRealmEncounter(){
  const pool=realmEnemyPool(realm.depth); let scale=0.85+realm.depth*0.12;
  let n=1; if(Math.random()<0.45+realm.depth*0.04) n++; if(realm.depth>=4 && Math.random()<0.3) n++;
  if(realm.kind==='mushfield'){ scale*=1.25; n++; }                          // the grove's beasts are stronger and hunt in packs
  const def=[]; for(let i=0;i<Math.min(3,n);i++){ def.push({sp:pool[Math.floor(Math.random()*pool.length)], sc:scale}); }
  // DEEP RIFT (past floor 10): apex SECRET monsters can appear, rare
  if(realm.depth>=11 && def.length && Math.random() < Math.min(0.35, 0.12+(realm.depth-11)*0.015)){
    def[Math.floor(Math.random()*def.length)] = { sp:pickSecret(), sc:+(scale*0.85).toFixed(2) }; }

}
function endRealmEncounter(win){
  if(win) battle.allies.forEach(a=>{ if(a.alive) a.mp=Math.min(a.maxMp, a.mp+Math.round(a.maxMp*RIFT_MP_REFILL)); });   // catch your breath
  battle.allies.forEach(a=>{ if(a.ref){ a.ref.hp=Math.max(0,a.hp); a.ref.mp=a.mp; if(win) a.ref.wins=(a.ref.wins||0)+1; } });   // PERSIST hp + credit the win
  const gained=battle.goldGained, foesKilled=battle.foes.length, onWin=battle.tier&&battle.tier.onWin; battle=null;   // (onWin: a roamer / nest / guardian's reward hook)
  if(win && realm){
    realm.kills+=foesKilled; realm.steps=0; realm.nextEnc=realmNextEnc(realm.kind);
    if(realm.kind==='shrine'){ for(let i=objects.length-1;i>=0;i--){ if(objects[i].type==='legendmon') objects.splice(i,1); } realm._legendBeaten=true; toast('THE LAIR FALLS SILENT'); }
    setScreen('OVERWORLD'); if(gained>0) toast('+'+gained+' GOLD');
    if(onWin) onWin();
  } else {
    // DIED IN THE RIFT - real game over; revert to your last save
    realm=null; G.screen='OVERWORLD';
    startGameOver(()=>{
      restoreMusic(0.6);
      if(hasSave() && loadGame()){ loadMap('bedroom',2,5,'up'); setScreen('OVERWORLD'); toast('RESTORED YOUR LAST SAVE'); }
      else { gotoTitle(); }
    });
  }
}

  if(sk.type==='HEAL'||sk.type==='CURE'||sk.type==='BUFF'){ b.pendAction={type:'skill',skill:id}; b.sub='targetAlly'; b.cursor=Math.max(0,b.allies.filter(z=>z.alive).indexOf(a)); return; }
  b.pendAction={type:'skill',skill:id}; b.sub='target';   // DAMAGE / DEBUFF
  { const fs=b.foes.filter(f=>f.alive); const ti=(a._mem&&a._mem.target)?fs.indexOf(a._mem.target):-1; b.cursor=ti>=0?ti:0; }
}

function battleBack(){
  const b=battle;
  if(b.phase==='ENDLESSWON'){ endBattle(); return; }          // B = retire (keep winnings)
  if(b.phase==='FACTORYWON'){ endBattle(); return; }
  if(b.phase==='VICTORY'||b.phase==='DEFEAT'){ endBattle(); return; }
  if(b.phase!=='CHOOSE') return;
  if(b.sub==='cmd') return;                                   // nothing to step back to: each command happens at once
  if(b.sub==='skill'||b.sub==='item'){ b.cursor=(b.sub==='skill')?1:2; b.sub='cmd'; b.pendAction=null; b.pendItem=null; return; }
  if(b.sub==='mushTarget'){ const it=b.pendAction&&b.pendAction.item; b.sub='item'; b.pendAction=null; b.cursor=Math.max(0,(b.itemList||[]).indexOf(it)); return; }
  if(b.sub==='target'||b.sub==='targetAlly'){ const sk=b.pendAction&&b.pendAction.skill; b.sub = sk ? 'skill' : 'cmd'; b.cursor = sk ? Math.max(0,(b.moveList||[]).indexOf(sk)) : 0; b.pendAction=null; return; }
  if(b.sub==='itemTarget'){ b.sub='item'; const i=(b.itemList||[]).indexOf(b.pendItem); b.cursor=Math.max(0,i); b.pendItem=null; return; }
}

const DEATH_COL={ o:PAL.ink, g:PAL.gold, a:PAL.amber, w:PAL.white, p:PAL.pale };
function drawDeathEmblem(cx, cy, sc){
  const gw=DEATH_EMBLEM[0].length, gh=DEATH_EMBLEM.length;
  const ox=Math.round(cx-(gw*sc)/2), oy=Math.round(cy-(gh*sc)/2);
  for(let y=0;y<gh;y++){ const row=DEATH_EMBLEM[y]; for(let x=0;x<gw;x++){ const ch=row[x]; if(ch==='.') continue; const col=DEATH_COL[ch]; if(!col) continue; ctx.fillStyle=col; ctx.fillRect(ox+x*sc, oy+y*sc, sc, sc); } }
}
let deathScene=null;
/* ---- GAME OVER (3.72): the TV fuzzes out, switches off (the picture collapses to a line, then a dot), then GAME OVER ---- */
const GO_T={ fuzz:30, off:58, dark:78, text:96, end:250 };   // frame marks (TUNE)
function startGameOver(onDone){
  deathScene={ kind:'gameover', t:0, dur:GO_T.end, onDone };
  fadeMusicOut(0.5); try{ sfxTvOff(); }catch(e){}
}
function sfxTvOff(){
  if(!audioCtx||audioMuted) return; resumeAudio(); const t=audioCtx.currentTime, d=sfxGain||masterGain;
  const n=Math.floor(audioCtx.sampleRate*0.55), buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate), ch=buf.getChannelData(0);   // static hiss swelling up...
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1);
  const src=audioCtx.createBufferSource(); src.buffer=buf; const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3000; bp.Q.value=0.7;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.4); g.gain.exponentialRampToValueAtTime(0.0001,t+0.52);
  src.connect(bp); bp.connect(g); g.connect(d); src.start(t); src.stop(t+0.56);
  const o=audioCtx.createOscillator(), og=audioCtx.createGain(); o.type='sine';                                                     // ...then the CRT's falling "pyoooo" as it shuts off
  o.frequency.setValueAtTime(1500,t+0.5); o.frequency.exponentialRampToValueAtTime(60,t+0.95);
  og.gain.setValueAtTime(0.0001,t+0.5); og.gain.exponentialRampToValueAtTime(0.14,t+0.52); og.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
  o.connect(og); og.connect(d); o.start(t+0.5); o.stop(t+1.02);
  const k=audioCtx.createOscillator(), kg=audioCtx.createGain(); k.type='square'; k.frequency.value=40;                              // the little "tunk" of the power going
  kg.gain.setValueAtTime(0.0001,t+0.96); kg.gain.exponentialRampToValueAtTime(0.1,t+0.965); kg.gain.exponentialRampToValueAtTime(0.0001,t+1.06); k.connect(kg); kg.connect(d); k.start(t+0.96); k.stop(t+1.08);
}
function drawBigText(txt, cx, y, sc, col, out){   // the game font, scaled up, with a dark outline (like the title logo)
  const tw=(txt.length*FONT.cw-1)*sc, x0=Math.round(cx-tw/2);
  const stamp=(c,ox,oy)=>{ ctx.fillStyle=c; let x=x0+ox; for(const ch of txt){ const g=FONT.glyphs[ch]||FONT.glyphs['?'];
    for(let ry=0;ry<FONT.ch;ry++){ const row=g[ry]; if(!row) continue; for(let rx=0;rx<FONT.cw;rx++) if(row&(1<<rx)) ctx.fillRect(x+rx*sc, y+oy+ry*sc, sc, sc); } x+=FONT.cw*sc; } };
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) if(dx||dy) stamp(out, dx*(sc-1||1), dy*(sc-1||1));
  stamp(col,0,0);
}
function renderGameOver(){
  const d=deathScene, t=d.t; ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(t<GO_T.fuzz){                                                   // 1) the picture fuzzes out into static
    const a=t/GO_T.fuzz; ctx.globalAlpha=0.25+0.75*a; ctx.drawImage(crtNoiseFrames()[t%4], 0, -((t*5)%16));
    ctx.globalAlpha=0.5*a; ctx.fillStyle=PAL.white; ctx.fillRect(0, Math.round(((t*7)%(H+30))-15), W, 6); ctx.globalAlpha=1;
  } else {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    if(t<GO_T.off){                                                  // 2) CRT switch-off: collapse to a bright line, then to a dot
      const p=(t-GO_T.fuzz)/(GO_T.off-GO_T.fuzz);
      let w,h; if(p<0.55){ const q=p/0.55; h=Math.max(2, Math.round(H*(1-q)*(1-q))); w=W; } else { const q=(p-0.55)/0.45; h=2; w=Math.max(2, Math.round(W*(1-q)*(1-q))); }
      if(p<0.25){ ctx.globalAlpha=0.6; ctx.drawImage(crtNoiseFrames()[t%4], (W-w)>>1, (H-h)>>1, w, h); ctx.globalAlpha=1; }
      ctx.fillStyle=PAL.pale; ctx.globalAlpha=0.35+0.65*p; ctx.fillRect((W-w)>>1, (H-h)>>1, w, h); ctx.globalAlpha=1;
      ctx.fillStyle=PAL.white; ctx.fillRect(((W-w)>>1)+1, (H>>1)-1, Math.max(1,w-2), 2);
    } else if(t<GO_T.dark){                                          // the last dot of light fades
      const a=1-(t-GO_T.off)/(GO_T.dark-GO_T.off); ctx.globalAlpha=a; ctx.fillStyle=PAL.white; ctx.fillRect((W>>1)-1,(H>>1)-1,2,2);
      ctx.globalAlpha=a*0.3; ctx.fillRect((W>>1)-3,(H>>1)-3,6,6); ctx.globalAlpha=1;
    } else if(t>=GO_T.text){                                         // 3) GAME OVER
      const k=t-GO_T.text, fin=Math.min(1,k/24), fout=Math.min(1,(d.dur-t)/30);
      ctx.globalAlpha=Math.max(0,Math.min(fin,fout));
      drawBigText('GAME', W/2, 46, 3, PAL.pink, PAL.navy);
      drawBigText('OVER', W/2, 76, 3, PAL.pink, PAL.navy);
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

let _titleLogo=null;
function titleLogo(){
  if(_titleLogo) return _titleLogo;
  const lines=[['NEON BAZAAR',2,PAL.pink,PAL.navy],['COLISEUM',3,PAL.gold,PAL.dbrown]], gap=3;
  const tw=(t,sc)=>(t.length*FONT.cw-1)*sc, th=sc=>FONT.ch*sc;
  const pad=l=>l[1]*2+2, w=Math.max(...lines.map(l=>tw(l[0],l[1])+pad(l)*2)), h=lines.reduce((a,l)=>a+th(l[1])+pad(l)*2,0)-6+gap;
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const stamp=(t,sc,col,ox,oy)=>{ x.fillStyle=col; let cx=ox; for(const ch of t){ const g=FONT.glyphs[ch]||FONT.glyphs['?'];
      for(let ry=0;ry<FONT.ch;ry++){ const row=g[ry]; if(!row) continue; for(let rx=0;rx<FONT.cw;rx++) if(row&(1<<rx)) x.fillRect(cx+rx*sc, oy+ry*sc, sc, sc); } cx+=FONT.cw*sc; } };
  let y=0;
  lines.forEach(([t,sc,col,sh])=>{ const o=sc-1, so=sc, ox=((w-tw(t,sc))>>1)-1, oy=y+o;
    for(let dx=-o;dx<=o;dx++) for(let dy=-o;dy<=o;dy++) stamp(t,sc,sh,ox+so+dx,oy+so+dy);   // drop shadow
    for(let dx=-o;dx<=o;dx++) for(let dy=-o;dy<=o;dy++) stamp(t,sc,PAL.shadow,ox+dx,oy+dy); // outline
    stamp(t,sc,col,ox,oy); y+=th(sc)+o*2+so-3+gap; });
  return (_titleLogo=c);
}

function drawRealmTile(x,y){
  if(!realm || (realm.kind!=='normal' && realm.kind!=='mushfield' && realm.kind!=='town')){ drawRealmTileClassic(x,y); return; }   // the vault + shrine keep their own look

  const rim=(pool,col,a)=>{ ctx.fillStyle=col; ctx.globalAlpha=a;   // a bright lip on walkable ground that faces a lava / void gap
    if(y>0      && map[y-1][x]===pool) ctx.fillRect(dx,   dy,   8,1);
    if(y<curH-1 && map[y+1][x]===pool) ctx.fillRect(dx,   dy+7, 8,1);
    if(x>0      && map[y][x-1]===pool) ctx.fillRect(dx,   dy,   1,8);
    if(x<curW-1 && map[y][x+1]===pool) ctx.fillRect(dx+7, dy,   1,8); ctx.globalAlpha=1; };
  const shore=(isPool,col,a)=>{ ctx.fillStyle=col; ctx.globalAlpha=a;   // 1px edge on the sides that face land
    if(y>0      && !isPool(map[y-1][x])) ctx.fillRect(dx,   dy,   8,1);
    if(y<curH-1 && !isPool(map[y+1][x])) ctx.fillRect(dx,   dy+7, 8,1);

/* WALK FRAMES: made at load from each look's own art (one foot lifted a pixel), so editing a look in the Sprite Workshop updates its walk too */
function stepFrame(spr, side){
  if(!spr || !spr.rows || spr.rows.length<3) return spr;                    // too small to have feet: use the art as it is
  const rows=spr.rows.map(r=>r.split('')), h=rows.length, w=rows[0].length, a=side?(w>>1):0, b=a+(w>>1);
  for(let x=a;x<b;x++){ rows[h-3][x]=spr.rows[h-2][x]; rows[h-2][x]=spr.rows[h-1][x]; rows[h-1][x]='.'; }
  return S(spr.pal, rows.map(r=>r.join('')));
}
LOOKS.forEach(l=>['','_left','_up'].forEach(sfx=>{ const k=l[0]+sfx; if(SPR[k]){ SPR[k+'_wa']=stepFrame(SPR[k],0); SPR[k+'_wb']=stepFrame(SPR[k],1); } }));
function dirSprite(app, dir, step){                       // step: 0 standing, 1 / 2 the two walk frames
  const base = SPR[app] ? app : 'player';
  const pick = k => (step && SPR[k+(step===1?'_wa':'_wb')]) || SPR[k];
  if(dir==='left')  return { spr: SPR[base+'_left'] ? pick(base+'_left') : pick(base), flip:false };
  if(dir==='right') return { spr: SPR[base+'_left'] ? pick(base+'_left') : pick(base), flip:true  };  // right = mirrored left
  if(dir==='up')    return { spr: SPR[base+'_up'] ? pick(base+'_up') : pick(base), flip:false };
  return { spr: pick(base), flip:false };   // down = the original front view
}

/* ===== NICKNAME a monster (on-screen keyboard + physical typing) ===== */
let naming = null;                 // { mon, buf, upper }
const NAME_LIMIT = 10;
const NAME_ROWS = ['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM.-'];
function openNaming(mon){
  if(!mon || G.screen==='BATTLE') return;
  naming = { mon, buf:(mon.name||'').slice(0,NAME_LIMIT), upper:true, kr:1, kc:0 };   // kr/kc = keyboard cursor
  setScreen('NAMING');
}
// keyboard model shared by the renderer and the d-pad navigation
function buildKeyboard(){
  const rows=[]; const cw=15, ch=13;
  NAME_ROWS.forEach((row,r)=>{
    const rowW=row.length*cw, sx=Math.round((W-rowW)/2), y=38+r*15; const keys=[];
    for(let c=0;c<row.length;c++) keys.push({ type:'char', ch:row[c], x:sx+c*cw, y, w:cw-1, h:ch });
    rows.push(keys);
  });
  const cy=98;
  rows.push([
    { type:'case', x:6,  y:cy, w:30, h:14 },
    { type:'space',x:40, y:cy, w:60, h:14 },
    { type:'del',  x:104,y:cy, w:24, h:14 },
    { type:'ok',   x:132,y:cy, w:22, h:14 },
  ]);
  return rows;
}
function keyLabel(k){
  if(k.type==='char'){ let c=k.ch; if(/[A-Z]/.test(c)&&!naming.upper) c=c.toLowerCase(); return c; }
  return {case:(naming.upper?'abc':'ABC'), space:'SPACE', del:'DEL', ok:'OK'}[k.type]||'';
}
function keyActivate(k){
  if(!naming) return;
  if(k.type==='char'){ let c=k.ch; if(/[A-Z]/.test(c)&&!naming.upper) c=c.toLowerCase(); nameAppend(c); }
  else if(k.type==='case') nameToggleCase();
  else if(k.type==='space') nameAppend(' ');
  else if(k.type==='del') nameDel();
  else if(k.type==='ok') nameConfirm();
}
function namingDir(dir){
  if(!naming) return;
  const rows=buildKeyboard();
  let r=Math.min(naming.kr, rows.length-1), c=Math.min(naming.kc, rows[r].length-1);
  if(dir==='left'){ c=(c-1+rows[r].length)%rows[r].length; }
  else if(dir==='right'){ c=(c+1)%rows[r].length; }
  else { // up/down: move row, then pick the key nearest by horizontal centre
    const curX=rows[r][c].x+rows[r][c].w/2;
    r = dir==='up' ? (r-1+rows.length)%rows.length : (r+1)%rows.length;
    let best=0,bd=1e9; rows[r].forEach((k,i)=>{ const d=Math.abs((k.x+k.w/2)-curX); if(d<bd){bd=d;best=i;} });
    c=best;
  }
  naming.kr=r; naming.kc=c;
}
function namingActivate(){
  if(!naming) return; const rows=buildKeyboard();
  const r=Math.min(naming.kr,rows.length-1), c=Math.min(naming.kc,rows[r].length-1);
  keyActivate(rows[r][c]);
}
function nameAppend(ch){ if(!naming) return; if(naming.buf.length>=NAME_LIMIT) return; naming.buf += ch; }
function nameDel(){ if(!naming) return; naming.buf = naming.buf.slice(0,-1); }
function nameToggleCase(){ if(naming) naming.upper=!naming.upper; }
function nameCancel(){ if(naming && naming.player){ naming=null; if(!charSel) charSel={i:0,t:0}; setScreen('CHARSELECT'); return; } naming=null; setScreen('PARTY'); }
function nameConfirm(){
  if(!naming) return;
  let nm = naming.buf.replace(/\s+/g,' ').trim().slice(0,NAME_LIMIT);
  if(naming.player){ G.playerName = nm || 'KID'; naming=null; charSel=null; beginIntro(); return; }   // new game: your own name
  if(nm.length===0) nm = SPECIES[naming.mon.sp].name;   // never leave it blank
  naming.mon.name = nm; naming=null;
  setScreen('PARTY'); toast('NAMED '+nm);
  try { saveGame(); } catch(e){}                         // persist the new name right away
}
function renderNaming(){
  if(!naming){ setScreen('PARTY'); return; }
  panel(0,0,W,H,{fill:PAL.ink,border:PAL.mid,shadow:false});
  ctx.fillStyle=PAL.mid; ctx.fillRect(0,0,W,13);
  drawText(naming.player?'YOUR NAME':'NICKNAME', 5,3, PAL.white);
  if(naming.player){ const ds=dirSprite(G.appearance,'down'); drawSprite(ds.spr, 5, 16, false); }
  else drawSprite(SPR[SPECIES[naming.mon.sp].spr], 5, 16, false);
  panel(26,17,W-34,15,{fill:PAL.dk,border:PAL.lav});
  const cur = (Math.floor(Date.now()/400)%2===0) ? '_' : ' ';
  drawText(naming.buf+cur, 30, 21, PAL.white, {maxW:96});
  const cnt=naming.buf.length+'/'+NAME_LIMIT; drawText(cnt, W-8-textWidth(cnt), 21, naming.buf.length>=NAME_LIMIT?PAL.gold:PAL.gray);
  const rows=buildKeyboard();
  rows.forEach((keys,r)=>{
    keys.forEach((k,c)=>{
      const focused=(naming.kr===r && naming.kc===c);
      let fill=PAL.dk, border=PAL.mid, tcol=PAL.pale;
      if(k.type==='case'){ fill=PAL.navy; border=PAL.blue; tcol=PAL.steel; }
      else if(k.type==='space'){ border=PAL.lav; }
      else if(k.type==='del'){ border=PAL.orange; tcol=PAL.orange; }
      else if(k.type==='ok'){ border=PAL.green; tcol=PAL.green; }
      if(focused){ fill=PAL.mid; border=PAL.white; tcol=PAL.white; }
      panel(k.x,k.y,k.w,k.h,{fill,border,shadow:false});
      drawTextCenter(keyLabel(k), k.x+k.w/2, k.y+3, tcol);
      reg(k.x,k.y,k.w,k.h, ()=>{ naming.kr=r; naming.kc=c; keyActivate(k); });
    });
  });
  drawTextCenter(naming.player?'D-PAD + A    B:BACK':'D-PAD + A    B:CANCEL', W/2, 118, PAL.gray);
}

/* ---- battle render ---- */
function drawShield(x,y,col){ ctx.fillStyle=col; ctx.fillRect(x+1,y,3,1); ctx.fillRect(x,y+1,5,3); ctx.fillRect(x+1,y+4,3,1); ctx.fillRect(x+2,y+5,1,1); }   // #8: tiny frontline shield glyph
// ---- TARGET RETICULE TINT: read the matchup of the attack you're about to use, BEFORE you commit ----
function pendAtkEl(b){
  const pa=b&&b.pendAction, a=b&&b.actor; if(!pa||!a) return null;
  if(pa.type==='attack') return null;                                                        // #5: basic attacks are neutral now -> reticule stays gold; only SKILLS show a matchup
  if(pa.type==='skill'){ const sk=SKILLS[pa.skill]; if(sk && (sk.type==='DAMAGE'||sk.type==='DAMAGE_ALL')) return sk.el; }
  if(pa.type==='mushthrow'){ const mk=MUSH_BY_ID[pa.item]; if(mk) return mk.el; }   // a thrown mushroom reads its own type
  return null;   // heals, debuffs, items and mush-throws carry no elemental matchup -> neutral colour
}
function reticuleTag(b, foe){
  const el=pendAtkEl(b); if(!el||!foe) return null;

/* ---------- LIGHTING glue: the world is drawn into the game canvas as before; two hooks grab the ground

function lightHook(stage, kind){

  LIGHTING.wd=ctx.getImageData(0,0,W,H);

  const where=G.screen+'|'+curMap+'|'+(realm?realm.depth:'');                 // new room/floor/battle: start counting fresh (loading frames aren't lighting's fault)
  if(where!==LIGHTING.where){ LIGHTING.where=where; LIGHTING.litFrames=0; LIGHTING.lit.length=0; }

  if(!nd){
