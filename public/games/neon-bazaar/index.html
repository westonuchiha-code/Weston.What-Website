// ---- MISSIONS: send a benched beast out for risky spoils (one at a time) ----
function missionChance(m){
  const st=computeStats(m);
  const power = st.hp*0.45 + st.atk + st.def + st.spd + st.mp*0.25;
  const fromStats = Math.max(0, Math.min(32, (power-42)/55*32));   // a weak beast contributes ~nothing; a strong one a lot
  const fromKills = Math.min(58, (m.kills||0)*2.4);                // Coliseum veterancy is the dominant factor
  return Math.max(3, Math.min(95, Math.round(4 + fromStats + fromKills)));  // base 4: a green nobody is a near-guaranteed loss
}
function missionReward(m){ const price=SPECIES[m.sp]?SPECIES[m.sp].price:100; return Math.min(450, Math.round(price*0.45)+40); }
function openMissionSend(){
  setScreen('MENU');
  const benched=G.roster.filter(m=>!G.party.includes(m));
  if(!benched.length){ listMenu({ title:'SEND ON A MISSION', footer:moneyFooter(), onBack:beastShopMenu, items:[
    { text:'NO BENCHED BEASTS', sub:'use ORDER to bench one', col:PAL.gray, disabled:true } ]}); return; }
  const items=benched.map(m=>{ const ch=missionChance(m), k=m.kills||0;
    return { text:m.name, sub:'WIN '+ch+'%   '+k+' KO', right:missionReward(m)+'G', rightCol:PAL.green, col:PAL.lav, spr:SPECIES[m.sp].spr, fn:()=>confirmMission(m) }; });
  listMenu({ title:'SEND ON A MISSION', items, footer:'one beast out at a time', onBack:beastShopMenu, perPage:4 });
}
function confirmMission(m){
  setScreen('MENU');
  const ch=missionChance(m), rew=missionReward(m), comp=Math.max(1, Math.round(sellValue(m)*MISSION_COMP_FRAC));
  listMenu({ title:'SEND '+m.name+'?', footer:ch+'% TO RETURN SAFE', onBack:openMissionSend, items:[
    { text:'SEND IT OUT', sub:'safe: +'+rew+'G    lost: +'+comp+'G', col:PAL.green, fn:()=>sendMission(m,ch,rew,comp) },
    { text:'NOT NOW', col:PAL.pink, fn:openMissionSend },
  ]});
}
// ---- EXPEDITION: a small simulated adventure. Steps (anywhere) + finished Coliseum battles carry the beast from encounter to encounter. ----
function missionStageP(chancePct){ return Math.pow(Math.max(0.0001, chancePct/100), 1/MISSION_STAGES); }   // per-stage win chance: overall = p^stages = the displayed chance
function missionFoeSp(ms, idx){   // a stand-in opponent for the mini-screen (cosmetic): any ordinary species other than the adventurer's own
  const pool=Object.keys(SPECIES).filter(id=>{ const sp=SPECIES[id]; return sp && !sp.secret && !sp.legendary && !sp.boss && id!==ms.sp && SPR[sp.spr]; });
  const seed=((ms.mon&&ms.mon.uid)||1)*7 + idx*13 + 5; return pool[seed % pool.length];
}
function missionStageRoll(ms, quiet){   // one encounter, rolled from the monster's real power (via its stored chance)
  const idx=ms.stage, win=Math.random() < missionStageP(ms.chance), hp0=ms.hp;
  if(win){
    ms.stage++; ms.hp=Math.max(0.18, ms.hp-(0.06+Math.random()*0.12));
    ms.gold += Math.round(ms.reward/MISSION_STAGES*(0.6+0.2*idx)*(0.8+Math.random()*0.4));      // later stages pay more; a full run averages the old flat reward
    if(Math.random()<MISSION_ITEM_CHANCE){ const id=mushIdOf(SPECIES[ms.sp].el, Math.random()<0.2?2:1); ms.loot[id]=(ms.loot[id]||0)+1; }
    if(ms.stage>=ms.stages) ms.status='home';
  } else { ms.status='lost'; ms.hp=0; }
  if(!quiet){
    expo.ev.push({ idx, win, hp0, hp1:ms.hp, sp:missionFoeSp(ms, idx), t:0 });
    if(ms.status==='home'){ toast(ms.name+' IS BACK HOME!'); try{ saveGame(); }catch(e){} }
    else if(ms.status==='lost'){ toast(ms.name+' WAS DEFEATED'); try{ saveGame(); }catch(e){} }
  }
}
function missionAdvance(n){   // n step-equivalents; resolves every encounter they reach
  const ms=G.mission; if(!ms || ms.status!=='out') return;
  ms.prog=(ms.prog||0)+n;
  while(ms.status==='out' && ms.prog>=MISSION_STAGE_STEPS){ ms.prog-=MISSION_STAGE_STEPS; missionStageRoll(ms); }
  if(ms.status!=='out') ms.prog=0;
}
function missionStep(){ const ms=G.mission; if(ms && ms.status==='out') missionAdvance(1); }
function missionBattleDone(){ const ms=G.mission; if(!ms) return; ms.challenges=(ms.challenges||0)+1; missionAdvance(MISSION_BATTLE_STEPS); }
function newMission(m, ch, rew, comp){ return { mon:m, sp:m.sp, name:m.name, chance:ch, reward:rew, comp:comp, challenges:0, stages:MISSION_STAGES, stage:0, prog:0, status:'out', hp:1, gold:0, loot:{} }; }
function missionLootLine(ms){ let n=0; for(const id in ms.loot) n+=ms.loot[id]; return n?('Loot: '+n+' CAP'+(n>1?'S':'')):''; }
function mkMissionFromSave(dm, mk){   // new-format missions load as-is; an old 2-battle mission is converted into the staged model (its finished runs count as stages already walked)
  const ms=newMission(mk(dm.mon), dm.chance, dm.reward, dm.comp); ms.sp=dm.sp; ms.name=dm.name; ms.challenges=dm.challenges||0;
  if(dm.stage!==undefined){ ms.stages=dm.stages||MISSION_STAGES; ms.stage=dm.stage|0; ms.prog=+dm.prog||0; ms.status=dm.status||'out'; ms.hp=(dm.hp==null?1:+dm.hp); ms.gold=dm.gold|0; ms.loot=Object.assign({},dm.loot||{}); }
  else { const n=Math.round(Math.min(2, ms.challenges)*MISSION_STAGES/2); for(let i=0;i<n && ms.status==='out';i++) missionStageRoll(ms, true); }
  return ms;
}

// ---- the mini-screen (virtual-pet 'adventure mode' window) ----
const EXPO_FIGHT_MS = 2700;      // one encounter: slide in 500, five blows of 300, drop-away 700
const expo = { ev:[], cur:null, ph:0, scroll:0, sync:null, view:{ stage:0, hp:1, lost:false } };
const EXPO_FOE_REMAP = { [PAL.white]:PAL.lav, [PAL.pale]:PAL.lav, [PAL.pink]:PAL.red, [PAL.red]:PAL.dbrown, [PAL.orange]:PAL.brown, [PAL.gold]:PAL.amber, [PAL.amber]:PAL.brown,
  [PAL.green]:PAL.teal, [PAL.teal]:PAL.blue, [PAL.blue]:PAL.navy, [PAL.tan]:PAL.brown, [PAL.steel]:PAL.gray, [PAL.lav]:PAL.mid, [PAL.ltgray]:PAL.gray, [PAL.gray]:PAL.mid, [PAL.brown]:PAL.dbrown, [PAL.mid]:PAL.dk };
const EXPO_BG = [   // per-stage backdrop: sky, far layer, near layer, ground, ground dashes, kind
  { sky:PAL.navy,   far:PAL.blue,   near:PAL.mid,    gr:PAL.green, gr2:PAL.teal,   kind:0 },   // 1 rolling hills
  { sky:PAL.dk,     far:PAL.mid,    near:PAL.dbrown, gr:PAL.brown, gr2:PAL.dbrown, kind:1 },   // 2 pine woods
  { sky:PAL.dbrown, far:PAL.brown,  near:PAL.amber,  gr:PAL.tan,   gr2:PAL.amber,  kind:2 },   // 3 desert dunes
  { sky:PAL.ink,    far:PAL.navy,   near:PAL.teal,   gr:PAL.blue,  gr2:PAL.navy,   kind:3 },   // 4 crystal cave
  { sky:PAL.mid,    far:PAL.dk,     near:PAL.lav,    gr:PAL.gray,  gr2:PAL.ink,    kind:4 },   // 5 ruined keep
];
function expoUpdate(dt){
  const ms=G.mission;
  if(!ms){ expo.cur=null; expo.ev.length=0; expo.sync=null; return; }
  if(expo.sync!==ms){ expo.sync=ms; expo.ev.length=0; expo.cur=null; expo.view={ stage:ms.stage, hp:ms.hp, lost:ms.status==='lost' }; }   // a new or freshly loaded expedition
  expo.ph+=dt;
  if(!expo.cur && expo.ev.length){ expo.cur=expo.ev.shift(); expo.cur.t=0; }
  if(expo.cur){ const e=expo.cur; e.t+=dt*(expo.ev.length>1?2.5:1);
    if(e.t>=EXPO_FIGHT_MS){ if(e.win) expo.view.stage=e.idx+1; else expo.view.lost=true; expo.view.hp=e.hp1; expo.cur=null; } }
  else if(ms.status==='out'){ expo.scroll+=dt; expo.view.stage=ms.stage; expo.view.hp=ms.hp; }
}
function expoWinRect(){   // null when the window should not be drawn; else a bottom corner that keeps clear of the player
  if(!G.mission || G.screen!=='OVERWORLD' || cut || dialogue || deathScene || encTrans || winExit) return null;
  const w=44, h=30, c=[[W-w-2,H-h-2],[2,H-h-2]], px=player.px-camX-3, py=player.py-camY-10;
  for(const k of c){ if(px+22<k[0]-2 || px>k[0]+w+2 || py+22<k[1]-2 || py>k[1]+h+2) return {x:k[0], y:k[1], w, h}; }
  return {x:c[0][0], y:c[0][1], w, h};
}
function expoDrawBg(bg, ix, iy, scroll, moving){   // sky + two parallax layers + scrolling ground, clipped to the 40x26 inner window
  ctx.fillStyle=bg.sky; ctx.fillRect(ix, iy+4, 40, 18);
  ctx.fillStyle=PAL.pale; ctx.fillRect(ix+31, iy+7, 2, 2);                                  // a sun / moon
  const fo=Math.floor(scroll*0.010)%24, no=Math.floor(scroll*0.026)%18, go=Math.floor(scroll*0.045)%8;
  for(let k=-1;k<3;k++){ const x=ix+k*24-fo+4, by=iy+22; ctx.fillStyle=bg.far;                                           // far layer (slow)
    if(bg.kind===0){ ctx.fillRect(x,by-5,14,5); ctx.fillRect(x+2,by-7,10,2); ctx.fillRect(x+5,by-8,4,1); }
    else if(bg.kind===1){ for(let r=0;r<7;r++) ctx.fillRect(x+3-(r>>1),by-7+r,1+(r>>1)*2+1,1); ctx.fillRect(x+12,by-5,1,5); ctx.fillRect(x+11,by-5-1,3,2); }
    else if(bg.kind===2){ ctx.fillRect(x,by-3,16,3); ctx.fillRect(x+3,by-5,9,2); ctx.fillRect(x+6,by-6,3,1); }
    else if(bg.kind===3){ for(let r=0;r<8;r++){ const wd=r<4?r*2+1:(7-r)*2+1; ctx.fillRect(x+6-(wd>>1),by-9+r,wd,1); } }
    else { ctx.fillRect(x,by-8,12,8); ctx.fillRect(x,by-10,3,2); ctx.fillRect(x+5,by-10,2,2); ctx.fillRect(x+9,by-10,3,2); } }
  for(let k=-1;k<4;k++){ const x=ix+k*18-no+2, by=iy+22; ctx.fillStyle=bg.near;                                          // near layer (faster)
    if(bg.kind===0){ ctx.fillRect(x,by-3,5,3); ctx.fillRect(x+1,by-4,3,1); }
    else if(bg.kind===1){ ctx.fillRect(x+2,by-5,1,5); ctx.fillRect(x+1,by-7,3,2); ctx.fillRect(x,by-4,5,1); }
    else if(bg.kind===2){ ctx.fillRect(x+2,by-6,2,6); ctx.fillRect(x,by-4,2,1); ctx.fillRect(x+4,by-5,2,1); }
    else if(bg.kind===3){ ctx.fillRect(x+2,by-6,1,6); ctx.fillRect(x+1,by-4,3,3); ctx.fillRect(x+5,by-3,1,3); }
    else { ctx.fillRect(x+1,by-7,3,7); ctx.fillRect(x,by-8,5,1); } }
  ctx.fillStyle=bg.gr; ctx.fillRect(ix, iy+22, 40, 4);                                       // ground
  ctx.fillStyle=PAL.ink; ctx.fillRect(ix, iy+22, 40, 1);                                     // ground line
  ctx.fillStyle=bg.gr2; for(let k=-1;k<6;k++){ ctx.fillRect(ix+k*8-go+1, iy+24, 3, 1); ctx.fillRect(ix+k*8-go+5, iy+25, 2, 1); }
}
function expoSpark(x, y, col){ ctx.fillStyle=col; ctx.fillRect(x-2,y,5,1); ctx.fillRect(x,y-2,1,5); ctx.fillStyle=PAL.white; ctx.fillRect(x,y,1,1); }
function expoDraw(){
  const ms=G.mission, R=expoWinRect(); if(!R) return;
  const v=expo.view, e=expo.cur, ix=R.x+2, iy=R.y+2, st=ms.status;
  const lost=(st==='lost' && !e && expo.ev.length===0), home=(st==='home' && !e && expo.ev.length===0);
  panel(R.x, R.y, R.w, R.h, { fill:PAL.ink, border: lost?PAL.red : home?PAL.green : e?PAL.gold : PAL.lav, shadow:false });
  ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, 40, 26); ctx.clip();
  const bgI=Math.min(MISSION_STAGES-1, e?e.idx:(home?MISSION_STAGES-1:Math.min(v.stage, ms.stage)));
  const bg=EXPO_BG[bgI%EXPO_BG.length], hspr=SPR[SPECIES[ms.sp].spr];
  expoDrawBg(bg, ix, iy, expo.scroll, !e && st==='out');
  const gy=iy+22;   // ground line: sprites stand on it
  if(e){   // ---- an encounter: foe slides in, five blows, the loser drops away ----
    const t=e.t, fsp=SPR[SPECIES[e.sp].spr], hx=ix+3, fx0=ix+23;
    let foeX=fx0, foeDy=0, heroDx=0, heroDy=0, fHeroFlash=false, fFoeFlash=false, spark=null, foeVisible=true, heroVisible=true;
    if(t<500){ const u=t/500; foeX=Math.round(fx0+(1-u)*(ix+42-fx0)); }
    const seq=e.win?['h','f','h','f','h']:['h','f','h','f','f'];
    let heroHp=e.hp0; const foeHits=seq.filter(c=>c==='f').length; let fDone=0;
    for(let i=0;i<5;i++){ const t0=500+i*300; const u=(t-t0)/300; const isF=seq[i]==='f';
      if(t>=t0+150 && isF) fDone++;
      if(u>=0 && u<1){ const lunge=Math.round(Math.sin(Math.min(1,u*2)*Math.PI)*4);
        if(isF){ foeX=fx0-lunge; if(u>0.5){ fHeroFlash=((Math.floor(u*8))%2)===0; heroDx=-1+((Math.floor(u*10))%2)*2; spark=[hx+10, gy-9, PAL.red]; } }
        else { heroDx=lunge; if(u>0.5){ fFoeFlash=((Math.floor(u*8))%2)===0; foeX=fx0+1-((Math.floor(u*10))%2)*2; spark=[fx0+5, gy-9, PAL.gold]; } } } }
    heroHp = e.hp0 + (e.hp1-e.hp0)*(fDone/foeHits);
    const dropU=Math.max(0,Math.min(1,(t-2000)/700));
    if(t>=2000){ if(e.win){ foeDy=Math.round(dropU*12); foeVisible=dropU<1 && ((Math.floor(t/90))%2===0 || dropU>0.5); foeX=fx0; }
                 else { heroDy=Math.round(dropU*12); heroVisible=dropU<1; } }
    if(heroVisible && hspr) drawSprite(hspr, hx+heroDx, gy-16+heroDy, false, fHeroFlash?EXPO_FOE_REMAP:null);
    if(foeVisible && t>=0 && fsp) drawSprite(fsp, foeX, gy-16+foeDy, true, (fFoeFlash?null:EXPO_FOE_REMAP));
    if(spark) expoSpark(spark[0], spark[1], spark[2]);
    v.hp=heroHp;
  } else if(lost){   // ---- lost: the foe stands over a grave marker ----
    const fsp=SPR[SPECIES[missionFoeSp(ms, ms.stage)].spr];
    if(fsp) drawSprite(fsp, ix+24, gy-16+((Math.floor(expo.ph/450)%2)?-1:0), true, EXPO_FOE_REMAP);
    ctx.fillStyle=PAL.ltgray; ctx.fillRect(ix+8, gy-9, 2, 9); ctx.fillRect(ix+5, gy-7, 8, 2); ctx.fillStyle=PAL.gray; ctx.fillRect(ix+9, gy-9, 1, 9);   // a cross
    ctx.fillStyle=PAL.dk; ctx.fillRect(ix+4, gy-1, 10, 1);
  } else if(home){   // ---- home: idle beside a flag and a loot bag ----
    const bob=(Math.floor(expo.ph/600)%2)?-1:0;
    if(hspr) drawSprite(hspr, ix+4, gy-16+bob, false);
    ctx.fillStyle=PAL.pale; ctx.fillRect(ix+31, gy-12, 1, 12); ctx.fillStyle=PAL.gold; ctx.fillRect(ix+32, gy-12, 5, 3); ctx.fillRect(ix+32, gy-9, 3, 1);   // flag
    ctx.fillStyle=PAL.brown; ctx.fillRect(ix+22, gy-5, 6, 5); ctx.fillStyle=PAL.tan; ctx.fillRect(ix+23, gy-6, 4, 1); ctx.fillStyle=PAL.gold; ctx.fillRect(ix+24, gy-3, 2, 2);   // bag
  } else {   // ---- walking in place: a little bob ----
    const bob=(Math.floor(expo.scroll/150)%2)?-1:0, flipLeg=(Math.floor(expo.scroll/150)%2)===1;
    if(hspr) drawSprite(hspr, ix+12, gy-16+bob, false);
    ctx.fillStyle=PAL.shadow; ctx.fillRect(ix+14+(flipLeg?1:0), gy, 10, 1);
  }
  ctx.restore();
  // header row: stage pips + HP bar, or the BACK / LOST banner
  if(home || lost){ ctx.fillStyle=PAL.ink; ctx.fillRect(ix, iy, 40, 7); drawText(home?'BACK':'LOST', ix+8, iy-1, home?PAL.green:PAL.red); }
  else {
    ctx.fillStyle=PAL.ink; ctx.fillRect(ix, iy, 40, 4);
    for(let i=0;i<ms.stages;i++){ const done=i<v.stage, cur=i===v.stage;
      ctx.fillStyle = done?PAL.gold : (cur && ((Math.floor(expo.ph/350))%2===0 || e))?PAL.pale : PAL.mid; ctx.fillRect(ix+1+i*5, iy+1, 4, 2); }
    ctx.fillStyle=PAL.mid; ctx.fillRect(ix+27, iy+1, 12, 2);
    const f=Math.max(0,Math.min(1,v.hp)); ctx.fillStyle=hpCol(f,1); ctx.fillRect(ix+27, iy+1, Math.round(12*f), 2);
  }
}

function sendMission(m,ch,rew,comp){
  if(m._equip){ m._equip.owner=null; m._equip=null; }      // its gear stays safe with you
  if(m._equip2){ m._equip2.owner=null; m._equip2=null; }
  let i=G.party.indexOf(m); if(i>=0) G.party.splice(i,1);
  i=G.roster.indexOf(m); if(i>=0) G.roster.splice(i,1);
  G.mission=newMission(m,ch,rew,comp);
  try{ saveGame(); }catch(e){}

function resolveMission(){   // the expedition's already been played out (status 'home' or 'lost'): pay up here at the shop
  const ms=G.mission, m=ms.mon;
  if(!ms || ms.status==='out') return;
  const success = ms.status==='home';
  G.mission=null;                                          // commit outcome now (safe if interrupted)
  if(success){
    const st=computeStats(m); m.hp=st.hp; m.mp=st.mp;      // rested up on the road
    gainBeast(m); G.gold += ms.gold; for(const id in ms.loot) G.items[id]=(G.items[id]||0)+ms.loot[id];
    try{ saveGame(); }catch(e){}
    const ll=missionLootLine(ms);
    say(['The Beastmaster grins.', ms.name+' returned safely!', '', 'Mission reward:  +'+ms.gold+'G'].concat(ll?[ll]:[]), ()=>beastShopMenu());
  } else {
    G.gold += ms.comp; try{ saveGame(); }catch(e){}        // pay now; narrate after
    fadeMusicOut(0.9);                                      // music fades as he goes quiet...
    say(['The Beastmaster goes quiet.', ms.name+' did not return...'], ()=>{
      startDeathScene(ms.name, ()=>{                        // ...silence, then the emblem + somber tone
        restoreMusic(0.7);
        say(['The Beastmaster speaks softly.', 'For your loss:  +'+ms.comp+'G'], ()=>beastShopMenu());
      });
    });
  }
}

/* ============================================================
   BEDROOM FEATURES + SAVE / LOAD

   Storage is abstracted behind a pluggable adapter so the same game
   runs in a browser AND in a desktop wrapper (Electron / Tauri) for a
   Steam build. At startup we pick the first available backend:

     1) bridge  - a tiny API a desktop wrapper exposes on window.
                  RECOMMENDED for Electron + Steam Cloud. In your
                  Electron preload (contextIsolation on):
                    const {contextBridge}=require('electron');
                    const fs=require('fs'), path=require('path');
                    const file=path.join(process.env.SAVE_DIR||'.', 'neon_bazaar_save.json');
                    contextBridge.exposeInMainWorld('gameStorage',{
                      load:()=>{ try{return fs.readFileSync(file,'utf8');}catch(e){return null;} },
                      save:(s)=>{ try{fs.mkdirSync(path.dirname(file),{recursive:true});
                                       fs.writeFileSync(file,s); return true;}catch(e){return false;} }
                    });
                  Point SAVE_DIR at app.getPath('userData') and register
                  that file with Steam Auto-Cloud for cross-PC saves.
     2) tauri   - Tauri's JS filesystem API (needs withGlobalTauri:true;
                  may need tweaks for your Tauri version).
     3) nodefs  - Electron with nodeIntegration (writes to a file in $HOME).
     4) local   - browser localStorage fallback (the default on the web).

   Reads are cached at boot so the rest of the game can call
   hasSave()/loadGame() synchronously; writes are write-through.
   Everything is wrapped in try/catch so a blocked sandbox never crashes
   the game - it just reports that it can't save.
   ============================================================ */
const SAVE_KEY = 'neon_bazaar_save_v1';   // localStorage key
const SAVE_FILE = 'neon_bazaar_save.json';// filename for file-based backends
const StorageBackends = {
  bridge: {
    name:'bridge',
    available(){ return typeof window!=='undefined' && window.gameStorage && typeof window.gameStorage.save==='function'; },
    async load(){ try { return await window.gameStorage.load(); } catch(e){ return null; } },
    async save(s){ try { return !!(await window.gameStorage.save(s)); } catch(e){ return false; } },
    async clear(){ try { if(window.gameStorage.delete) return !!(await window.gameStorage.delete()); return !!(await window.gameStorage.save('')); } catch(e){ return false; } },
  },
  tauri: {
    name:'tauri',
    available(){ return typeof window!=='undefined' && !!(window.__TAURI__ && window.__TAURI__.fs && window.__TAURI__.path); },
    async load(){ try {
      const fs=window.__TAURI__.fs, path=window.__TAURI__.path;
      const dir=await path.appDataDir(); const file=dir+SAVE_FILE;
      if(fs.exists && !(await fs.exists(file))) return null;
      return await fs.readTextFile(file);
    } catch(e){ return null; } },
    async save(s){ try {
      const fs=window.__TAURI__.fs, path=window.__TAURI__.path;
      const dir=await path.appDataDir();
      if(fs.mkdir) await fs.mkdir(dir,{recursive:true}).catch(()=>{});
      await fs.writeTextFile(dir+SAVE_FILE, s); return true;
    } catch(e){ return false; } },
    async clear(){ try {
      const fs=window.__TAURI__.fs, path=window.__TAURI__.path;
      const dir=await path.appDataDir(); const file=dir+SAVE_FILE;
      if(fs.remove){ await fs.remove(file).catch(()=>{}); } else { await fs.writeTextFile(file,''); }
      return true;
    } catch(e){ return false; } },
  },
  nodefs: {
    name:'nodefs',
    available(){ try { return typeof window!=='undefined' && typeof window.require==='function' && !!window.require('fs'); } catch(e){ return false; } },
    _file(){ const os=window.require('os'), path=window.require('path'); return path.join(os.homedir(), '.neon_bazaar', SAVE_FILE); },
    async load(){ try { const fs=window.require('fs'); const f=this._file(); return fs.existsSync(f)?fs.readFileSync(f,'utf8'):null; } catch(e){ return null; } },
    async save(s){ try { const fs=window.require('fs'), path=window.require('path'); const f=this._file(); fs.mkdirSync(path.dirname(f),{recursive:true}); fs.writeFileSync(f,s); return true; } catch(e){ return false; } },
    async clear(){ try { const fs=window.require('fs'); const f=this._file(); if(fs.existsSync(f)) fs.unlinkSync(f); return true; } catch(e){ return false; } },
  },
  local: {
    name:'local',
    available(){ try { localStorage.setItem('__nb_t','1'); localStorage.removeItem('__nb_t'); return true; } catch(e){ return false; } },
    async load(){ try { return localStorage.getItem(SAVE_KEY); } catch(e){ return null; } },
    async save(s){ try { localStorage.setItem(SAVE_KEY, s); return true; } catch(e){ return false; } },
    async clear(){ try { localStorage.removeItem(SAVE_KEY); return true; } catch(e){ return false; } },
  },
};
let storageBackend = null;   // chosen adapter
let cachedSave = null;       // last-known save string (sync access for the UI)
let STORAGE_OK = false;      // whether saving is available at all
function pickStorageBackend(){
  for(const k of ['bridge','tauri','nodefs','local']){
    const b=StorageBackends[k];
    let ok=false; try { ok=!!b.available(); } catch(e){ ok=false; }
    if(ok) return b;
  }
  return null;
}
function initStorage(){
  storageBackend = pickStorageBackend();   // detection is synchronous
  STORAGE_OK = !!storageBackend;
  if(storageBackend){
    // fill the read cache (async for file backends; resolves within a frame)
    Promise.resolve().then(()=>storageBackend.load()).then(s=>{ cachedSave=s; }).catch(()=>{ cachedSave=null; });
  }
}
function serializeGame(){

    roster:G.roster.map(monData), box:G.box.map(monData),
    party:G.party.map(m=>m.uid),
    equips:G.equips.map(e=>({uid:e.uid,id:e.id,ownerUid:(e.owner?e.owner.uid:null)})),

    stash:{ items:Object.assign({},G.stash.items) },
    essences:G.essences.map(e=>({uid:e.uid,name:e.name,boost:Object.assign({},e.boost)})), rebirthCores:(G.rebirthCores||0),
    farm:{ plots:G.farm.plots.map(p=>p?{uid:p.uid,sp:p.sp,el:p.el,name:p.name, prog:(p.prog||0), mon:(p.mon?monData(p.mon):null)}:null), grown:G.farm.grown.map(r=>r.slice()), grade:G.farm.grade.map(r=>r.slice()), chest:Object.assign({},G.farm.chest), steps:G.farm.steps||0 },
    flags:Object.assign({},G.flags),

function saveGame(){

  let str; try { str=JSON.stringify(serializeGame()); } catch(e){ return false; }

  try { const r=storageBackend.save(str);    // write-through (Promise)
    if(r && typeof r.then==='function') r.then(okk=>{ if(!okk) console.warn('save persist failed'); }).catch(()=>{});
  } catch(e){ return false; }
  return true;
}

  if(!data) return false;
  { const known=d=>!d||!d.sp||!!SPECIES[d.sp]; const all=[].concat(data.roster||[],data.box||[]); if(!all.every(known) || Object.keys(data.owned||{}).some(k=>!SPECIES[k])) return false; }   // 3.83: monsters were renumbered (MON1..MON73); saves from older builds can't load, so a new game starts
  try {
    const byUid={};
    const mk = d => { const m={ uid:d.uid, sp:d.sp, name:d.name, base:Object.assign({},d.base), boost:Object.assign({},d.boost), tempBoost:{hp:0,mp:0,atk:0,def:0,spd:0}, _equip:null, _equip2:null, hp:d.hp, mp:d.mp, kills:d.kills||0, cores:d.cores||0, faints:d.faints||0, wins:d.wins||0, maxFloor:d.maxFloor||0, maxArena:d.maxArena||0 }; m.reborn=(d.reborn!=null)?d.reborn:inferReborn(m); byUid[d.uid]=m; return m; };   // migrate pre-rebirth saves to the right tier; tempBoost inits like makeMonster (mushroom buffs never persist by design)
    G.roster=(data.roster||[]).map(mk);
    G.box=(data.box||[]).map(mk);
    const _plotMons=((data.farm&&data.farm.plots)||[]).map(p=>(p&&p.mon)?mk(p.mon):null);   // committed caretakers (added to byUid for equip reattach)
    G.equips=(data.equips||[]).map(e=>({uid:e.uid,id:e.id,owner:(e.ownerUid!=null?byUid[e.ownerUid]||null:null)}));
    const _eByUid={}; G.equips.forEach(e=>{ _eByUid[e.uid]=e; });           // monster-driven so 2 slots reconstruct correctly
    [].concat(data.roster||[], data.box||[], ((data.farm&&data.farm.plots)||[]).map(p=>p&&p.mon).filter(Boolean)).forEach(d=>{ const m=byUid[d.uid]; if(!m) return;
      if(d.equipUid!=null){ const e=_eByUid[d.equipUid]; if(e){ m._equip=e; e.owner=m; } }
      if(d.equip2Uid!=null){ const e=_eByUid[d.equip2Uid]; if(e){ m._equip2=e; e.owner=m; } } });

    G.items=Object.assign({},data.items||{});

    G.essences=(data.essences||[]).map(e=>({uid:e.uid,name:e.name,boost:Object.assign({},e.boost)})); G.rebirthCores=data.rebirthCores||0;
    G.farm = freshFarm();
    if(data.farm){ const df=data.farm;   // old saves: 3 plots / no grades / no chest -> padded to FARM_PLOTS with defaults
      (df.plots||[]).forEach((p,i)=>{ if(i<FARM_PLOTS && p) G.farm.plots[i]={uid:p.uid,sp:p.sp,el:p.el,name:p.name, mon:(_plotMons[i]||null), prog:(+p.prog||0)}; });
      (df.grown||[]).forEach((r,i)=>{ if(i<FARM_PLOTS) (r||[]).forEach((v,j)=>{ if(j<FARM_SLOTS) G.farm.grown[i][j]=!!v; }); });
      (df.grade||[]).forEach((r,i)=>{ if(i<FARM_PLOTS) (r||[]).forEach((v,j)=>{ if(j<FARM_SLOTS) G.farm.grade[i][j]=Math.max(0,Math.min(3,v|0)); }); });
      for(let i=0;i<FARM_PLOTS;i++) for(let j=0;j<FARM_SLOTS;j++){ if(G.farm.grown[i][j] && !G.farm.grade[i][j]) G.farm.grade[i][j]=1; if(!G.farm.grown[i][j]) G.farm.grade[i][j]=0; }
      for(const id in (df.chest||{})){ if(MUSH_BY_ID[id] && df.chest[id]>0) G.farm.chest[id]=df.chest[id]|0; }

    (G.farm.plots||[]).forEach(pl=>{ if(!pl) return;                                       // repair older caretaker plots -> committed model
      if(!pl.mon){ const mm=[].concat(G.party,G.roster,G.box).find(x=>x && x.uid===pl.uid); if(mm){ pl.mon=mm; G.party=G.party.filter(x=>x!==mm); G.roster=G.roster.filter(x=>x!==mm); G.box=G.box.filter(x=>x!==mm); } }

    { const MAPN={20:16,30:24,45:36,60:48,80:64}; Object.keys(MAPN).forEach(o=>{ if(G.dexClaimed[o]){ G.dexClaimed[MAPN[o]]=true; delete G.dexClaimed[o]; } }); }   // milestones moved with the smaller dex

    if(G.party.length<1 && G.roster.length) G.party=[G.roster[0]];

  } catch(e){ console.error('load failed',e); return false; }
}

// ---------- cutscene runner ----------
function cutActor(key, tx, ty, dir, extra){ return Object.assign({ key, px:tx*8, py:ty*8, dir:dir||'down', vis:true, path:[], spd:1.6, hop:0, hopN:0, bob:0, bouncy:true }, extra||{}); }
function runCut(steps, onDone){
  cut={ steps, i:0, wait:0, onDone, actors:(cut&&cut.actors)||{}, blockWalk:false,
        fx:{ tint:false, dark:false, bed:false, bolt:0, pcB:0, pcBTo:0, burst:null, flash:0, flash0:1, shake:0, fade:0, fadeTo:0, fadeSpd:0.05, fadeCol:'#ffffff', pc:false, arrow:null, hud:true } };
}
function cutWalking(){ if(!cut) return false; for(const k in cut.actors) if(cut.actors[k].path.length) return true; return false; }
function cutTickActor(a){
  if(a.path.length){
    const gx=a.path[0][0]*8, gy=a.path[0][1]*8, dx=gx-a.px, dy=gy-a.py, d=Math.hypot(dx,dy);
    if(Math.abs(dx)>Math.abs(dy)) a.dir = dx<0?'left':'right'; else if(dy!==0) a.dir = dy<0?'up':'down';
    if(d<=a.spd){ a.px=gx; a.py=gy; a.path.shift(); } else { a.px+=dx/d*a.spd; a.py+=dy/d*a.spd; a.bob+=a.spd; }
    if(!a.path.length && a.endDir){ a.dir=a.endDir; a.endDir=null; }   // turn to face something once they arrive
    if(a.isMe){ player.px=a.px; player.py=a.py; player.dir=a.dir; if(!a.path.length){ player.tx=Math.round(a.px/8); player.ty=Math.round(a.py/8); } }
  }
  if(a.hopN>0){ a.hop++; if(a.hop>=12){ a.hop=0; a.hopN--; } }
}
function cutHopOffset(a){
  if(a.hopN>0) return -Math.round(Math.sin(a.hop/12*Math.PI)*(a.hopH||4));           // excited bounce in place
  if(a.bouncy && a.path.length) return -Math.round(Math.abs(Math.sin(a.bob/6*Math.PI))*2);   // little hops while running
  return 0;
}
function cutStep(st){   // returns true when the step should hold the script for a while
  const A=cut.actors, fx=cut.fx;
  if(st.wait!=null && Object.keys(st).length===1){ cut.wait=st.wait; return true; }
  if(st.say){ const lines = typeof st.say==='function' ? st.say() : st.say; say(lines); dialogue.page=true; dialogue.top=!!st.top;
    if(st.who){ dialogue.name=st.who; const a=A[st.who.toLowerCase()];
      if(a && a.vis){
        if(st.who!==cut.lastWho && a.hopN<2){ a.hopN=2; a.hop=0; }                       // a new kid talking: they bounce
        if(!(A.me && A.me.path.length)){ const dx=a.px-player.px, dy=a.py-player.py;      // you turn to whoever is talking
          if(dx||dy) player.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down'); } }
      cut.lastWho=st.who; }
    return true; }
  if(st.spawn){ A[st.spawn]=cutActor(st.key, st.at[0], st.at[1], st.dir, st.extra); return false; }

    a.path = st.path.map(p=>p.slice()); if(st.spd) a.spd=st.spd; a.endDir=st.dir||null;
    if(st.nowait) return false; cut.blockWalk=true; return true; }
  if(st.face){ if(st.face==='me') player.dir=st.dir; else if(A[st.face]) A[st.face].dir=st.dir; return false; }
  if(st.hop){ const a=A[st.hop]; if(a){ a.hopN=st.n||2; a.hop=0; a.hopH=st.h||4; } return false; }
  if(st.seat!=null){ fx.seat=st.seat; return false; }
  if(st.spark){ const m=cut.firstMon; if(m) fx.spark={ x:m.x*8+8, y:m.y*8, n:st.n||30, n0:st.n||30 }; return false; }
  if(st.burstMon){ const m=cut.firstMon; if(m) fx.burst={ x:m.x*8+8, y:m.y*8, n:st.n||12, n0:st.n||12 }; return false; }
  if(st.waitWalk){ cut.blockWalk=true; return true; }                       // knocked out, slumped in the bean bag

  if(st.flash){ fx.flash=st.flash; fx.flash0=st.flash; return false; }
  if(st.shake){ fx.shake=st.shake; return false; }
  if(st.tint!=null){ fx.tint=st.tint; return false; }
  if(st.dark!=null){ fx.dark=st.dark; return false; }                       // room lights off (the monitor + lightning still light it)
  if(st.bed!=null){ fx.bed=st.bed; return false; }                          // you, tucked into bed
  if(st.bolt){ fx.bolt=36; if(st.shake!==0) fx.shake=Math.max(fx.shake, st.big?22:12); try{ sfxThunder(!!st.big); }catch(e){} return false; }   // lightning through the window
  if(st.pcGlow!=null){ fx.pcBTo=st.pcGlow; return false; }                  // monitor glow ramps up
  if(st.burst){ fx.burst={x:st.burst[0], y:st.burst[1], n:st.n||10, n0:st.n||10}; return false; }   // a burst of light where the monsters collide
  if(st.pc!=null){ fx.pc=st.pc; return false; }

  if(st.call){ st.call(); return false; }
  return false;
}
function cutUpdate(){
  if(!cut) return;
  const fx=cut.fx;
  for(const k in cut.actors) cutTickActor(cut.actors[k]);
  if(fx.flash>0) fx.flash--; if(fx.shake>0) fx.shake--; if(fx.bolt>0) fx.bolt--;
  if(fx.pcB!==fx.pcBTo){ fx.pcB += (fx.pcBTo>fx.pcB?1:-1)*0.015; if(Math.abs(fx.pcB-fx.pcBTo)<0.015) fx.pcB=fx.pcBTo; }
  if(fx.burst && --fx.burst.n<=0) fx.burst=null;
  if(fx.spark && --fx.spark.n<=0) fx.spark=null;
  if(fx.fade!==fx.fadeTo){ fx.fade += (fx.fadeTo>fx.fade?1:-1)*fx.fadeSpd; if(Math.abs(fx.fade-fx.fadeTo)<fx.fadeSpd) fx.fade=fx.fadeTo; }
  if(dialogue) return;                                   // a line is up: wait for A
  if(cut.wait>0){ cut.wait--; return; }
  if(cut.blockWalk){ if(cutWalking()) return; cut.blockWalk=false; }
  if(cut.blockFade){ if(fx.fade!==fx.fadeTo) return; cut.blockFade=false; }
  while(cut && cut.i<cut.steps.length){ if(cutStep(cut.steps[cut.i++])) return; }
  if(cut && cut.i>=cut.steps.length && !dialogue){ const cb=cut.onDone; const keepFade=fx.fade; cut=null; if(cb) cb(); }
}
function drawPointer(x,y,dir){   // bouncing gold arrow (points the way it's facing)
  const b=Math.floor(Date.now()/160)%2; ctx.fillStyle=PAL.gold;
  if(dir==='down'){ y+=b; for(let i=0;i<4;i++) ctx.fillRect(x-3+i,y+i,7-2*i,1); }
  else if(dir==='up'){ y-=b; for(let i=0;i<4;i++) ctx.fillRect(x-3+i,y+3-i,7-2*i,1); }
  else if(dir==='left'){ x-=b; for(let i=0;i<4;i++) ctx.fillRect(x+3-i,y-3+i,1,7-2*i); }
  else { x+=b; for(let i=0;i<4;i++) ctx.fillRect(x+i,y-3+i,1,7-2*i); }
}
function cutDrawWorld(draws){   // inside the camera transform: PC glow, actors (y-sorted with the player), tour arrow
  if(!cut) return;
  const fx=cut.fx;
  if(fx.pc && curMap==='bedroom' && Math.floor(Date.now()/90)%3!==0){ ctx.fillStyle=(Math.floor(Date.now()/60)%2)?PAL.white:PAL.teal; ctx.globalAlpha=0.85; ctx.fillRect(132+3, 10+3, 10, 6); ctx.globalAlpha=1; }
  if(fx.spark){ const sp=fx.spark, k=sp.n/sp.n0, r=2+16*k, cols=[PAL.gold,PAL.white,PAL.teal,PAL.pink];   // sparkles spiralling in
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2 + (1-k)*5, x=Math.round(sp.x+Math.cos(a)*r), y=Math.round(sp.y+Math.sin(a)*r*0.8);
      ctx.fillStyle=cols[(i+sp.n)%4]; ctx.fillRect(x-1,y,3,1); ctx.fillRect(x,y-1,1,3); } }
  if(fx.burst){ const f=fx.burst.n/fx.burst.n0; ctx.fillStyle=(fx.burst.n%4<2)?PAL.white:PAL.pink; ctx.globalAlpha=0.7*f; const r=Math.round(4+10*(1-f)); ctx.fillRect(fx.burst.x-r, fx.burst.y-1, r*2, 2); ctx.fillRect(fx.burst.x-1, fx.burst.y-r, 2, r*2); ctx.globalAlpha=1; }
  for(const k in cut.actors){ const a=cut.actors[k]; if(!a.vis || a.isMe) continue;
    draws.push({py:a.py, fn:()=>{ const off=cutHopOffset(a);
      if(a.mon){ drawSprite(SPR[a.key], Math.round(a.px), Math.round(a.py)-8+off, a.dir==='right'); }
      else { const ds=dirSprite(a.key, a.dir); drawSprite(ds.spr, Math.round(a.px), Math.round(a.py)-8+off, ds.flip); } }}); }
}
function cutBoltI(){ const b=cut?cut.fx.bolt:0; if(b<=0) return 0; if(b>30) return 1; if(b>25) return 0.15; return b/25; }   // flash, flicker, fade
function cutDrawScreen(){       // after the camera transform: night tint, tour arrow, flash, fade
  if(!cut) return;
  const fx=cut.fx;
  if(fx.tint || (fx.dark && !LIGHTING.on)){ ctx.fillStyle='#0a0624'; ctx.globalAlpha=0.5; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  { const bi=cutBoltI(); if(bi>0){ ctx.fillStyle='#d6e4ff'; ctx.globalAlpha=0.32*bi; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; } }
  if(fx.arrow) drawPointer(fx.arrow[0]-camX, fx.arrow[1]-camY, fx.arrow[2]||'down');
  if(fx.flash>0){ ctx.fillStyle=PAL.white; ctx.globalAlpha=Math.min(1, fx.flash/fx.flash0); ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(fx.fade>0){ ctx.fillStyle=fx.fadeCol; ctx.globalAlpha=Math.min(1,fx.fade); ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
}

let lastT=0;
/* ---- room-change CRT static (3.61): a half-second of fuzzy TV snow while the DJ scratch covers the song switch ---- */
let crtFx=null, crtLastMap=null, crtNoise=null;
const CRT_TRIM=[4,5];   // frames trimmed off the start / end of the static (TUNE)
const CRT_ROOMS={ plaza:()=>SIXT_P, bedroom:()=>SIXT_B, farm:()=>SIXT_F, rift:()=>SIXT_R, realm:()=>SIXT_V };
let crtFromTitle=false;
function crtWatch(){
  if(G.screen==='TITLE'){ crtFromTitle=true; }
  if(G.screen!=='OVERWORLD'){ crtLastMap=curMap; return; }
  if(crtFromTitle){ crtFromTitle=false; if(!cut && CRT_ROOMS[curMap]) crtFx={ t:0, dur:Math.round(Math.min(46, Math.max(28, CRT_ROOMS[curMap]()*4*60))) }; crtLastMap=curMap; }
  if(curMap!==crtLastMap){
    if(crtLastMap && CRT_ROOMS[crtLastMap] && CRT_ROOMS[curMap] && !cut) crtFx={ t:0, dur:Math.round(Math.min(46, Math.max(28, CRT_ROOMS[curMap]()*4*60))) };   // as long as the scratch
    crtLastMap=curMap; }
  if(crtFx && ++crtFx.t>=crtFx.dur) crtFx=null;
}
function crtNoiseFrames(){   // 4 frames of grey snow, made once
  if(crtNoise) return crtNoise; crtNoise=[];
  const cols=[[16,10,30],[93,93,115],[154,160,181],[244,236,255]];
  for(let f=0;f<4;f++){ const c=document.createElement('canvas'); c.width=W; c.height=H+16; const x=c.getContext('2d'), im=x.createImageData(W,H+16);
    for(let i=0;i<W*(H+16);i++){ const r=Math.random(), k=r<0.42?0:r<0.72?1:r<0.92?2:3, q=cols[k]; im.data[i*4]=q[0]; im.data[i*4+1]=q[1]; im.data[i*4+2]=q[2]; im.data[i*4+3]=255; }
    x.putImageData(im,0,0); crtNoise.push(c); }
  return crtNoise;
}
function renderCrt(){
  const c=crtFx; if(!c) return;
  const k=c.t-CRT_TRIM[0], span=c.dur-CRT_TRIM[0]-CRT_TRIM[1]; if(k<0||k>=span) return;   // starts just after the scratch, ends just before it
  const p=k/span;
  const a = p<0.45 ? 1 : Math.max(0, 1-(p-0.45)/0.55);                 // full snow, then it clears to the new room
  const fr=crtNoiseFrames()[c.t%4];
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=a*0.92;
  ctx.drawImage(fr, 0, -((c.t*5)%16));
  ctx.globalAlpha=a*0.5; ctx.fillStyle=PAL.white; const by=Math.round(((c.t*7)%(H+30))-15); ctx.fillRect(0, by, W, 6);   // the rolling bright band
  ctx.globalAlpha=a*0.55; ctx.fillStyle=PAL.ink; for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);                               // scanlines
  ctx.restore(); ctx.globalAlpha=1;
}
function update(dt){
  toastT=Math.max(0,toastT-1);

  updateWinExit();        // tick the victory-exit transition (jingle -> needle-drop -> back to map)
  updateMusic();          // switch music track (plaza / battle / bedroom rain) by location
  keeperFlipT+=dt; if(keeperFlipT>=keeperFlipNext){ keeperFlipT=0; keeperFlipNext=1200+Math.floor(Math.random()*700); keeperFlipIdx=(keeperFlipIdx+1)%4; }  // farm keepers: one flips at a time on a slow timer (3 = none)
  farmAnimUpdate(dt); if(typeof expoUpdate==='function') expoUpdate(dt);   // worker roaming + expedition window run on game time, independent of the player
  if(G.screen==='OVERWORLD'){ cutUpdate(); checkIntroOutro(); }
  // overworld movement
  if(G.screen==='OVERWORLD' && !cut && !dialogue && !deathScene && !encTrans && !winExit){
    if(realm && curMap==='realm') riftRoamUpdate(dt);   // roamers wander / lunge
    if(player.moving){
      player.t += player.speed;
      if(player.t>=1){ player.t=1; player.moving=false; player.px=player.tx*8; player.py=player.ty*8; farmStep(); flipFollowerTick();
        const dr=doorAt(player.tx,player.ty);
        if(dr){ loadMap(dr.to, dr.sx, dr.sy, dr.dir); }
        else {
          if(curMap==='realm' && realm){ riftStepEnd(); }   // pickups, warps, nests, roamers, encounter counter
          if(curMap==='rift'){
            const po=objAt(player.tx,player.ty);
            if(po && po.type==='riftportal'){ held=null; openRift(); }   // walk into the portal to dive
          }
          { const _sl=(curMap==='realm'&&realm)?riftSlideDir():null; if(_sl) tryMove(_sl); else if(held && G.screen==='OVERWORLD') tryMove(held); }   // ice keeps you sliding
        } }
      else { player.px = player.fx + (player.tx*8-player.fx)*player.t; player.py = player.fy + (player.ty*8-player.fy)*player.t; }
      player.anim += 0.3;
    } else {
      if(held) tryMove(held);
    }
    // record a breadcrumb only when the player actually moved (no duplicates
    // while standing still, so the line doesn't collapse onto the leader)
    const head=trail[trail.length-1];
    if(!head || head.x!==player.px || head.y!==player.py){
      trail.push({x:player.px, y:player.py});
      if(trail.length>120) trail.shift();
    }
    syncFollowers();
    // place each follower a fixed distance back along the trail
    followers.forEach((f,i)=>{ if(f.pop>0) f.pop--;
      const p=sampleTrail((i+1)*FOLLOW_GAP);
      if(p.x < f.px-0.01) f.flip=true; else if(p.x > f.px+0.01) f.flip=false;
      f.px=p.x; f.py=p.y;
    });
  }
  if(G.screen==='BATTLE'){ updateBattle(); for(let i=1;i<battleSpeed && G.screen==='BATTLE' && battle && !encTrans && !winExit;i++) updateBattle(); }
  if(deathScene) updateDeathScene();
}

function updateBattle(){
  const b=battle; if(!b) return;
  allBattlers().forEach(x=>{ if(x.fx>0)x.fx--; });
  if(b.anim && b.anim.t>0) b.anim.t--;
  if(b.pressT>0) b.pressT--;
  if(b.recruitT>0) b.recruitT--;
  if(b.timer>0){ b.timer--; }

  // foes newly defeated this tick -> veterancy for the party + bounty gold
  {
    const down = b.foes.filter(f=>!f.alive).length;
    if(down > (b._downSeen||0)){
      const n = down-(b._downSeen||0);
      // each ally still standing gains "worth" for taking part in the KO
      b.allies.forEach(a=>{ if(a.alive && a.ref) a.ref.kills=(a.ref.kills||0)+n; });
      // bounty gold so partial/losing runs still pay
      if(b.tier.kill || b.tier.endless){
        const per = Math.round((b.tier.endless ? (3+Math.floor(b.round*0.6)) : (b.tier.kill||0))*goldMult());
        b.goldGained += per*n; G.gold += per*n;
      }
      b._downSeen = down;
    }
  }

  // dex: mark every foe seen; recruit-on-defeat: a downed foe may join your roster
  b.foes.forEach(f=>{
    if(f.boss) return;                                   // bosses are never seen-in-dex or recruitable
    if(f.sp) markSeen(f.sp);
    if(!f.alive && !f._recruitChk){
      f._recruitChk = true;
      if(G.owned[f.sp]) return;                          // already collected -> no duplicate recruit; focus on completing the dex
      const capPer = b.tier.endless ? 4 : 2;
      const joinChance = Math.min(0.95, recruitChance(f.sp) + (partyHasTrait('kinship')?0.12:0));
      if(b.recruited.length < capPer && Math.random() < joinChance){
        const m = makeMonster(f.sp); const where = gainBeast(m); gainSpecies(f.sp);   // party -> bench -> PC
        const nm = SPECIES[f.sp].name;
        b.recruited.push(nm);
        if(b.phase==='EXECUTE'){ b.msgQ=b.msgQ||[]; b.msgQ.push(nm+' JOINED YOU!', where==='PARTY' ? 'IT JOINED YOUR PARTY' : where==='BENCH' ? 'SENT TO YOUR BENCH' : 'SENT TO YOUR PC'); }   // told on the message bar, right after the KO
        else { b.recruitMsg = [nm, where==='PARTY' ? 'JOINED YOUR PARTY!' : where==='BENCH' ? 'JOINED YOUR BENCH!' : 'SENT TO YOUR PC!']; b.recruitT = 150; }
      }
    }
  });

  switch(b.phase){
    case 'ROUNDSTART':                       // stage banner ("ROUND n"), then the faster side opens
      if(b.timer<=0) beginSidePhase(firstSide());
      break;
    case 'NEWTURN': {                        // top of a side's phase: its guards drop, buffs decay, ailments tick
      if(b.timer>0) break;
      const foesBefore = b.foes.filter(f=>f.alive).length;
      const tick = roundTick(sideOf(b.turnSide));
      if(tick.pops.length){ tick.pops.forEach(h=>{ h.b.fx=10; }); b.anim={ hits:tick.pops.map(p=>({b:p.b,dmg:p.dmg,kind:p.kind})), t:30 };
        const p0=tick.pops[0]; b.msg=tick.log[0] || (p0.kind==='poison'?'POISON HURTS '+p0.b.name : p0.kind==='burn'?'BURN HURTS '+p0.b.name : p0.kind==='heal'?p0.b.name+' RECOVERS' : ''); sfxHit(false); }
      if(b.foes.filter(f=>f.alive).length < foesBefore) sfxFaint();   // poison/burn finished a foe
      if(battleCheckEnd()) break;
      b.icons.full = pressIconsFor(b.turnSide); b.icons.half = 0;      // counted after the tick, so the fallen give no icon
      b.phase='TICKWAIT'; b.timer = tick.pops.length ? 30 : 1;
      break; }
    case 'TICKWAIT':                          // (ailment damage showing) -> first monster of the side
      if(b.timer<=0) nextTurn();
      break;
    case 'TURNSKIP':                          // an asleep / frozen / stunned monster burned an icon
      if(b.timer<=0) nextTurn();
      break;
    case 'CHOOSE':
      // waiting on player input (the menu handlers end in giveOrder)
      break;
    case 'AUTOACT':                          // FERAL CAGE: your beast acts on instinct
    case 'FOEACT': {                         // a foe picks its move
      if(b.timer>0) break;
      const a=b.actor;
      if(!a || !a.alive || !canAct(a)){ spendIcons('one'); nextTurn(); break; }
      const raw = a.side==='me' ? autoAllyAction(a, b.foes, b.allies) : chooseEnemyAction(a, b.allies, b.foes);
      const act = fixTarget(a, raw);
      if(!act || act.type==='none'){ spendIcons('one'); nextTurn(); break; }
      applyActionAndAnimate(a, act);
      break; }
    case 'EXECUTE': {                        // after an action resolves: any follow-up lines, then the next monster (or the other side)
      if(b.timer>0) break;
      if(b.msgQ && b.msgQ.length){ b.msg=b.msgQ.shift(); b.timer=24; break; }
      if(battleCheckEnd()) break;
      nextTurn();
      break; }
    case 'ROUNDWON':
      if(b.timer<=0){
        if(b.tier.realm){ b.phase='WINEXIT'; b.timer=99999; winExitFX(()=>endRealmEncounter(true)); break; }
        if(b.tier.factory){
          const rg=Math.round((40+b.round*22)*goldMult()); b.goldGained+=rg; G.gold+=rg; b.lastRoundGold=rg;
          b.streak=b.round+1; b.allies.forEach(a=>{ if(a.ref) a.ref.wins=(a.ref.wins||0)+1; });
          if(b.streak>(G.bestFactory||0)) G.bestFactory=b.streak;
          b.phase='FACTORYWON'; b.timer=99999;
        }
        else if(b.tier.endless){
          const rg=Math.round(endlessRoundGold(b.round)*goldMult()); b.goldGained+=rg; G.gold+=rg; b.lastRoundGold=rg;
          b.streak = b.round+1;                               // rounds cleared = current streak
          b.allies.forEach(a=>{ if(a.ref){ a.ref.wins=(a.ref.wins||0)+1; if(b.streak>(a.ref.maxArena||0)) a.ref.maxArena=b.streak; } });
          if(b.streak > (G.bestStreak||0)) G.bestStreak=b.streak;
          // every 3rd round, drop a useful item so long runs stay survivable
          if(b.streak%3===0){ const drops=['repair_kit','mega_repair','energy_cell','revive_chip']; const d=drops[Math.floor(Math.random()*drops.length)]; G.items[d]=(G.items[d]||0)+1; b.dropMsg=ITEMS[d].name; }
          else b.dropMsg=null;
          b.phase='ENDLESSWON'; b.timer=99999;                // wait for CONTINUE / RETIRE
        } else {
          { const g=Math.round(b.tier.gold*goldMult()); b.goldGained += g; G.gold += g; }
          if(b.round < b.tier.rounds.length-1){
            b.round++;
            b.allies.forEach(a=>{ if(a.alive){ a.hp=Math.min(a.maxHp,a.hp+Math.round(a.maxHp*0.25)); a.mp=Math.min(a.maxMp,a.mp+Math.round(a.maxMp*CUP_MP_REFILL)); } });
            beginRound();
          } else {
            { const g=Math.round(b.tier.bonus*goldMult()); b.goldGained += g; G.gold += g; }
            if(b.tier.id==='bronze'){ if(!G.flags.fusion) b.newUnlock='FUSION UNLOCKED'; G.flags.silver=true; G.flags.fusion=true; }
            if(b.tier.id==='silver'){ if(!G.flags.gold) b.newUnlock='GOLD CUP OPEN'; G.flags.gold=true; }
            if(b.tier.id==='gold'){ if(!G.flags.endless) b.newUnlock='ENDLESS CUP OPEN'; G.flags.endless=true; }
            b.phase='VICTORY'; b.timer=99999; sfxVictory();
            b.allies.forEach(a=>{ if(a.ref){ a.ref.wins=(a.ref.wins||0)+1; const run=b.round+1; if(run>(a.ref.maxArena||0)) a.ref.maxArena=run; } });
          }
        }
      }
      break;
    case 'WINEXIT': break;                 // idle while the victory-exit transition plays
    case 'LOSE':
      if(b.timer<=0){
        if(b.tier.realm){ endRealmEncounter(false); break; }
        if(!b._deathPaid && !b.tier.endless){            // every Cup run pays out, even in defeat
          b._deathPaid = true;
          const ti = Math.max(0, TIERS.indexOf(b.tier));
          const cg = 14 + b.round*12 + ti*10;            // scales with how deep you got
          b.goldGained += cg; G.gold += cg; b.deathBonus = cg;
          if(Math.random() < 0.45){
            const pool=['repair_kit','energy_cell','stim_pack','mega_repair','bulwark'];
            const it=pool[Math.floor(Math.random()*pool.length)];
            G.items[it]=(G.items[it]||0)+1; b.deathItem=ITEMS[it].name;
          }
        }
        b.phase='DEFEAT'; b.timer=99999;
      }
      break;
  }
}

function clearTempBoosts(){   // mushroom buffs are temporary: they expire when you come back to the hub

}
function endBattle(){
  // write back HP to party monsters
  battle.allies.forEach(a=>{ if(a.ref){ a.ref.hp=Math.max(0,a.hp); a.ref.mp=a.mp; } });
  clearTempBoosts();                    // mushroom buffs wear off on returning to town
  // full heal back in town
  G.party.forEach(m=>{ const st=computeStats(m); m.hp=st.hp; m.mp=st.mp; });
  const gained=battle.goldGained;
  if(G.mission) missionBattleDone();   // each finished battle (win OR lose) jumps the expedition forward
  if(battle.tier && battle.tier.factory) G.rental=null;   // loaners are returned when you leave the pits

}

/* ===== RIFT FLOORS (overhaul): layout ARCHETYPES + biome terrain + things to find. One floor = one attempt of
