<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0613">
<title>NEON BAZAAR COLISEUM</title>
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; background:#070410; overflow:hidden; font-family:monospace; touch-action:none; overscroll-behavior:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
         background:radial-gradient(circle at 50% 18%, #1b0f30 0%, #0b0716 60%, #060410 100%); }
  #brand { width:100%; text-align:center; color:#8a6fb0; font-size:10px; letter-spacing:3px; padding:6px 0 4px; flex:0 0 auto;
           text-shadow:0 0 6px #ff4d7d55; }
  #brand b { color:#ff4d7d; }
  #screen-wrap { flex:1 1 auto; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; padding:2px 0; }
  #screen { image-rendering:pixelated; image-rendering:crisp-edges; background:#0d0617;
            border:3px solid #241734; border-radius:6px; box-shadow:0 0 0 2px #050309, 0 6px 24px #000a, inset 0 0 0 1px #00000080; }
  #pad { flex:0 0 auto; width:100%; max-width:520px; padding:6px 14px 16px; display:grid;
         grid-template-columns:1fr 1fr; align-items:center; gap:8px; transition:opacity .5s ease; }
  body.rqp-docked #pad { display:none; }   /* RQPad (docked phone controller) replaces the built-in pad while it is on screen */
  /* RQPad in the game's own purple palette (same colours as the built-in pad) */
  .rqp-root .rqp-panel, .rqp-side { background:linear-gradient(#1c1230,#0f0820) !important; border-color:#050309 !important; }
  .rqp-root .rqp-btn { background:#2a1c40 !important; border:2px solid #120a22 !important; box-shadow:0 3px 0 #120a22 !important; color:#8a6fb0 !important; }
  .rqp-root .rqp-btn.on { background:#3c2a58 !important; transform:translateY(2px); box-shadow:0 1px 0 #120a22 !important; }
  .rqp-root .rqp-pill { background:#45305f !important; color:#d8c7ef !important; border:2px solid #00000050 !important; box-shadow:0 3px 0 #00000060 !important; }
  .rqp-root .rqp-face { color:#fff !important; border:3px solid #00000060 !important; box-shadow:0 4px 0 #00000070 !important; }
  .rqp-root .rqp-face span { color:#fff !important; }
  .rqp-root .rqp-face { scale:1.2; }
  .rqp-root .rqp-face.fa { background:#ff4d7d !important; } .rqp-root .rqp-face.fb { background:#2fb6c4 !important; }
  .rqp-root .rqp-face.on { filter:brightness(.8); }
  #rq-dpad { position:fixed; z-index:2147483001; touch-action:none; display:grid; grid-template:1fr 1fr 1fr / 1fr 1fr 1fr; gap:0; }
  #rq-dpad div { background:#2a1c40; border:2px solid #120a22; box-shadow:0 3px 0 #120a22; color:#8a6fb0; display:flex; align-items:center; justify-content:center; border-radius:8px; pointer-events:none; }
  #rq-dpad .mid { background:#1c1230; box-shadow:none; }
  #rq-dpad .e { visibility:hidden; }
  #rq-dpad div.on { background:#3c2a58; transform:translateY(2px); box-shadow:0 1px 0 #120a22; }
  #pad.ctrl-hidden { opacity:.05; }   /* faded out while a controller/keyboard is in use */
  .dpad { position:relative; width:132px; height:132px; justify-self:start; }
  .dbtn { position:absolute; width:44px; height:44px; background:#2a1c40; border:2px solid #120a22;
          border-radius:8px; display:flex; align-items:center; justify-content:center; color:#8a6fb0; font-size:16px;
          box-shadow:0 3px 0 #120a22; }
  .dbtn:active { background:#3c2a58; transform:translateY(2px); box-shadow:0 1px 0 #120a22; }
  #d-up { top:0; left:44px; } #d-dn { bottom:0; left:44px; } #d-lf { top:44px; left:0; } #d-rt { top:44px; left:88px; }
  .dmid { position:absolute; top:44px; left:44px; width:44px; height:44px; background:#1c1230; border-radius:6px; }
  .abwrap { justify-self:end; display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .abrow { display:flex; gap:14px; align-items:flex-end; }
  .rbtn { width:56px; height:56px; border-radius:50%; font-size:18px; font-weight:bold; color:#fff;
          border:3px solid #00000060; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 #00000070; }
  .rbtn:active { transform:translateY(3px); box-shadow:0 1px 0 #00000070; }
  #b-b { background:#2fb6c4; }
  #b-a { background:#ff4d7d; width:64px; height:64px; }
  #b-menu { width:auto; height:30px; padding:0 14px; border-radius:15px; font-size:11px; letter-spacing:2px;
            background:#45305f; color:#d8c7ef; border:2px solid #00000050; box-shadow:0 3px 0 #00000060; display:flex; align-items:center; }
  #b-menu:active { transform:translateY(2px); box-shadow:0 1px 0 #00000060; }
  .toprow { display:flex; gap:8px; align-items:center; }
  #b-opts { width:auto; height:30px; padding:0 14px; border-radius:15px; font-size:11px; letter-spacing:2px; line-height:1;
            background:#2fb6c4; color:#0d1b1f; border:2px solid #00000050; box-shadow:0 3px 0 #00000060;
            display:flex; align-items:center; justify-content:center; }
  #b-opts:active { transform:translateY(2px); box-shadow:0 1px 0 #00000060; }
  .lbl { font-size:8px; color:#6a6a7a; letter-spacing:1px; margin-top:2px; text-align:center; }
  @media (max-height:560px){ #brand{display:none;} .dpad{width:108px;height:108px;} .dbtn{width:36px;height:36px;}
    #d-up{left:36px;}#d-dn{left:36px;}#d-lf{top:36px;}#d-rt{left:72px;top:36px;}.dmid{top:36px;left:36px;width:36px;height:36px;}
    .rbtn{width:48px;height:48px;}#b-a{width:54px;height:54px;} }
  /* HANDHELD build: just the screen, as big as it fits in whole pixels, on black */
  #brand, #pad { display:none !important; }
  #app { background:#000; justify-content:center; }
  #screen-wrap { padding:0; }
  #screen { border:0; border-radius:0; box-shadow:none; background:#000; cursor:none; }
  html, body { background:#000; cursor:none; }
</style>
</head>
<body>
<div id="app">
  <div id="brand"><b>NEON</b> BAZAAR COLISEUM</div>
  <div id="screen-wrap"><canvas id="screen" width="160" height="144"></canvas></div>
  <div id="pad">
    <div class="dpad">
      <div class="dbtn" id="d-up" data-dir="up">▲</div>
      <div class="dbtn" id="d-lf" data-dir="left">◀</div>
      <div class="dmid"></div>
      <div class="dbtn" id="d-rt" data-dir="right">▶</div>
      <div class="dbtn" id="d-dn" data-dir="down">▼</div>
    </div>
    <div class="abwrap">
      <div class="toprow">
        <div id="b-opts" title="Select">SELECT</div>
        <div id="b-menu">START</div>
      </div>
      <div class="abrow">
        <div style="display:flex;flex-direction:column;align-items:center"><div class="rbtn" id="b-b">B</div><div class="lbl">BACK</div></div>
        <div style="display:flex;flex-direction:column;align-items:center"><div class="rbtn" id="b-a">A</div><div class="lbl">OK</div></div>
      </div>
    </div>
  </div>
</div>
<script>
/* RQPad controller library (attached rqpad.js; only change: '</script' in a comment escaped so it can live inline) */
/*!
 * RQPad — a drop-in on-screen game controller for phones. One file, no dependencies.
 * Landscape-first. Two analog sticks, four face buttons, two shoulders, Start/Select.
 *
 * QUICK START (add before </body>, or after your game script):
 *   <script src="rqpad.js"><\/script>
 *   <script>RQPad.install();<\/script>
 *
 * It does two things at once, so you can use whichever your game prefers:
 *
 * 1) KEYBOARD MODE (default, needs no game changes).
 *    Every press sends real KeyboardEvents (keydown/keyup) to window, so a game that already
 *    reads the keyboard just works. Default mapping:
 *      Left stick   -> W A S D  (and ArrowUp/Left/Down/Right)
 *      Right stick  -> state only (RQPad.state.look). To make it press keys:
 *                      keys: { rightStick: { up:'KeyI', left:'KeyJ', down:'KeyK', right:'KeyL' } }
 *      A (bottom)   -> Space        B (right) -> KeyK / "k"
 *      X (left)     -> KeyJ / "j"   Y (top)   -> KeyL / "l"
 *      L1 -> KeyQ   R1 -> KeyE      L2 -> ShiftLeft   R2 -> KeyR
 *      Start -> Escape              Select -> Tab
 *    Change any of it: RQPad.install({ keys: { A: 'Enter', X: 'KeyZ', ... } })
 *    Use a key's `code` name (KeyZ, Space, Enter, ArrowUp, Digit1, ShiftLeft ...), or null to disable a button.
 *
 * 2) STATE MODE (for analog movement or games that poll).
 *    RQPad.state = {
 *      move: {x, y},   // left stick,  x right, y UP, each -1..1  (0,0 when released)
 *      look: {x, y},   // right stick, same convention
 *      down: { A:bool, B:bool, X:bool, Y:bool, L1, R1, L2, R2, START, SELECT }
 *    }
 *    RQPad.onButton = (name, isDown) => {...}      // called on every press/release
 *    RQPad.onStick  = (which, x, y) => {...}       // which is 'move' or 'look'
 *    Call each frame:  const {x,y} = RQPad.state.move;
 *
 * OPTIONS  RQPad.install({ ... })
 *    layout   'dock' (DEFAULT, the Switch-style attached controller):
 *               LANDSCAPE: a controller half snaps to the left and right edges, full height, game in the middle.
 *               PORTRAIT:  the two halves snap to the bottom, side by side, game fills the space above.
 *               The pad never covers the picture. It re-snaps live when the phone rotates.
 *             'overlay' (floats translucent over the game; only if you really want that)
 *    gameSelector  CSS selector for the game element (default: #game, else the first <canvas>).
 *             In dock layout RQPad moves that element into the free space (position:fixed between the halves).
 *             For games that size things from window.innerWidth/innerHeight, use RQPad.stage instead:
 *               RQPad.stage = { x, y, width, height }  the free rectangle for the game, always current.
 *               window 'rqpad:layout' event fires on every change (detail = the same rectangle).
 *    opacity  0..1 for overlay layout (default 0.55)
 *    scale    size multiplier (default 1)
 *    labels   (keep face-button labels to ~5 letters) { A:'JUMP', B:'DODGE', X:'ATTACK', Y:'STOW', L1:'GUARD', ... }
 *    glyphs   'letters' (A B X Y, default) | 'playstation' (cross circle square triangle, PS2-style) | 'none'
 *    keys     key mapping overrides (see above); keys.moveKeys: 'wasd' | 'arrows' | 'both' (default 'both')
 *    stickKeyThreshold  how far a stick must tilt to count as a key (default 0.35)
 *    hide     array of control names to leave out, e.g. ['L2','R2','SELECT','rightStick']
 *    onlyOnTouch  true (default): only appears on touch devices. false: always shows (handy on desktop for testing)
 *    target   element that receives the fake key events (default window)
 *
 * RQPad.install() returns the RQPad object. RQPad.remove() takes it away again. RQPad.setVisible(false) hides it.
 * Add #nopad to the page URL to switch it off for a session.
 */
(function (root) {
  'use strict';

  var BUTTONS = ['A', 'B', 'X', 'Y', 'L1', 'R1', 'L2', 'R2', 'START', 'SELECT'];

  var DEFAULT_KEYS = {
    A: 'Space', B: 'KeyK', X: 'KeyJ', Y: 'KeyL',
    L1: 'KeyQ', R1: 'KeyE', L2: 'ShiftLeft', R2: 'KeyR',
    START: 'Escape', SELECT: 'Tab',
    moveKeys: 'both',
    rightStick: null
  };

  // code -> [key, keyCode], so games checking e.key or the old e.keyCode also work.
  var KEYINFO = {
    Space: [' ', 32], Enter: ['Enter', 13], Escape: ['Escape', 27], Tab: ['Tab', 9],
    ShiftLeft: ['Shift', 16], ShiftRight: ['Shift', 16], ControlLeft: ['Control', 17], AltLeft: ['Alt', 18],
    ArrowUp: ['ArrowUp', 38], ArrowDown: ['ArrowDown', 40], ArrowLeft: ['ArrowLeft', 37], ArrowRight: ['ArrowRight', 39],
    Backspace: ['Backspace', 8]
  };
  function keyInfo(code) {
    if (KEYINFO[code]) return KEYINFO[code];
    var m = /^Key([A-Z])$/.exec(code);
    if (m) return [m[1].toLowerCase(), m[1].charCodeAt(0)];
    m = /^Digit([0-9])$/.exec(code);
    if (m) return [m[1], m[1].charCodeAt(0)];
    return [code, 0];
  }

  var CSS =
    '.rqp-root{position:fixed;inset:0;z-index:2147483000;pointer-events:none;font:700 12px/1.1 system-ui,monospace;' +
    '-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}' +
    '.rqp-root *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}' +
    '.rqp-ctl{position:absolute;pointer-events:auto;color:#e8eaee}' +
    '.rqp-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;' +
    'background:linear-gradient(#4a4d55,#34363c);border:2px solid #0e0e10;box-shadow:0 2px 0 #0008}' +
    '.rqp-btn.on{background:linear-gradient(#8b8f9b,#62666f);transform:translateY(1px)}' +
    '.rqp-btn small{font-size:.62em;font-weight:400;opacity:.8;margin-top:2px}' +
    '.rqp-face{border-radius:50%;font-size:calc(var(--u)*.34);white-space:nowrap}.rqp-face small{font-size:.46em;margin-top:0}' +
    '.rqp-sh{border-radius:10px 10px 18px 18px;font-size:calc(var(--u)*.26)}' +
    '.rqp-pill{border-radius:20px;font-size:calc(var(--u)*.18)}' +
    '.rqp-stick{border-radius:50%;background:radial-gradient(#0d0e10 55%,#25272c 100%);border:2px solid #08080a}' +
    '.rqp-cap{position:absolute;left:50%;top:50%;width:62%;height:62%;margin:-31% 0 0 -31%;border-radius:50%;' +
    'background:radial-gradient(circle at 40% 35%,#6b6f79,#3a3c43 70%);border:2px solid #0e0e10}' +
    '.rqp-overlay .rqp-ctl{opacity:var(--op)}' +
    '.rqp-root.rqp-dock .rqp-ctl{opacity:1}' +
    '.rqp-side{position:fixed;top:0;bottom:0;width:var(--sw);z-index:2147482990;background:linear-gradient(#2b2d33,#1b1c20)}' +
    '.rqp-side.l{left:0}.rqp-side.r{right:0}' +
    '.rqp-panel{position:absolute;pointer-events:auto;background:linear-gradient(#2b2d33,#1b1c20)}' +
    'body.rqp-docked{background:#16171a}' +
    '.rqp-sides-game{position:fixed!important;left:var(--rqp-l)!important;right:var(--rqp-r)!important;top:var(--rqp-t)!important;bottom:var(--rqp-b)!important;' +
    'width:auto!important;height:auto!important;max-width:none!important;margin:0!important;object-fit:contain}';

  var RQPad = {
    version: '1.0',
    state: { move: { x: 0, y: 0 }, look: { x: 0, y: 0 }, down: {} },
    onButton: null,
    onStick: null,
    _root: null, _style: null, _opts: null, _held: {}, _sidesEl: null, _sideNodes: [], _onResize: null
  };
  BUTTONS.forEach(function (b) { RQPad.state.down[b] = false; });

  function mix(base, over) {
    var o = {}, k;
    for (k in base) o[k] = base[k];
    if (over) for (k in over) o[k] = over[k];
    return o;
  }

  function sendKey(type, code) {
    if (!code) return;
    var info = keyInfo(code);
    var target = (RQPad._opts && RQPad._opts.target) || window;
    var ev;
    try {
      ev = new KeyboardEvent(type, { key: info[0], code: code, keyCode: info[1], which: info[1], bubbles: true, cancelable: true });
    } catch (e) { return; }
    // keyCode/which are read-only in the constructor on some engines; force them.
    try { Object.defineProperty(ev, 'keyCode', { get: function () { return info[1]; } }); } catch (e) {}
    try { Object.defineProperty(ev, 'which', { get: function () { return info[1]; } }); } catch (e) {}
    target.dispatchEvent(ev);
  }

  // Keep a counter per key code so two controls mapped to the same key do not release each other.
  var keyCount = {};
  function keyDown(code) {
    if (!code) return;
    keyCount[code] = (keyCount[code] || 0) + 1;
    if (keyCount[code] === 1) sendKey('keydown', code);
  }
  function keyUp(code) {
    if (!code || !keyCount[code]) return;
    keyCount[code]--;
    if (keyCount[code] === 0) sendKey('keyup', code);
  }

  function setButton(name, isDown, keys) {
    if (RQPad.state.down[name] === isDown) return;
    RQPad.state.down[name] = isDown;
    if (isDown) keyDown(keys[name]); else keyUp(keys[name]);
    if (RQPad.onButton) { try { RQPad.onButton(name, isDown); } catch (e) { console.error(e); } }
  }

  var GLYPHS = {
    playstation: { A: '✕', B: '○', X: '□', Y: '△' },
    letters: { A: 'A', B: 'B', X: 'X', Y: 'Y' },
    none: { A: '', B: '', X: '', Y: '' }
  };
  var GLYPH_COLOUR = { A: '#6a9be8', B: '#e0605a', X: '#e08ac0', Y: '#6fd3a0' };

  function el(parent, cls, css, html) {
    var d = document.createElement('div');
    d.className = cls;
    if (css) d.style.cssText = css;
    if (html) d.innerHTML = html;
    parent.appendChild(d);
    return d;
  }

  function makeButton(parent, name, cls, css, html, opts) {
    var n = el(parent, 'rqp-ctl rqp-btn ' + cls, css, html);
    var id = null;
    n.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      id = e.pointerId;
      try { n.setPointerCapture(id); } catch (x) {}
      n.classList.add('on');
      setButton(name, true, opts.keys);
      if (navigator.vibrate && opts.haptics) { try { navigator.vibrate(8); } catch (x) {} }
    });
    var end = function (e) {
      if (e.pointerId !== id) return;
      id = null;
      n.classList.remove('on');
      setButton(name, false, opts.keys);
    };
    n.addEventListener('pointerup', end);
    n.addEventListener('pointercancel', end);
    n.addEventListener('lostpointercapture', end);
    n.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    return n;
  }

  function makeStick(parent, which, css, opts) {
    var base = el(parent, 'rqp-ctl rqp-stick', css);
    var cap = el(base, 'rqp-cap');
    var id = null;
    var pressed = { up: false, down: false, left: false, right: false };
    var th = opts.stickKeyThreshold;

    function keysFor(dir) {
      if (which === 'move') {
        var mk = opts.keys.moveKeys;
        var w = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }[dir];
        var a = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }[dir];
        return mk === 'wasd' ? [w] : mk === 'arrows' ? [a] : [w, a];
      }
      var rs = opts.keys.rightStick;
      return rs && rs[dir] ? [rs[dir]] : [];
    }
    function setDir(dir, on) {
      if (pressed[dir] === on) return;
      pressed[dir] = on;
      keysFor(dir).forEach(function (k) { if (on) keyDown(k); else keyUp(k); });
    }
    function report(x, y) {
      RQPad.state[which].x = x;
      RQPad.state[which].y = y;
      setDir('right', x > th); setDir('left', x < -th);
      setDir('up', y > th); setDir('down', y < -th);
      if (RQPad.onStick) { try { RQPad.onStick(which, x, y); } catch (e) { console.error(e); } }
    }
    function update(e) {
      var r = base.getBoundingClientRect();
      var radius = r.width / 2;
      var dx = e.clientX - (r.left + radius), dy = e.clientY - (r.top + radius);
      var len = Math.hypot(dx, dy), max = radius * 0.6;
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      cap.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      report(dx / max, -dy / max);
    }
    base.addEventListener('pointerdown', function (e) {
      e.preventDefault(); id = e.pointerId;
      try { base.setPointerCapture(id); } catch (x) {}
      update(e);
    });
    base.addEventListener('pointermove', function (e) { if (e.pointerId === id) update(e); });
    var end = function (e) {
      if (e.pointerId !== id) return;
      id = null; cap.style.transform = ''; report(0, 0);
    };
    base.addEventListener('pointerup', end);
    base.addEventListener('pointercancel', end);
    base.addEventListener('lostpointercapture', end);
    return base;
  }

  function isTouch() {
    return ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
  }

  RQPad.install = function (options) {
    if (RQPad._root) RQPad.remove();
    var o = mix({
      layout: 'dock', opacity: 0.55, scale: 1, labels: {}, glyphs: 'letters', hide: [],
      onlyOnTouch: true, stickKeyThreshold: 0.35, gameSelector: null, target: null, haptics: true
    }, options);
    o.keys = mix(DEFAULT_KEYS, options && options.keys);
    if (/nopad/.test(location.hash)) return RQPad;
    if (o.onlyOnTouch && !isTouch()) { RQPad._opts = o; return RQPad; }
    RQPad._opts = o;

    var style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);
    RQPad._style = style;

    var root = document.createElement('div');
    root.className = 'rqp-root rqp-' + (o.layout === 'overlay' ? 'overlay' : 'dock');
    root.style.setProperty('--op', String(o.opacity));
    document.body.appendChild(root);
    RQPad._root = root;

    var hide = {};
    o.hide.forEach(function (h) { hide[h] = true; });
    var glyph = GLYPHS[o.glyphs] || GLYPHS.letters;

    var layoutName = o.layout === 'overlay' ? 'overlay' : 'dock'; // 'sides' and 'dock' are the same thing

    function clearStage() {
      if (RQPad._sidesEl) {
        RQPad._sidesEl.classList.remove('rqp-sides-game');
        ['--rqp-l', '--rqp-r', '--rqp-t', '--rqp-b'].forEach(function (v) { RQPad._sidesEl.style.removeProperty(v); });
        RQPad._sidesEl = null;
      }
    }

    function build() {
      root.innerHTML = '';
      RQPad._sideNodes.forEach(function (n) { n.remove(); });
      RQPad._sideNodes = [];
      var W = window.innerWidth, H = window.innerHeight;
      var landscape = W > H;
      var panels, stage;

      if (layoutName === 'overlay') {
        var cwO = W * 0.3;

   Each glyph is 3 wide x 5 tall; advance is 4px (3 + 1 gap). */
const SMALLNUM = (function(){
  const G = {
    '0':['111','101','101','101','111'], '1':['010','110','010','010','111'],
    '2':['111','001','111','100','111'], '3':['111','001','111','001','111'],
    '4':['101','101','111','001','001'], '5':['111','100','111','001','111'],
    '6':['111','100','111','101','111'], '7':['111','001','010','010','010'],
    '8':['111','101','111','101','111'], '9':['111','101','111','001','111'],
    '/':['001','001','010','100','100'],
  };
  const out={};
  for(const k in G){ out[k]=G[k].map(r=> (r[0]==='1'?1:0)|(r[1]==='1'?2:0)|(r[2]==='1'?4:0) ); }
  return out;
})();
const SMALL_W=3, SMALL_H=5, SMALL_ADV=4;
function drawSmallNum(s, x, y, color){
  ctx.fillStyle=color; let cx=x|0; const yy=y|0;
  for(let i=0;i<s.length;i++){
    const g=SMALLNUM[s[i]];
    if(g){ for(let ry=0;ry<SMALL_H;ry++){ const row=g[ry]; if(!row) continue; for(let rx=0;rx<SMALL_W;rx++){ if(row&(1<<rx)) ctx.fillRect(cx+rx, yy+ry, 1, 1); } } }
    cx += SMALL_ADV;
  }
}

  const str=(sp.id||sp.name||JSON.stringify(sp.base||{}))+'|'+(sp.el||'')+'|'+(sp.role||'');

function deriveMoves(sp){
  const out=[];
  if(sp.skill) out.push(sp.skill);                              // signature
  const el = sp.el || skillEl(sp.skill);

  const um = UTIL_MOVE[sp.role]; if(um && out.indexOf(um)<0) out.push(um); // role utility
  const tier = speciesTier(sp);
  // #11: this element's EXCLUSIVE flavored cross-type moves (premium beasts master both)
  const kit = ELEMENT_KIT[el] || [];
  const kitCount = tier>=4 ? 2 : 1;
  // movepool variety fix: many species share a reused signature + same el/role/tier, which used to
  // collapse them to an IDENTICAL final moveset (always kit[0] first). Rotate the starting kit index
  // deterministically per-species so same-signature species still diverge, with zero new content.
  const kitStart = kit.length ? (speciesHash(sp) % kit.length) : 0;
  for(let i=0;i<Math.min(kitCount, kit.length);i++){ const km=kit[(kitStart+i)%kit.length]; if(out.indexOf(km)<0) out.push(km); }

  // both KIT moves are always included at this tier (kitCount==kit.length), so kit rotation alone
  // can't diverge two same-element premium species -- rotate WHICH coverage partner they get instead.
  if(tier>=4){ const cvTable=(speciesHash(sp)%2===0)?COVERAGE:COVERAGE2; const cv=cvTable[el]; const atk=cv&&ELEM_ATTACK[cv]; if(atk && out.indexOf(atk)<0) out.push(atk); }

}

const MOVE_CAP = 4;
function capMoves(sp, full){
  const tier=speciesTier(sp), el=sp.el||skillEl(sp.skill), keep=[];
  const add=id=>{ if(id && full.indexOf(id)>=0 && keep.indexOf(id)<0 && keep.length<MOVE_CAP) keep.push(id); };
  add(sp.skill); add(STATUS_MOVE[el]); add(UTIL_MOVE[sp.role]);
  if(tier>=4){ const cvTable=(speciesHash(sp)%2===0)?COVERAGE:COVERAGE2; const cv=cvTable[el]; add(cv&&ELEM_ATTACK[cv]); }
  full.forEach(add);
  return keep;
}

// ===== REBIRTH / STAT-CAP SYSTEM =====
// Every beast has a per-stat growth CEILING that only rises when it is REBORN.
// Feed cores to fill the cap -> MAXED -> fuse two maxed beasts into a REBIRTH CORE
// -> SPECIAL FUSION spends it to raise the ceiling (a small dip now, far more room later)
// -> repeat until every stat reaches 999. This bounds growth per tier and keeps foes paced.
const STAT_KEYS = ['hp','mp','atk','def','spd'];
function statCeil(m, k){ return Math.min(STAT_MAX, (m.base[k]||0) + BOOST_ALLOW0 + (m.reborn||0)*REBIRTH_STEP); }
function boostCap(m, k){ return Math.max(0, statCeil(m,k) - (m.base[k]||0)); }
function isMaxed(m){ return STAT_KEYS.every(k => ((m.base[k]||0)+(m.boost[k]||0)) >= statCeil(m,k)); }

function canRebirth(m){ return isMaxed(m) && !fullyMaxed(m); }
function inferReborn(m){    // migration: place an existing (possibly over-grown) beast at the right tier
  let r=0; STAT_KEYS.forEach(k=>{ const over=(m.boost[k]||0)-BOOST_ALLOW0; if(over>0) r=Math.max(r, Math.ceil(over/REBIRTH_STEP)); });
  return Math.min(12, r);
}
function computeStats(m){
  const b = m.base, bo = m.boost, e = m._equip ? (EQUIP[m._equip.id].bonus) : {}, e2 = m._equip2 ? (EQUIP[m._equip2.id].bonus) : {}, tb = m.tempBoost || null;
  const raw = !!m._rental;       // rented loaners are disposable -> exempt from the cap
  const reborn = m.reborn||0;
  const g = k => { const ext=(e[k]||0)+(e2[k]||0)+((tb&&tb[k])||0);
    if(raw) return (b[k]||0)+(bo[k]||0)+ext;
    const ceil=Math.min(STAT_MAX,(b[k]||0)+BOOST_ALLOW0+reborn*REBIRTH_STEP);
    const core=Math.min(ceil,(b[k]||0)+(bo[k]||0));   // base+boost, capped at the rebirth ceiling
    return Math.min(STAT_MAX, core+ext); };            // gear/temp ride on top, hard-capped at 999
  return { hp:g('hp'), mp:g('mp'), atk:g('atk'), def:g('def'), spd:g('spd') };
}

// foes inherit a SHARE of your team's earned growth (cores in the Cups, rental-boost in the Pits),
// so the challenge keeps pace as you grind. Fresh teams (no boost) leave early-game difficulty untouched.
function foeMatchBoost(mult){ mult=(mult==null?1:mult);
  const team = (typeof battle!=='undefined' && battle && battle.allies && battle.allies.length)
                 ? battle.allies.map(a=>a.ref).filter(Boolean) : (G.party||[]);
  const out={hp:0,mp:0,atk:0,def:0,spd:0}; if(!team.length) return out;
  // read each monster's EFFECTIVE (cap-clamped) growth, not the raw boost field -- the raw field can sit
  // above the current cap for beasts migrated from old saves (inferReborn caps the assigned reborn tier
  // at 12 but doesn't rewrite boost itself), which would otherwise scale foes off a stale, uncapped number.
  team.forEach(m=>{ const bo=m.boost||{}; for(const k in out){ const raw=bo[k]||0; out[k]+=m._rental?raw:Math.min(boostCap(m,k),raw); } });
  const facBump = (typeof battle!=='undefined' && battle && battle.tier && battle.tier.factory) ? 1.6 : 1;   // #6: the Pits run a tighter mirror -- both sides are gearless loaners
  for(const k in out){ let rate=(k==='atk')?FOE_OFF_MATCH:FOE_MATCH; rate=Math.min(1, rate*facBump); out[k]=Math.round(out[k]/team.length*rate*mult); }

}
function makeEnemyBattler(spId, scale){

  const fb = foeMatchBoost(mighty ? 0.5 : 1);               // so they keep pace with you, but gently (no brick walls)
  const st = { hp:sc(sp.base.hp)+fb.hp, mp:sc(sp.base.mp)+fb.mp, atk:sc(sp.base.atk)+fb.atk, def:sc(sp.base.def)+fb.def, spd:sc(sp.base.spd)+fb.spd };

function makeEnemyTeam(roundDef){

  const isRealm = (typeof battle!=='undefined' && battle && battle.tier && battle.tier.realm);     // the Rift keeps its own pack sizes
  const want = Math.min(3, (typeof battle!=='undefined' && battle && battle.allies && battle.allies.length) ? battle.allies.length : ((G.party&&G.party.length)||3));

function rnd(a,b){ return a + Math.random()*(b-a); }

// Returns { dmg, tag:'weak'|'resist'|'null'|null, crit:bool }
function missChance(att, def){ const d=Math.max(0, def.stats.spd - att.stats.spd); let m=0.03 + 0.24*d/(d+140); { const g=gearFx(def,'evade'); if(g) m=m+g.add; } return Math.max(0.03, Math.min(0.45, m)); }   // faster defenders dodge more; curve widened (was 0.15/+120) so a real SPD lead is worth building for
function damageCalc(att, def, power, el){

  let dfRaw = def.stats.def * def.defMul;
  { const pg=gearFx(att,'pierce'); if(pg) dfRaw *= (1-pg.frac); }            // PIERCE DRILL: ignore part of the foe's defense
  let dmg = atk * (power/100) * (100/(100 + dfRaw*3.0)) * rnd(0.9,1.1);
  let mult=1, tag=null;
  if(el){ const r=affFor(def)[el];
    if(r==='weak'){ if(hasTrait(def,'voidborn')){ mult=1; tag=null; } else { mult=WEAK_MULT; tag='weak'; } }
    else if(r==='resist'){ mult=0.5; tag='resist'; }
    else if(r==='null'){ mult=0; tag='null'; } }
  { const tg=gearFx(att,'truestrike'); if(tg && mult<1){ mult=1; tag=null; } }   // NULL BREAKER: resisted/immune hits land at normal power
  const guarded = !!def.defending;

  dmg *= mult;

  if(mult>0 && el){ const g=gearFx(att,'elem'); if(g){ const gel = g.el==='self' ? (specOf(att.sp)&&specOf(att.sp).el) : g.el; if(gel===el) dmg *= (1+g.mult); } }
  let crit=false;
  if(mult>0 && !guarded && Math.random()<critChance(att)){ crit=true; dmg*=1.5; }  // no crits through a guard
  return { dmg: mult===0?0:Math.max(1,Math.round(dmg)), tag, crit, miss:false, guarded };

const MUL_HI=2.0, MUL_LO=0.4;   // #2: buffs/debuffs STACK multiplicatively, capped, and refresh to the longer timer

function execAction(actor, action, allies, foes){

  if(actor.status==='shock' && Math.random()<0.30){            // paralysis: action may fail
    res.fizzled=true; res.log.push(actor.name+' is paralyzed!'); return res;
  }
  const skill = action.skill ? SKILLS[action.skill] : null;
  const dealDmg = (t, power, el, kind)=>{
    const r = damageCalc(actor, t, power, el);
    if(r.miss){ res.missed=true; res.hits.push({ b:t, dmg:0, kind:kind||'skill', miss:true }); res.log.push(actor.name+' missed!'); return r; }

    if(t.side==='me' && r.dmg>0){

      if(front && front!==t){

    if(r.dmg>0 && hasTrait(actor,'leech') && actor!==t && actor.alive && actor.hp<actor.maxHp){  // LEECH: drain life

    if(r.crit) res.crit=true;
    res.hits.push({ b:t, dmg:r.dmg, kind:kind||'skill', tag:r.tag, crit:r.crit });
    if(t.status==='sleep' && r.dmg>0 && Math.random()<0.5){ t.status=null; t.statusT=0; res.log.push(t.name+' woke up'); }
    if(t.status==='freeze' && el==='fire'){ t.status=null; t.statusT=0; res.log.push(t.name+' thawed'); }
    { const g=gearFx(actor,'stun'); if(r.dmg>0 && t.alive && !t.boss && g && Math.random()<g.chance){ t.stunned=true; res.log.push(t.name+' is STUNNED!'); } }
    return r;
  };
  if(action.type==='attack'){
    const t=action.target; if(!t||!t.alive) return res;
    dealDmg(t, 100, null, 'hit'); res.log.push(actor.name+' hits '+t.name);   // #5: basic attacks deal NEUTRAL damage now -- your element no longer dictates your basic-hit type
  } else if(action.type==='skill' && skill){
    const _aoe=gearFx(actor,'aoe');
    actor.mp = Math.max(0, actor.mp - Math.round(skill.mp*(_aoe?AOE_MP_MULT:1)));
    if(skill.type==='DAMAGE'){
      if(_aoe){                                                                 // OMNI LENS: single-target damage sweeps the whole enemy line
        res.log.push(actor.name+' '+skill.name);
        res._sweep=true;
        foes.forEach(t=>{ if(t.alive){ const r=dealDmg(t, Math.round(skill.power*AOE_POWER_MULT), skill.el); if(!r.miss && !r.tag) res._sweepHitNeutral=true; if(!r.miss && skill.status && t.alive) tryInflict(t, skill.status); } });
      } else {
        const t=action.target; if(!t||!t.alive) return res;
        const r=dealDmg(t, skill.power, skill.el); res.log.push(actor.name+' '+skill.name);
        if(!r.miss && skill.status && t.alive && tryInflict(t, skill.status)){ res.hits.push({b:t,dmg:0,kind:'status'}); res.log.push(t.name+' '+STATUS_NAME[skill.status.kind]+'!'); }
      }
    } else if(skill.type==='DAMAGE_ALL'){
      res.log.push(actor.name+' '+skill.name);
      foes.forEach(t=>{ if(t.alive){ const r=dealDmg(t, skill.power, skill.el); if(!r.miss && skill.status && t.alive) tryInflict(t, skill.status); } });
    } else if(skill.type==='HEAL'){
      let t=action.target; if(!t||!t.alive) t=allies.filter(a=>a.alive).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0];
      if(t){ const heal=Math.round(t.maxHp*skill.amt); t.hp=Math.min(t.maxHp,t.hp+heal); res.hits.push({b:t,dmg:heal,kind:'heal'}); res.log.push(actor.name+' heals '+t.name); }
    } else if(skill.type==='BUFF'){
      const t = (skill.tgt==='self') ? actor : (action.target||actor);
      applyStatMul(t, skill.stat==='atk'?'atk':'def', skill.mul, skill.dur);
      res.hits.push({b:t,dmg:0,kind:'buff'}); res.log.push(t.name+' '+skill.stat.toUpperCase()+' up!');
    } else if(skill.type==='DEBUFF_DEF'){
      const t=action.target; if(!t||!t.alive) return res;
      applyStatMul(t, 'def', skill.amt, skill.dur); res.hits.push({b:t,dmg:0,kind:'debuff'}); res.log.push(t.name+' DEF down!');
    } else if(skill.type==='CURE'){
      let t=action.target; if(!t||!t.alive) t=allies.filter(a=>a.alive && a.status)[0]||actor;
      if(t){ t.status=null; t.statusT=0; const heal=Math.round(t.maxHp*(skill.amt||0)); if(heal>0) t.hp=Math.min(t.maxHp,t.hp+heal); res.hits.push({b:t,dmg:heal,kind:'heal'}); res.log.push(t.name+' cleansed'); }
    }
  } else if(action.type==='item'){
    const it=ITEMS[action.item], t=action.target;
    if(actor.side==='me'){ G.items[action.item]=(G.items[action.item]||0)-1; if(G.items[action.item]<=0) delete G.items[action.item]; }
    if(it.type==='heal'){ if(t){ t.hp=Math.min(t.maxHp,t.hp+it.amt); res.hits.push({b:t,dmg:it.amt,kind:'heal'});} res.log.push('Used '+it.name); }
    else if(it.type==='mp'){ if(t){ t.mp=Math.min(t.maxMp,t.mp+it.amt);} res.log.push('Used '+it.name); }
    else if(it.type==='buffatk'){ if(t){ applyStatMul(t,'atk',1+it.amt,it.dur); res.hits.push({b:t,dmg:0,kind:'buff'});} res.log.push(t.name+' ATK up!'); }
    else if(it.type==='buffdef'){ if(t){ applyStatMul(t,'def',1+it.amt,it.dur); res.hits.push({b:t,dmg:0,kind:'buff'});} res.log.push(t.name+' DEF up!'); }
    else if(it.type==='revive'){ if(t && !t.alive){ t.alive=true; t.hp=Math.round(t.maxHp*it.amt); t.status=null; t.statusT=0; res.hits.push({b:t,dmg:0,kind:'buff'});} res.log.push('Used '+it.name); }
  } else if(action.type==='mushthrow'){                        // a thrown mushroom: a hit of its own type (the weakness chart applies)
    const mk=MUSH_BY_ID[action.item], t=action.target;
    if(t && t.alive && mk && t.side!==actor.side){
      if((G.items[mk.id]||0)>0){ G.items[mk.id]--; if(G.items[mk.id]<=0) delete G.items[mk.id]; }
      res.log.push(actor.name+' THROWS '+mk.name);
      dealDmg(t, MUSH_THROW_POWER*mushPotency(mk.id), mk.el, 'skill');   // potency grade scales the throw
    }
  } else if(action.type==='pass'){
    res.log.push(actor.name+' PASSES');
  } else if(action.type==='defend'){
    actor.defending=true; res.log.push(actor.name+' GUARDS');   // GUARD: half damage and no weakness bonus against it, until this side's next phase
  } else if(action.type==='fullheal' || action.type==='bossheal'){
    const _b4=actor.hp; actor.hp=Math.min(actor.maxHp, actor.hp+Math.round(actor.maxHp*BOSS_HEAL_FRAC)); actor._usedHeal=true;   // a boss's ONE emergency heal: about half its HP
    res.hits.push({b:actor,dmg:Math.max(1,actor.hp-_b4),kind:'heal'}); res.log.push(actor.name+' HEALS!');
  } else if(action.type==='swap'){
    const t=action.target;
    if(t && t!==actor){ const i=allies.indexOf(actor), j=allies.indexOf(t); if(i>=0&&j>=0){ allies[i]=t; allies[j]=actor; } }
    res.log.push(actor.name+' SWAPS PLACES');
  }
  // resolve deaths
  [].concat(allies,foes).forEach(b=>{ if(b.hp<=0 && b.alive){
    const _gs=gearFx(b,'survive');
    if(_gs && !b._survived && Math.random()<_gs.chance){ b.hp=1; b._survived=true; res.log.push(b.name+' HOLDS ON!'); }
    else { b.alive=false; b.status=null; if(b.ref) b.ref.faints=(b.ref.faints||0)+1; res.log.push(b.name+' is down!'); res.died.push(b); }
  } });
  // BLOOD BRACELET: if a bracelet-wearing PARTY member lands the finishing blow, benched wearers share the kill(s)
  if(actor && actor.side==='me' && actor.ref && wearsBlood(actor.ref)){
    let bk=0; for(const d of res.died){ if(d!==actor && d.side!=='me' && foes.indexOf(d)>=0) bk++; }
    if(bk>0) creditBloodBench(bk);
  }
  return res;
}

// Ailment damage + duration countdown, once per round. Returns {pops:[{b,dmg,kind}], log:[]}.
function tickStatuses(battlers){
  const out={ pops:[], log:[] };
  battlers.forEach(b=>{
    if(b.alive){
      const _gc=gearFx(b,'cleanse'); if(_gc && !b._cleansed && b.status){ const was=b.status; b.status=null; b.statusT=0; b._cleansed=true; out.log.push(b.name+' SHRUGS OFF '+was); }   // CLEANSE CHARM
      const _gb=gearFx(b,'berry'); if(_gb && !b._berry && b.hp>0 && b.hp < b.maxHp*_gb.thresh){ const h=Math.round(b.maxHp*_gb.heal); b.hp=Math.min(b.maxHp,b.hp+h); b._berry=true; out.pops.push({b,dmg:h,kind:'heal'}); out.log.push(b.name+' AUTO-REPAIRS'); }   // AUTO-REPAIR
    }
    if(false && b.alive && b.mp < b.maxMp){                                        // BATTLE v5: no MP trickle (costs/pools tuned instead) --
      b.mp = Math.min(b.maxMp, b.mp + Math.max(MP_REGEN_MIN, Math.round(b.maxMp*MP_REGEN_FRAC)));   // keeps the weakness-skill loop sustainable
    }
    { const _gr=gearFx(b,'regen'); if(b.alive && _gr && b.hp>0 && b.hp<b.maxHp){     // REGEN CELL
      const h=Math.max(1,Math.round(b.maxHp*_gr.frac)); b.hp=Math.min(b.maxHp,b.hp+h); out.pops.push({b,dmg:h,kind:'heal'}); } }
    if(b.alive && hasTrait(b,'regen') && b.hp>0 && b.hp<b.maxHp){                // REGEN trait
      const h=Math.max(1,Math.round(b.maxHp*0.08)); b.hp=Math.min(b.maxHp,b.hp+h); out.pops.push({b,dmg:h,kind:'heal'});
    }
    if(!b.alive || !b.status) return;
    if(b.status==='poison'){ const d=Math.max(3,Math.round(b.maxHp*0.12)); b.hp=Math.max(0,b.hp-d); out.pops.push({b,dmg:d,kind:'poison'}); }
    else if(b.status==='burn'){ const d=Math.max(2,Math.round(b.maxHp*0.08)); b.hp=Math.max(0,b.hp-d); out.pops.push({b,dmg:d,kind:'burn'}); }
    else if(b.status==='freeze'){ if(Math.random()<0.35){ b.status=null; b.statusT=0; out.log.push(b.name+' thawed'); } }
    if(b.status){ b.statusT--; if(b.statusT<=0){ const was=b.status; b.status=null; out.log.push(b.name+(was==='sleep'?' woke up':was==='freeze'?' thawed':' recovered')); } }
    if(b.hp<=0){ b.alive=false; b.status=null; if(b.ref) b.ref.faints=(b.ref.faints||0)+1; out.log.push(b.name+' is down!'); }
  });
  return out;
}
// Called once at the start of each round: reset defend, decay buffs, then tick ailments.
function roundTick(battlers){
  battlers.forEach(b=>{ b.defending=false;
    if(b.atkT>0){ b.atkT--; if(b.atkT<=0) b.atkMul=1; }
    if(b.defT>0){ b.defT--; if(b.defT<=0) b.defMul=1; } });
  return tickStatuses(battlers);
}

// AI: choose an action for one battler. Used by enemies AND as the sim's stand-in player.
const PERSONA = { berserker:'BERSERKER', guardian:'GUARDIAN', medic:'MEDIC', trickster:'TRICKSTER', tactician:'TACTICIAN' };
// a creature's instinct is read off its build: healers MEDIC, control TRICKSTER, tanks GUARDIAN, glass-cannons BERSERKER, the rest TACTICIAN
function derivePersonality(mon){
  const sp=specOf(mon.sp); const mv=(sp.moves||[]).map(id=>SKILLS[id]).filter(Boolean); const st=computeStats(mon);
  if(mv.some(m=>m.type==='HEAL'||m.type==='CURE')) return 'medic';
  if(mv.some(m=>m.type==='DAMAGE_ALL'||m.type==='DEBUFF_DEF')) return 'trickster';
  if((st.def + st.hp/3) > (st.atk + st.spd)*1.12) return 'guardian';
  if((st.atk + st.spd) > (st.def + st.hp/3)*1.12) return 'berserker';
  return 'tactician';
}
function estQuick(actor, t, power, el){ let d=actor.stats.atk*(actor.atkMul||1)*(power/100)*100/(100+t.stats.def*(t.defMul||1)*3); const aff=affFor(t)[el]; if(aff==='weak')d*=1.6; else if(aff==='resist')d*=0.5; else if(aff==='null')d*=0; return d; }
function autoAllyAction(actor, foes, allies){
  const p=actor.personality||'tactician';
  const living=foes.filter(f=>f.alive); if(!living.length) return {type:'defend'};
  const moves=(specOf(actor.sp).moves||[]).filter(Boolean); const sk=id=>SKILLS[id]; const basicEl=null;   // #5: neutral basic attacks
  const dmgMoves=moves.filter(id=>{const x=sk(id);return x&&(x.type==='DAMAGE'||x.type==='DAMAGE_ALL')&&actor.mp>=x.mp;});
  const hpFrac=actor.hp/actor.maxHp;
  const bestStrike=()=>{ let best={type:'attack',target:living[0]},bd=-1;
    for(const t of living){ const d=estQuick(actor,t,100,basicEl); if(d>bd){bd=d;best={type:'attack',target:t};} }
    for(const id of dmgMoves){ const x=sk(id);
      if(x.type==='DAMAGE'){ for(const t of living){ const d=estQuick(actor,t,x.power,x.el); if(d>bd){bd=d;best={type:'skill',skill:id,target:t};} } }
      else { let sumd=0; living.forEach(t=>sumd+=estQuick(actor,t,x.power,x.el)); if(sumd>bd){bd=sumd;best={type:'skill',skill:id};} } }
    return best; };
  if(p==='berserker') return bestStrike();
  if(p==='guardian'){
    if(hpFrac<0.4 && Math.random()<0.55) return {type:'defend'};
    const db=moves.find(id=>sk(id)&&sk(id).type==='BUFF'&&sk(id).stat==='def'); if(db&&actor.mp>=sk(db).mp&&(actor.defMul||1)===1&&Math.random()<0.5) return {type:'skill',skill:db,target:actor};
  }
  if(p==='medic'){
    const hm=moves.find(id=>sk(id)&&sk(id).type==='HEAL'); const hurt=allies.filter(a=>a.alive&&a.hp/a.maxHp<0.65).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
    if(hm&&hurt&&actor.mp>=sk(hm).mp) return {type:'skill',skill:hm,target:hurt};
    const cm=moves.find(id=>sk(id)&&sk(id).type==='CURE'); const sick=allies.find(a=>a.alive&&a.status); if(cm&&sick&&actor.mp>=sk(cm).mp) return {type:'skill',skill:cm,target:sick};
    return bestStrike();
  }
  if(p==='trickster'){
    const aoe=dmgMoves.find(id=>sk(id).type==='DAMAGE_ALL'); if(aoe&&living.length>=2&&Math.random()<0.6) return {type:'skill',skill:aoe};
    const deb=moves.find(id=>sk(id)&&sk(id).type==='DEBUFF_DEF'); if(deb&&actor.mp>=sk(deb).mp&&Math.random()<0.5) return {type:'skill',skill:deb,target:living[0]};
    for(const id of dmgMoves){ const x=sk(id); if(x.type==='DAMAGE'){ const wk=living.find(f=>affFor(f)[x.el]==='weak'); if(wk) return {type:'skill',skill:id,target:wk}; } }
    return bestStrike();
  }
  return chooseEnemyAction(actor, foes, allies);   // TACTICIAN: the full smart AI
}
function pickFoeTarget(living){   // living = the other side in slot order, so living[0] is the FRONT
  if(living.length<=1) return living[0];
  if(Math.random()<FRONT_FOCUS) return living[0];
  const back=living.slice(1); let tot=0; const w=back.map(f=>{ const ww=1+(1-f.hp/f.maxHp); tot+=ww; return ww; });
  let r=Math.random()*tot; for(let i=0;i<back.length;i++){ r-=w[i]; if(r<=0) return back[i]; } return back[back.length-1];
}
function chooseEnemyAction(actor, foes, allies){
  const moves = (specOf(actor.sp).moves || [actor.skill]).filter(Boolean);
  const sk = id => SKILLS[id];
  const living = foes.filter(f=>f.alive);
  if(!living.length) return { type:'defend' };
  // cornered AND out-sped -> GUARD to blunt the burst this round
  if(actor.hp/actor.maxHp < 0.35 && foes.some(f=>f.alive && f.stats.spd > actor.stats.spd) && Math.random()<0.20) return { type:'defend' };
  const aMul = actor.atkMul||1, basicEl = null;   // #5: basic attacks are neutral, so the AI estimates them without an affinity
  // rough AVERAGE damage this actor would land on t (mirrors damageCalc core, minus rng/crit/gear) - used to spot kills
  const est = (t, power, el)=>{ let d = actor.stats.atk*aMul*(power/100)*100/(100+t.stats.def*(t.defMul||1)*3);
    const aff=affFor(t)[el]; if(aff==='weak')d*=1.6; else if(aff==='resist')d*=0.5; else if(aff==='null')d*=0; return d; };
  const dmgMoves = moves.filter(id=>{ const x=sk(id); return x && (x.type==='DAMAGE'||x.type==='DAMAGE_ALL') && actor.mp>=x.mp; });

  // 1) keep the team alive: heal / cleanse (more reliably than before)
  const healMove = moves.find(id=>sk(id)&&sk(id).type==='HEAL');
  const hurt = allies.filter(a=>a.alive && a.hp/a.maxHp<0.45).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
  if(healMove && hurt && actor.mp>=sk(healMove).mp && Math.random()<0.85) return { type:'skill', skill:healMove, target:hurt };
  const cureMove = moves.find(id=>sk(id)&&sk(id).type==='CURE');
  const sick = allies.find(a=>a.alive && a.status);
  if(cureMove && sick && actor.mp>=sk(cureMove).mp && Math.random()<0.5) return { type:'skill', skill:cureMove, target:sick };

  // 2) AoE when it would hit 2+ foes (sometimes - keeps groups honest without wiping them)
  const aoe = dmgMoves.find(id=>sk(id).type==='DAMAGE_ALL');
  if(aoe && living.length>=2 && !living.some(f=>affFor(f)[sk(aoe).el]==='null') && Math.random()<0.4) return { type:'skill', skill:aoe };   // (an immune target would cost the whole side turns)

  // 3) choose WHO to hit: mostly your FRONT monster; the back row only now and then (leaning on the most wounded)
  const t = pickFoeTarget(living);
  // ...and hit that target's weakness if it has one (rarely, it spots a back-row weakness instead)
  for(const id of dmgMoves){ const x=sk(id); if(x.type==='DAMAGE' && affFor(t)[x.el]==='weak' && Math.random()<0.85) return { type:'skill', skill:id, target:t }; }
  if(living.length>1 && Math.random()<0.12){ for(const id of dmgMoves){ const x=sk(id); if(x.type==='DAMAGE'){ const wk=living.find(f=>f!==living[0] && affFor(f)[x.el]==='weak'); if(wk) return { type:'skill', skill:id, target:wk }; } } }

  // 4) self-buff sometimes (only if not already buffed)
  const buffMove = moves.find(id=>sk(id)&&sk(id).type==='BUFF');
  if(buffMove && actor.mp>=sk(buffMove).mp && (actor.atkMul||1)===1 && (actor.defMul||1)===1 && Math.random()<0.22) return { type:'skill', skill:buffMove, target:actor };

  // SOFT finisher: only if a *free* basic attack would finish this wounded target (no MP burn, not guaranteed)
  if(est(t,100,basicEl)>=t.hp && Math.random()<0.6) return { type:'attack', target:t };
  // otherwise the best non-resisted damage skill, else a debuff, else attack
  const usable = dmgMoves.filter(id=>{ const x=sk(id); if(x.type!=='DAMAGE')return false; const r=affFor(t)[x.el]; return r!=='resist'&&r!=='null'; });
  if(usable.length && Math.random()<0.7){ let bid=usable[0], bd=-1; for(const id of usable){ const d=est(t,sk(id).power,sk(id).el); if(d>bd){bd=d;bid=id;} } return { type:'skill', skill:bid, target:t }; }
  const debuff = moves.find(id=>sk(id)&&sk(id).type==='DEBUFF_DEF');
  if(debuff && actor.mp>=sk(debuff).mp && Math.random()<0.3) return { type:'skill', skill:debuff, target:t };
  return { type:'attack', target:t };
}

// Headless full battle (tests + balance). Mirrors the team-phase + Press + status flow.

/* ============================================================
   ECONOMY / PROGRESSION HELPERS
   ============================================================ */
function canAfford(n){ return G.gold>=n; }
function buyMonster(spId){ const p=SPECIES[spId].price; if(!canAfford(p)) return false; G.gold-=p; const m=makeMonster(spId); gainBeast(m); gainSpecies(spId); return m; }
function buyEquip(eqId){ const p=EQUIP[eqId].price; if(!canAfford(p)) return false; G.gold-=p; const e={uid:uidc++,id:eqId,owner:null}; G.equips.push(e); return e; }
function buyItem(itId){ const p=ITEMS[itId].price; if(!canAfford(p)) return false; G.gold-=p; G.items[itId]=(G.items[itId]||0)+1; return true; }
function equipTo(eq, mon, slot){
  if(eq.owner){ const o=eq.owner; if(o._equip===eq)o._equip=null; if(o._equip2===eq)o._equip2=null; }
  const twin = traitOf(mon.sp)==='twinslot';
  if(slot!==1 && slot!==2){ slot = (!mon._equip) ? 1 : (twin && !mon._equip2) ? 2 : 1; }   // auto: first empty slot, else replace slot 1
  if(slot===2 && !twin) slot=1;
  if(slot===2){ if(mon._equip2) mon._equip2.owner=null; mon._equip2=eq; }
  else { if(mon._equip) mon._equip.owner=null; mon._equip=eq; }
  eq.owner=mon;
  const st=computeStats(mon); mon.hp=Math.min(mon.hp,st.hp); mon.mp=Math.min(mon.mp,st.mp);
}
function unequip(mon, slot){ const key=(slot===2)?'_equip2':'_equip'; if(mon[key]){ mon[key].owner=null; mon[key]=null; }
  const st=computeStats(mon); mon.hp=Math.min(mon.hp,st.hp); mon.mp=Math.min(mon.mp,st.mp); }
function gearSub(mon){ const a=mon._equip?EQUIP[mon._equip.id].name:null; if(traitOf(mon.sp)==='twinslot'){ const b=mon._equip2?EQUIP[mon._equip2.id].name:null; if(!a&&!b) return 'none'; return (a||'-')+' + '+(b||'-'); } return a||'none'; }

// A monster's transferable GROWTH = the boosts you've already poured into it PLUS the
// battle experience (kills) it earned over time. Its innate BASE stats are NOT growth, so a
// freshly-bought monster is worth ~nothing as fodder - you can only pass on what you invested.
function growthOf(m){
  const bo=m.boost||{}, k=m.kills||0, g={};
  for(const st of ['hp','mp','atk','def','spd']) g[st]=(bo[st]||0)+k*KILL_GROWTH[st];
  return g;
}
function makeEssence(a, b){
  const FRAC=0.6;                          // lossy concentration: the core keeps 60% of the two sacrifices' growth
  const ga=growthOf(a), gb=growthOf(b);
  const boost={};
  for(const st of ['hp','atk','def','spd','mp']) boost[st]=Math.round((ga[st]+gb[st])*FRAC);
  // name by dominant stat
  const order=[['atk','WRATH'],['def','BULWARK'],['hp','VIGOR'],['spd','SWIFT'],['mp','MANA']];
  let best=order[2], bv=-1;
  order.forEach(o=>{ if(boost[o[0]]>bv){ bv=boost[o[0]]; best=o; } });

  // The old 8/3/4/4/2 split meant HP filled its cap in 1.5 cores while SPD needed 6 -- so SPD gated every
  // rebirth and ~52% of all reward value overflowed a filled cap and was silently thrown away.
  return { uid:uidc++, name:'RIFT CORE +'+depth, boost:{ hp:s(4), mp:s(4), atk:s(4), def:s(4), spd:s(4) } };

function fuseRemove(a, b){
  G.roster = G.roster.filter(m=>m!==a && m!==b);
  G.party = G.party.filter(m=>m!==a && m!==b);
  if(a._equip) a._equip.owner=null;  if(a._equip2) a._equip2.owner=null;
  if(b._equip) b._equip.owner=null;  if(b._equip2) b._equip2.owner=null;
  for(const m of G.roster){ if(G.party.length>=3) break; if(!G.party.includes(m)) G.party.push(m); }   // refill the party
}
function doFusion(a, b){
  if(a===b) return null;
  if(G.roster.length<5) return null;
  const ess = makeEssence(a,b);
  fuseRemove(a,b);
  G.essences.push(ess);
  return ess;
}
function doFusionRebirth(a, b){    // two MAXED beasts -> a REBIRTH CORE (not a stat core)
  if(a===b) return false;
  if(G.roster.length<5) return false;
  fuseRemove(a,b);

}
function doRebirth(mon){           // SPECIAL FUSION: spend a rebirth core to raise a maxed beast's ceiling
  if((G.rebirthCores||0)<=0 || !canRebirth(mon)) return false;
  mon.reborn=(mon.reborn||0)+1;
  for(const k in mon.boost){ mon.boost[k]=Math.round((mon.boost[k]||0)*REBIRTH_DIP); }   // small dip; re-grind toward the higher cap
  G.rebirthCores--;

}
function applyEssence(ess, mon){
  mon.cores=(mon.cores||0)+1;
  for(const k in ess.boost){ const cap=boostCap(mon,k); mon.boost[k]=Math.min(cap, (mon.boost[k]||0)+ess.boost[k]); }   // growth is capped until the beast is REBORN
  const st=computeStats(mon); mon.hp=st.hp; mon.mp=st.mp; // full restore on upgrade
  G.essences = G.essences.filter(e=>e!==ess);
}

const player = { tx:9, ty:9, px:9*8, py:9*8, dir:'down', moving:false, fx:0, fy:0, t:0, speed:0.16, anim:0, flip:false };
let trail = []; // breadcrumb history of {x,y} (head = newest = player)
const followers = []; // {px,py,sp,flip,idle}
let folFlipSteps=0, folFlipNext=5, folFlipIdx=0;          // follower idle-flip: one at a time, every 5-6 steps, looks independent of your walk
let keeperFlipT=0, keeperFlipNext=1500, keeperFlipIdx=-1; // farm-keeper idle-flip: one at a time on a slow timer (ms)
const FOLLOW_GAP = 13; // pixels between each party member in the line (roomy enough to see each full 16px sprite)
function sampleTrail(dist){
  // walk back from the head of the trail by `dist` pixels, interpolating
  if(trail.length===0) return {x:player.px, y:player.py};
  let i=trail.length-1, remaining=dist, cur=trail[i];
  while(i>0 && remaining>0){
    const prev=trail[i-1];
    const dx=cur.x-prev.x, dy=cur.y-prev.y;
    const seg=Math.hypot(dx,dy);
    if(seg>=remaining){ const t=remaining/seg; return {x:cur.x-dx*t, y:cur.y-dy*t}; }
    remaining-=seg; cur=prev; i--;
  }
  return {x:cur.x, y:cur.y};
}
function resetFollowers(){
  followers.length=0;
  G.party.forEach(m=> followers.push({px:player.px, py:player.py, sp:m.sp, flip:false, idle:false}));
  // seed a straight breadcrumb trail extending BEHIND the player so the
  // party starts as a neat line instead of stacked on the leader
  trail.length=0;
  let bx=0,by=0;
  if(player.dir==='up') by=1; else if(player.dir==='down') by=-1;
  else if(player.dir==='left') bx=1; else bx=-1;
  for(let d=FOLLOW_GAP*4; d>=0; d--){ trail.push({x:player.px+bx*d, y:player.py+by*d}); }
  followers.forEach((f,i)=>{ const p=sampleTrail((i+1)*FOLLOW_GAP); f.px=p.x; f.py=p.y; });
  folFlipSteps=0; folFlipIdx=0; followers.forEach(f=>f.idle=false);
}
// (3.70) keep the party line in step with your party: a beast that joins (rift recruit, any new party member) pops in
// behind you with a little sparkle right away, instead of only showing up after the next battle or menu
function syncFollowers(){
  if(followers.length===G.party.length && followers.every((f,i)=>f.sp===G.party[i].sp)) return;
  const old=followers.slice(); followers.length=0;
  G.party.forEach((m,i)=>{ const k=old.findIndex(f=>f && f.sp===m.sp);
    if(k>=0){ followers.push(old[k]); old[k]=null; }
    else { const p=sampleTrail((i+1)*FOLLOW_GAP); followers.push({px:p.x, py:p.y, sp:m.sp, flip:false, idle:false, pop:28}); } });
}
function flipFollowerTick(){   // every 5-6 steps ONE follower faces the opposite way, so the line looks alive instead of just mirroring you
  if(!followers.length) return;
  if(++folFlipSteps < folFlipNext) return;
  folFlipSteps=0; folFlipNext=5+Math.floor(Math.random()*2);          // 5 or 6
  followers.forEach(f=>f.idle=false);
  folFlipIdx=(folFlipIdx+1)%(followers.length+1);                     // extra slot = an occasional 'none' so they're not always offset
  if(folFlipIdx<followers.length) followers[folFlipIdx].idle=true;
}
function tileWalkable(tx,ty){
  if(tx<0||ty<0||tx>=curW||ty>=curH) return false;
  if(solid[ty][tx]) return false;
  const o=objAt(tx,ty); if(o && (o.type==='npc'||o.type==='merchant'||o.type==='hut'||o.type==='spring'||o.type==='altar'||o.type==='rcache'||o.type==='wanderer'||o.type==='guardian')) return false;   // face them to interact, don't walk through
  if(typeof lobbyKidAt==='function' && lobbyKidAt(tx,ty)) return false;   // PIP + ZEKE hanging around the lobby during your first shop
  return true;
}
function tryMove(dir){
  if(player.moving) return;
  player.dir=dir;
  let dx=0,dy=0;
  if(dir==='up')dy=-1; else if(dir==='down')dy=1; else if(dir==='left'){dx=-1;player.flip=true;} else if(dir==='right'){dx=1;player.flip=false;}
  const nx=player.tx+dx, ny=player.ty+dy;
  if(tileWalkable(nx,ny)){
    player.moving=true; player.fx=player.px; player.fy=player.py; player.t=0; player.stepN=(player.stepN|0)+1;
    player.tx=nx; player.ty=ny;
  }
}

// ---- looping sequence player (used by plaza + battle) ----
let seqOn=false, seqTimer=null, seqNodes=[], seqPrev=[], seqLaterIds=[];

function seqLater(fn, whenAudio){   // run fn about 1s before audio time whenAudio - spreads a dense loop's setup across the loop
  const ms=(whenAudio-1.0-audioCtx.currentTime)*1000;
  if(SEQ_SYNC || ms<=0){ fn(); return; }
  const id=setTimeout(()=>{ seqLaterIds=seqLaterIds.filter(x=>x!==id); if(seqOn) fn(); }, ms); seqLaterIds.push(id);
}
function stopSequence(){ seqOn=false; if(seqTimer){ clearTimeout(seqTimer); seqTimer=null; } seqLaterIds.forEach(clearTimeout); seqLaterIds=[]; seqPrev.concat(seqNodes).forEach(o=>{ try{ o.stop(); }catch(e){} }); seqNodes=[]; seqPrev=[]; }
// (3.62) loops are queued on the AUDIO clock, one at a time. Before, each loop was queued "now" on a timer - if the
// audio clock stalled (phone audio paused, a hiccup), several copies of the song stacked up and later played on top
// of each other, and stopping the music could only silence the newest copy.
function startSequence(scheduleFn){
  seqOn=true; seqNodes=[]; seqPrev=[]; let next=audioCtx.currentTime+0.06;
  const loop=()=>{ if(!seqOn) return;
    const now=audioCtx.currentTime;
    if(next-now>0.4){ seqTimer=setTimeout(loop, 120); return; }        // the current loop hasn't finished on the audio clock yet (or it's paused): wait
    if(next<now+0.03) next=now+0.06;                                     // fell behind (clock jumped): start fresh rather than cram
    seqPrev.forEach(o=>{ try{ o.stop(); }catch(e){} });                  // anything left from two loops ago is long finished - clear it out
    seqPrev=seqNodes; seqNodes=[];

    seqTimer=setTimeout(loop, Math.max(120, (next-audioCtx.currentTime)*1000-300));

    else if(G.screen==='BATTLE') want=(battle && (battle.phase==='VICTORY'||battle.phase==='WINEXIT')) ? null : (isEpicBattle()?'battle_epic':'battle');   // go quiet so the victory jingle stands out
    else if(G.screen==='TITLE'||G.screen==='NAMING'||G.screen==='CHARSELECT') want='title';
    else if(G.screen==='OPTIONS' && G.optReturn==='TITLE') want='title';
    else if(G.screen==='MENU' && menu && menu.title==='INTRO') want='title';      // the watch/skip-intro choice is still part of starting up
    else if(curMap==='bedroom') want = G.flags.introStage==='intro' ? 'rain' : 'bedroom';   // rain for the opening, Bedroom Blues after
    else if(curMap==='plaza') want='plaza';
    else if(curMap==='rift') want='rift';
    else if(curMap==='realm') want='realm';                       // past the portal: its own song
    else if(curMap==='farm') want='farm';
  }

  if(want===currentTrack || musicSwap) return;
  if(currentTrack==='title' && want==='rain'){                         // starting the story: the theme fades away into the storm
    fadeMusicOut(1.4); musicSwap={ to:want, id:setTimeout(()=>{ musicSwap=null; if(audioMuted){ restoreMusic(0.05); return; } switchTrack(want); restoreMusic(0.8); }, 1450) }; return; }
  if(SOFT_SWAP[currentTrack] && SOFT_SWAP[want]){                     // walking from room to room: a DJ scratch covers the switch, in the new song's tempo

    encTrans.swapped=true;
    try{ encTrans.then(); }catch(e){ console.error(e); }

/* ============================================================
   FAST DRAW (3.51)  -  tiles, sprites and letters used to be painted one pixel at a time (about 25,000 calls
   a frame in the overworld). Each one is now painted once into a tiny cached image and stamped with a single
   call. Same pixels, same colors (checked frame-for-frame against 3.50). Falls back to the old way for any

const FD_ON = (function(){ try{ if(typeof document==='undefined' || !document.createElement) return false; const c=document.createElement('canvas'); const x=c.getContext && c.getContext('2d'); return !!(x && x.drawImage && x.fillRect); }catch(e){ return false; } })();

    const px = flip ? (row.length-1-xx) : xx; x.fillStyle=col; x.fillRect(px,y,1,1); last=col; any=true; } }

  const key=fdId(spr)+':s'+sc; let e=fdSprites.get(key); if(e) return e;

  const keys=Object.keys(FONT.glyphs); const c=fdCanvas(keys.length*FONT.cw, FONT.ch), x=c.getContext('2d'); x.fillStyle=color; const at={};

function battleCheckEnd(){

// ===== PRESS TURN FLOW (v6) =====
// Sides take turns. A side starts its phase with one TURN ICON per living monster (a lone boss gets PRESS_BOSS_ICONS).
// Monsters act one after another in slot order; each action spends an icon:
//   normal action ............ 1 icon
//   hit a WEAKNESS or CRIT .... half an icon (the icon blinks: one more action)
//   PASS ...................... half an icon (hands the turn to the next monster)
//   MISS or hit an IMMUNITY ... 2 icons
// When the icons run out the other side goes. That is the whole system.
function orderable(a){ return !!(a && a.alive && canAct(a) && !a.stunned); }
function sideOf(side){ return side==='me' ? battle.allies : battle.foes; }
function pressIconsFor(side){
  const live=sideOf(side).filter(x=>x.alive); if(!live.length) return 0;
  if(live.length===1 && sideOf(side).length===1){ const sp=specOf(live[0].sp)||{}; if(live[0].boss || sp.legendary || (battle.tier && battle.tier.elite)) return PRESS_BOSS_ICONS; }
  return live.length;
}
function firstSide(){                                     // who opens the round: HASTE, then SWIFT gear, then the faster team (ties go to you)
  const b=battle, avg=l=>{ const v=l.filter(x=>x.alive); return v.length ? v.reduce((t,x)=>t+x.stats.spd,0)/v.length : 0; };
  const hm=b.allies.some(x=>x.alive&&hasTrait(x,'haste')), hf=b.foes.some(x=>x.alive&&hasTrait(x,'haste'));
  if(hm!==hf) return hm ? 'me' : 'foe';
  if(b.allies.some(x=>{ const g=x.alive && gearFx(x,'priority'); return !!(g && Math.random()<g.chance); })) return 'me';
  return avg(b.foes) > avg(b.allies) ? 'foe' : 'me';
}
function beginSidePhase(side){                            // a side's phase begins: its guards drop, its buffs/ailments tick, it gets fresh icons
  const b=battle; b.turnSide=side; b.side=side; b.actor=null; b.sub=null; b.msgQ=[];
  b.icons={ full:0, half:0 }; b.turnIdx=-1; b.pressT=0; b.pressMsg=null;

}
function iconsLeft(){ const i=battle.icons; return i ? i.full+i.half : 0; }
function spendIcons(kind){                                // kind: 'one' | 'press' | 'two'
  const i=battle.icons; if(!i) return;
  if(kind==='press'){ if(i.full>0){ i.full--; i.half++; } else if(i.half>0) i.half--; return; }
  let n = kind==='two' ? 2 : 1;
  while(n>0 && (i.half>0 || i.full>0)){ if(i.half>0) i.half--; else i.full--; n--; }
}
function iconCost(action, res){
  if(action.type==='pass') return 'press';
  if(res.fizzled) return 'one';
  if(res.missed || res.nulled) return 'two';
  if(res.weak || res.crit) return 'press';
  return 'one';
}
function pressSettle(actor, action, res){                 // pay for the action that just happened + the little banner beside the icons

  const k=iconCost(action, res); spendIcons(k);

  else if(k==='press'){ b.pressMsg='ONE MORE!'; b.pressGood=true; b.pressT=44; }
  else if(k==='two'){ b.pressMsg='TURN LOST'; b.pressGood=false; b.pressT=44; }

}
function nextTurn(){                                      // hand the turn to the next monster on this side, or end the phase
  const b=battle; if(battleCheckEnd()) return;
  const other = b.turnSide==='me' ? 'foe' : 'me';
  if(iconsLeft()<=0){ beginSidePhase(other); return; }
  const list=sideOf(b.turnSide), n=list.length; let a=null;
  for(let k=1;k<=n;k++){ const j=((b.turnIdx+k)%n+n)%n; if(list[j].alive){ a=list[j]; b.turnIdx=j; break; } }
  if(!a){ beginSidePhase(other); return; }
  b.actor=a; b.side=a.side; b.sub=null;
  if(a.stunned){ a.stunned=false; b.msg=a.name+' IS STUNNED'; spendIcons('one'); b.phase='TURNSKIP'; b.timer=26; return; }   // STUN SPIKE
  if(!canAct(a)){ b.msg=a.name+(a.status==='sleep'?' IS ASLEEP':a.status==='freeze'?' IS FROZEN':' CANT MOVE'); spendIcons('one'); b.phase='TURNSKIP'; b.timer=26; return; }
  if(a.side==='me'){
    if(b.auto){ b.phase='AUTOACT'; b.timer=18; b.msg=a.name+' - '+(PERSONA[a.personality]||'INSTINCT'); }   // FERAL CAGE: instinct
    else promptOrder();

}
function promptOrder(){                                   // your monster's turn: open its command menu

function rememberCmd(a, action){                          // the menus open where you left them last time

  else if(action.type==='skill'){ m.cmdIdx=1; m.skillId=action.skill; if(action.target && action.target.side!=='me') m.target=action.target; }
  else if(action.type==='item'){ m.cmdIdx=2; m.itemId=action.item; }
  else if(action.type==='mushthrow'){ m.cmdIdx=2; m.itemId=action.item; m.target=action.target; }

function giveOrder(a, action){                            // the chosen command happens right away

function itemLeft(id){ return (G.items[id]||0) - reservedItem(id); }   // stock not already promised to an earlier order this round
function livingOf(list){ return list.filter(x=>x.alive); }
function fixTarget(a, act){                               // the round moved on since the order was given: re-aim if needed
  const b=battle; if(!act) return null;
  const myFoes = a.side==='me' ? b.foes : b.allies, myAllies = a.side==='me' ? b.allies : b.foes;
  const sk = act.skill ? SKILLS[act.skill] : null;

    if(a.side!=='me') return chooseEnemyAction(a, b.allies, b.foes);          // a foe just picks again

    const al=livingOf(myAllies).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp); act=Object.assign({}, act, {target:al[0]||a}); }

  if(act.type==='mushthrow' && (G.items[act.item]||0)<=0) return {type:'none', msg:'NO '+itemName(act.item)+' LEFT'};

  return act;
}

const STATUS_LONG = { poison:'IS POISONED', burn:'IS BURNED', freeze:'IS FROZEN', shock:'IS SHOCKED', sleep:'FELL ASLEEP' };
function actionLine(actor, action, res){

  if(action.type==='mushthrow'){ const l=actor.name+' THROWS '+itemName(action.item); return l.length<=24 ? l : actor.name+': '+itemName(action.item); }

// run one action, animate it, and route into EXECUTE (which does Press accounting)
function applyActionAndAnimate(actor, action){
  const b=battle;
  const myFoes = actor.side==='me'?b.foes:b.allies;
  const myAllies = actor.side==='me'?b.allies:b.foes;
  const res = execAction(actor, action, myAllies, myFoes);
  res.hits.forEach(h=>{ h.b.fx=14; });
  // sound: a connecting hit, a whiff, and a fallen enemy
  const dealt = res.hits.some(h=>h.dmg>0 && h.kind!=='heal');
  if(dealt) sfxHit(res.crit||res.weak);
  else if(res.missed) sfxMiss();
  if(res.died && res.died.some(d=>d.side!=='me')) sfxFaint();   // an enemy went down
  b.lastRes = res; b.lastAction = action;

  b.anim = { hits:res.hits, t:32, el:(action.skill&&SKILLS[action.skill]&&SKILLS[action.skill].el)||(action.item&&MUSH_BY_ID[action.item]&&MUSH_BY_ID[action.item].el)||((SPECIES[actor.sp]||{}).el) };   // el: color of the hit flash
  b.msg = actionLine(actor, action, res);
  b.msgQ = [];                                                     // follow-up lines: ailments that land, monsters that go down
  res.hits.forEach(h=>{ if(h.kind==='status' && h.b.status && STATUS_LONG[h.b.status]) b.msgQ.push(h.b.name+' '+STATUS_LONG[h.b.status]); });

  (res.died||[]).forEach(d=>b.msgQ.push(d.name+' IS DOWN!'));
  b.sub = null; b.pendAction=null; b.pendItem=null;
  b.phase='EXECUTE'; b.timer = (action.type==='defend'||action.type==='pass') ? 22 : 36;
}

function getBattleNav(){
  const b=battle; if(!b) return null;
  if(b.phase==='VICTORY'||b.phase==='DEFEAT') return {kind:'leave', items:[{act:endBattle}]};
  if(b.phase!=='CHOOSE') return null; // waiting on animation / foe turn
  if(b.sub==='cmd') return {kind:'vlist', items:[
    {label:'FIGHT',act:chooseAttack},{label:'SKILL',act:chooseSkill},
    {label:'ITEM',act:chooseItem},{label:'GUARD',act:chooseDefend},{label:'PASS',act:choosePass}]};
  if(b.sub==='skill'){ return {kind:'vlist', items:(b.moveList||[]).map(id=>({id,act:()=>pickMove(id)}))}; }
  if(b.sub==='target'){ const fs=b.foes.filter(f=>f.alive); return {kind:'hlist', items:fs.map(f=>({obj:f,act:()=>pickTarget(f)}))}; }
  if(b.sub==='targetAlly'){ const al=b.allies.filter(a=>a.alive); return {kind:'vlist', items:al.map(a=>({obj:a,act:()=>pickAllyTarget(a)}))}; }
  if(b.sub==='itemTarget'){ return {kind:'vlist', items:b.allies.map(a=>({obj:a,act:()=>applyItemTo(a)}))}; }
  if(b.sub==='mushTarget'){ const fs=b.foes.filter(f=>f.alive); return {kind:'hlist', items:fs.map(t=>({obj:t,act:()=>pickMushTarget(t)}))}; }
  if(b.sub==='item'){ return {kind:'vlist', items:(b.itemList||[]).map(id=>({id,act:()=>pickItem(id)}))}; }
  return null;
}
function battleFocusObj(){ // the battler currently under the cursor (for render highlight)

  const it=nav.items[Math.min(battle.cursor||0,nav.items.length-1)];

}
function battleMove(dir){
  const nav=getBattleNav(); if(!nav||nav.kind==='leave') return;
  const n=nav.items.length; if(n<=0) return;
  let c=Math.min(battle.cursor||0, n-1);
  if(nav.kind==='grid'){ const cols=nav.cols||2, rows=Math.ceil(n/cols); let r=Math.floor(c/cols), cc=c%cols;
    if(dir==='left') cc=(cc-1+cols)%cols; else if(dir==='right') cc=(cc+1)%cols; else if(dir==='up') r=(r-1+rows)%rows; else r=(r+1)%rows;
    c=r*cols+cc; if(c>=n) c=n-1; }
  else { if(dir==='up'||dir==='left') c=(c-1+n)%n; else c=(c+1)%n; }
  battle.cursor=c;
}
function battleConfirm(){
  const b=battle; if(!b) return;
  if(b.phase==='ENDLESSWON'){ continueEndless(); return; }   // A = keep going
  if(b.phase==='FACTORYWON'){ openFactorySwap(); return; }
  const nav=getBattleNav(); if(!nav) return; const n=nav.items.length; if(n<=0) return;
  const it=nav.items[Math.min(battle.cursor||0,n-1)]; if(it&&it.act) it.act();
}
function menuMove(dir){
  if(!menu) return; const items=menu.items, n=items.length; if(!n) return;
  let c=menu.cursor||0;
  if(dir==='left') c-=menu.perPage; else if(dir==='right') c+=menu.perPage;
  else if(dir==='up') c-=1; else c+=1;
  c=((c%n)+n)%n;
  const fwd=(dir==='down'||dir==='right')?1:-1; let guard=0;
  while(items[c] && items[c].disabled && guard<n){ c=((c+fwd)%n+n)%n; guard++; }
  menu.cursor=c;
  if(c<menu.scroll) menu.scroll=c;
  if(c>=menu.scroll+menu.perPage) menu.scroll=c-menu.perPage+1;
}
function menuConfirm(){ if(!menu) return; const it=menu.items[menu.cursor||0]; if(it&&!it.disabled&&it.fn) it.fn(); }
function partyMove(dir){
  const N=Math.max(1,G.party.length), FIRST=N, LAST=N+4;
  let c=G.partyCursor||0; if(c>LAST)c=LAST;
  if(dir==='up'){
    if(c>=FIRST) c=N-1;            // from a button up to the bottom monster
    else c=(c-1+N)%N;              // cycle through monster rows
  } else if(dir==='down'){
    if(c<N-1) c++;                 // next monster down
    else if(c===N-1) c=FIRST;      // bottom monster -> first button
    else c=0;                      // from buttons loop back to top monster
  } else if(dir==='left'){
    if(c>=FIRST) c=(c>FIRST? c-1 : LAST);   // cycle buttons (only when on the button row)
  } else if(dir==='right'){
    if(c>=FIRST) c=(c<LAST? c+1 : FIRST);
  }
  G.partyCursor=c;
}

const farmWork = { w:[], fx:[], pulse:0 };   // runtime-only worker animation state (never saved)
function plotSprKey(pl){   // species sprite of a plot's worker (recovers the species from older saves if needed)

  if(!psp || !SPECIES[psp]){ const mm=[].concat(G.party,G.roster,G.box).find(x=>x && x.uid===pl.uid); if(mm && SPECIES[mm.sp]) psp=mm.sp; }
  if(!psp || !SPECIES[psp]){ const bn=pl.name && pl.name.toLowerCase(); if(bn && SPECIES[bn]) psp=bn; }
  if(psp && SPECIES[psp]) pl.sp=psp;

}
function farmPower(mon){ const st=computeStats(mon); return st.hp*0.45 + st.atk + st.def + st.spd + st.mp*0.25; }   // same shape as missionChance
function farmFrac(pw){ return Math.max(0, Math.min(1, (pw-FARM_POW_LO)/(FARM_POW_HI-FARM_POW_LO))); }
function farmRateMult(pw){ return 1 + farmFrac(pw)*(FARM_RATE_MAX-1); }                       // 1.0x .. FARM_RATE_MAX
function farmGradeOdds(pw){ const t=farmFrac(pw); const p3=FARM_G3_MAX*t*t, p2=Math.min(1-p3, FARM_G2_BASE+FARM_G2_SLOPE*t); return [Math.max(0,1-p2-p3), p2, p3]; }
function plotPower(pl){ if(!pl) return 0; if(pl._pw==null && pl.mon) pl._pw=farmPower(pl.mon); return pl._pw||FARM_POW_LO; }
function rollGrade(pw){ const o=farmGradeOdds(pw), r=Math.random(); return r<o[2]?3 : r<o[2]+o[1]?2 : 1; }
function chestAdd(id, n){ const c=G.farm.chest; c[id]=(c[id]||0)+(n||1); }

function dismissCaretaker(p, silent){

  if(!m){ let sp=(pl.sp&&SPECIES[pl.sp])?pl.sp:(pl.name&&SPECIES[pl.name.toLowerCase()]?pl.name.toLowerCase():null); if(sp) m=makeMonster(sp); }

function assignCaretaker(p, m){
  if(G.roster.length<=1){ toast('KEEP 1+ MONSTER'); return; }   // never commit your last fighter
  dismissCaretaker(p, true);                                    // send any current caretaker home first
  const el=SPECIES[m.sp].el;
  G.party=G.party.filter(x=>x!==m); G.roster=G.roster.filter(x=>x!==m); G.box=G.box.filter(x=>x!==m);   // committed to the plot, out of rotation

  G.farm.grown[p]=Array(FARM_SLOTS).fill(false); G.farm.grade[p]=Array(FARM_SLOTS).fill(0); farmWork.w[p]=null;

function growFarm(){   // each Coliseum challenge gives every tended plot a head start (counted in step-equivalents, scaled by the worker's speed)
  for(let p=0;p<FARM_PLOTS;p++){ const pl=G.farm.plots[p]; if(!pl) continue; farmGrowPlot(p, FARM_COLI_BONUS*farmRateMult(plotPower(pl))); }

  if(benchSlots() < BENCH_MAX){ G.roster.push(m); return 'BENCH'; }

function farmSprout(p){   // a cap ripens on plot p. In the bay it sits on the soil until the worker walks over; away, the worker has already boxed it.
  const pl=G.farm.plots[p]; if(!pl) return false;
  const gr=rollGrade(plotPower(pl));
  if(curMap==='farm'){ const g=G.farm.grown[p]; const free=[]; for(let i=0;i<FARM_SLOTS;i++) if(!g[i]) free.push(i);
    if(!free.length) return false;
    const i=free[Math.floor(Math.random()*free.length)]; g[i]=true; G.farm.grade[p][i]=gr; return true; }
  chestAdd(mushIdOf(pl.el, gr), 1); return true;

function farmGrowPlot(p, amt){   // progress in step-equivalents; FARM_STEPS_PER_SHROOM of it = one cap
  const pl=G.farm.plots[p]; if(!pl) return 0; let made=0;
  pl.prog=(pl.prog||0)+amt;
  while(pl.prog>=FARM_STEPS_PER_SHROOM){ if(!farmSprout(p)){ pl.prog=FARM_STEPS_PER_SHROOM; break; } pl.prog-=FARM_STEPS_PER_SHROOM; made++; }
  return made;
}
function farmStep(){   // called on every overworld step: grows every tended plot at its worker's own speed, and carries any expedition forward
  if(typeof missionStep==='function') missionStep();
  if(!G.farm) return;
  for(let p=0;p<FARM_PLOTS;p++){ const pl=G.farm.plots[p]; if(pl) farmGrowPlot(p, farmRateMult(plotPower(pl))); }

function monMushId(mon){ const el=SPECIES[mon.sp].el; return MUSH[el]?MUSH[el].id:null; }   // the grade-1 cap that matches a monster's type

function feedMush(mon, id){
  id = id || monMushIds(mon).find(i=>(G.items[i]||0)>0); if(!id) return;
  if((G.items[id]||0)<=0){ toast('NONE TO FEED'); return; }

function farmSlotSpot(p, i){ const R=farmPlotRect(p); return { x:Math.max(R.x+6, Math.min(R.x+26, R.x+(i%4)*8+4)), y:Math.max(R.y+10, R.y+(((i/4)|0)+1)*8) }; }   // where a worker stands to pick slot i (x centre, y feet)
function farmWorkerNew(p, pl){ const R=farmPlotRect(p);
  return { uid:pl.uid, x:R.x+6+Math.random()*20, y:R.y+10+Math.random()*6, tx:0, ty:0, slot:-1, st:'pause', t:200+Math.random()*1200, flip:Math.random()<0.5, ph:Math.random()*1000, done:false }; }
function farmFxAdd(f){ if(farmWork.fx.length<40) farmWork.fx.push(f); }
function farmWorkerHarvest(p, slot, w){
  const pl=G.farm.plots[p]; if(!pl) return;
  const gr=(G.farm.grade[p][slot])||1; G.farm.grown[p][slot]=false; G.farm.grade[p][slot]=0;
  const id=mushIdOf(pl.el, gr); chestAdd(id, 1);
  const sp=farmSlotSpot(p, slot);
  farmFxAdd({ k:'spark', x:sp.x, y:sp.y-8, t:0, dur:420 });
  farmFxAdd({ k:'arc', x0:sp.x, y0:sp.y-14, x1:76, y1:62, t:0, dur:620, el:pl.el, gr });
  farmFxAdd({ k:'plus', x:sp.x-5, y:sp.y-18, t:0, dur:700, gr });
}
function farmWorkerStep(p, pl, w, dt){
  const R=farmPlotRect(p), g=G.farm.grown[p]; w.ph+=dt;
  if(w.st==='pause'){
    w.t-=dt;
    if(w.t<=0){
      let best=-1, bd=1e9;
      for(let i=0;i<FARM_SLOTS;i++) if(g[i]){ const c=farmSlotSpot(p,i), d=Math.abs(c.x-w.x)+Math.abs(c.y-w.y); if(d<bd){ bd=d; best=i; } }
      if(best>=0){ const c=farmSlotSpot(p,best); w.slot=best; w.tx=c.x; w.ty=c.y; }
      else { w.slot=-1; w.tx=R.x+6+Math.random()*20; w.ty=R.y+10+Math.random()*6; }
      w.st='walk';
    }
  } else if(w.st==='walk'){
    if(w.slot>=0 && !g[w.slot]){ w.st='pause'; w.t=250; w.slot=-1; return; }   // someone picked it by hand
    const dx=w.tx-w.x, dy=w.ty-w.y, d=Math.hypot(dx,dy), sp=FARM_WALK_SPEED*dt;
    if(d<=sp){ w.x=w.tx; w.y=w.ty;
      if(w.slot>=0){ w.st='pick'; w.t=FARM_PICK_MS; w.done=false; }
      else { w.st='pause'; w.t=500+Math.random()*1500; } }
    else { w.x+=dx/d*sp; w.y+=dy/d*sp; if(Math.abs(dx)>0.2) w.flip=dx<0; }
  } else if(w.st==='pick'){
    w.t-=dt;
    if(!w.done && w.t<=FARM_PICK_MS*0.5){ w.done=true; if(g[w.slot]) farmWorkerHarvest(p, w.slot, w); }
    if(w.t<=0){ w.st='pause'; w.t=300+Math.random()*500; w.slot=-1; }
  }
}
function farmAnimUpdate(dt){
  if(curMap!=='farm' || !G.farm) return;
  const FW=farmWork; FW.pulse=Math.max(0, FW.pulse-dt);
  for(let p=0;p<FARM_PLOTS;p++){
    const pl=G.farm.plots[p];
    if(!pl){ FW.w[p]=null; continue; }
    let w=FW.w[p]; if(!w || w.uid!==pl.uid) w=FW.w[p]=farmWorkerNew(p, pl);
    farmWorkerStep(p, pl, w, dt);
  }
  for(let i=FW.fx.length-1;i>=0;i--){ const f=FW.fx[i]; f.t+=dt; if(f.t>=f.dur){ if(f.k==='arc') FW.pulse=300; FW.fx.splice(i,1); } }
}
function farmPushDraws(draws){   // worker sprites + the chest, y-sorted with the player

  for(let p=0;p<FARM_PLOTS;p++){ const pl=G.farm.plots[p], w=FW.w[p]; if(!pl || !w) continue;

    draws.push({ py:w.y-8, fn:()=>{

    }

}
function farmDrawFx(){   // arcing caps, +1 floats, sparkles (world space, above everything)
  for(const f of farmWork.fx){ const u=f.t/f.dur;
    if(f.k==='arc'){ const x=f.x0+(f.x1-f.x0)*u, y=f.y0+(f.y1-f.y0)*u-Math.sin(u*Math.PI)*16; drawMushroom(Math.round(x)-4, Math.round(y)-4, f.el, f.gr); }
