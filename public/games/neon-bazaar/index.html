    else { if(ax0<-GP_DEADZONE)nd='left'; else if(ax0>GP_DEADZONE)nd='right'; } }
  const echo = performance.now()-kbLastT<150;      // the same press already arrived as a key event (Android sends both)
  if(nd!==gpDir){
    if(nd){ ensureAudio(); resumeAudio(); if(!hhStartGone() && !echo) pressDir(nd); gpLastT=performance.now(); gpDirT=0; gpRepeatT=0; }
    else if(held===gpDir){ releaseDir(); }
    gpDir=nd;
  } else if(nd){                                   // held: DAS/ARR auto-repeat for menu navigation
    gpDirT+=dt; if(gpDirT>=GP_DAS){ gpRepeatT+=dt; if(gpRepeatT>=GP_ARR){ gpRepeatT=0; pressDir(nd); } }
  }

  // ---- edge-triggered buttons ----
  const edge=(i,fn)=>{ const n=btn(i); if(n && !gpPrevBtn[i]){ ensureAudio(); resumeAudio(); if(!hhStartGone() && !echo) fn(); gpLastT=performance.now(); } gpPrevBtn[i]=n; };
  edge(0, ()=>gpSwapAB?pressB():pressA());   // A / Cross  -> OK   (swapped in Options on pads that report them the other way round)
  edge(1, ()=>gpSwapAB?pressA():pressB());   // B / Circle -> Back
  edge(2, ()=>pressMenu());         // X / Square -> Party
  edge(3, ()=>pressSelect());       // Y / Triangle -> Select
  edge(9, ()=>pressMenu());         // Start
  edge(8, ()=>pressSelect());       // Select

  // any controller activity hides the touch overlay
  gpAnyDown = !!(nd || btn(0)||btn(1)||btn(2)||btn(3)||btn(8)||btn(9));
  if(gpAnyDown) hideControls();
}
/* HANDHELD start: one tap goes full screen, starts the sound and keeps the screen awake (browsers only allow these
   after a touch). A controller press also starts the game, just without full screen. */
let hhStart=null, hhWake=null;
function hhWakeLock(){ try{ if(navigator.wakeLock && !document.hidden) navigator.wakeLock.request('screen').then(l=>{ hhWake=l; }).catch(()=>{}); }catch(e){} }
function hhStartGone(){ if(!hhStart) return false; const el=hhStart; hhStart=null; el.remove(); hhWakeLock(); return true; }   // true = this press only cleared the start screen
function hhSetup(){
  if(!HANDHELD) return;
  hhStart=document.getElementById('hh-start');
  if(hhStart) hhStart.addEventListener('pointerdown', e=>{ e.preventDefault(); ensureAudio(); resumeAudio();
    const d=document.documentElement; try{ const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'}); if(r&&r.catch) r.catch(()=>{}); }catch(err){}
    hhStartGone(); });
  try{ history.pushState({nbc:1},''); window.addEventListener('popstate', ()=>{ history.pushState({nbc:1},'');   // Android BACK (often the B button): stay in the game
    if(performance.now()-gpLastT>150) pressB(); }); }catch(e){}
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !hhStart) hhWakeLock(); });
  document.addEventListener('contextmenu', e=>e.preventDefault());
  hhWakeLock();                                   // keep the screen awake from the start (no tap needed; quietly skipped where not allowed)
}
const GP_ECHO_KEYS={arrowup:1,arrowdown:1,arrowleft:1,arrowright:1,enter:1,' ':1,escape:1,backspace:1,goback:1,browserback:1};
window.addEventListener('gamepadconnected', ()=>{ hideControls(); toast('CONTROLLER CONNECTED'); });
window.addEventListener('gamepaddisconnected', ()=>{ showControls(); });
// Steam Deck suspend/resume: the Web Audio context is suspended on sleep — recover it on wake / refocus
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resumeAudio(); });
window.addEventListener('focus', ()=>{ resumeAudio(); });

/* FIXED GAME CLOCK (3.50): the game logic always runs 60 ticks per second of real time, no matter how fast
   the screen draws. Walking, battles and transitions keep the same speed at 30, 60 or 120 fps; drawing happens
   once per screen refresh, at most 60 times a second (high-refresh screens don't do double work). */
const TICK_MS=1000/60;
let tickAcc=0;
function frame(ts){
  let el = lastT ? ts-lastT : TICK_MS; lastT=ts;
  if(!(el>=0) || el>250) el=TICK_MS;                       // tab was hidden or a long stall: don't fast-forward
  for(const m of [0.5,1,2,3]){ if(Math.abs(el-TICK_MS*m)<Math.min(1,TICK_MS*m*0.05)){ el=TICK_MS*m; break; } }   // lock to the screen's refresh so 59.94/60.05 Hz screens never hitch
  tickAcc+=el;
  let steps=0;
  try {
    while(tickAcc > TICK_MS-3 && steps<4){ pollGamepad(TICK_MS); update(TICK_MS); tickAcc-=TICK_MS; steps++; }
    if(steps===4 && tickAcc>TICK_MS) tickAcc=0;              // far behind (under 15 fps): drop the backlog
    if(steps>0){ lightBeginFrame(); render(); renderEncTrans(); renderWinExit(); lightPresent(ts); fpsCount(ts); }
  } catch(e){ console.error(e); ctx.fillStyle='#f00'; drawText('ERR:'+e.message, 4, 4, '#fff'); }
  requestAnimationFrame(frame);
}
/* SCREEN OVERLAY (3.52): scanlines (default), dot matrix, or off. One fixed layer over the screen picture,
   lined up with the game pixels; the browser draws it, so it costs nothing per frame. Remembered on this device. */
const OVERLAY_ORDER=['scan','dots','off'], OVERLAY_NAMES={scan:'SCANLINES', dots:'DOT MATRIX', off:'OFF'};
let overlayMode='scan', overlayEl=null;
try{ const m=localStorage.getItem('nbc_overlay'); if(OVERLAY_NAMES[m]) overlayMode=m; }catch(e){}
function overlayApply(){
  if(!overlayEl){ const wrap=document.getElementById('screen-wrap'); if(!wrap) return; wrap.style.position='relative';
    overlayEl=document.createElement('div'); overlayEl.style.cssText='position:absolute;pointer-events:none;z-index:3;border-radius:3px;'; wrap.appendChild(overlayEl); }
  const cs=getComputedStyle(canvas), bl=parseFloat(cs.borderLeftWidth)||0, bt=parseFloat(cs.borderTopWidth)||0;
  const a=canvas.getBoundingClientRect(), wr=canvas.parentNode.getBoundingClientRect(), w=a.width-bl-(parseFloat(cs.borderRightWidth)||0), h=a.height-bt-(parseFloat(cs.borderBottomWidth)||0), px=w/W;
  const st=overlayEl.style; st.left=(a.left-wr.left+bl)+'px'; st.top=(a.top-wr.top+bt)+'px'; st.width=w+'px'; st.height=h+'px';
  if(overlayMode==='scan'){ st.backgroundImage='linear-gradient(to bottom, rgba(0,0,0,0) 0 55%, rgba(6,3,14,0.42) 55% 100%)'; st.backgroundSize='100% '+px+'px'; st.display='block'; }
  else if(overlayMode==='dots'){ st.backgroundImage='linear-gradient(to right, rgba(6,3,14,0.38) 0 18%, rgba(0,0,0,0) 18% 100%), linear-gradient(to bottom, rgba(6,3,14,0.38) 0 18%, rgba(0,0,0,0) 18% 100%)'; st.backgroundSize=px+'px '+px+'px'; st.display='block'; }
  else st.display='none';
}
function overlayCycle(d){ const i=OVERLAY_ORDER.indexOf(overlayMode); overlayMode=OVERLAY_ORDER[(i+d+OVERLAY_ORDER.length)%OVERLAY_ORDER.length];
  try{ localStorage.setItem('nbc_overlay', overlayMode); }catch(e){} overlayApply(); }
/* frame-rate readout in the header above the screen (press F, or tap the version number on the title screen) */
let fpsOn=false, fpsN=0, fpsT=0, fpsEl=null;
try{ fpsOn=localStorage.getItem('nbc_fps')==='1'; }catch(e){}
function fpsCount(ts){ fpsN++; if(!fpsT) fpsT=ts; if(ts-fpsT>=1000){ const f=Math.round(fpsN*1000/(ts-fpsT)); fpsN=0; fpsT=ts; fpsShow(f); } }
function fpsShow(f){ if(!fpsEl){ const b=document.getElementById('brand'); if(!b) return; fpsEl=document.createElement('span'); fpsEl.style.cssText='margin-left:10px;color:#43e08a;letter-spacing:1px'; b.appendChild(fpsEl); }
  fpsEl.style.display=fpsOn?'inline':'none'; if(f!=null) fpsEl.textContent=f+' FPS'+(LIGHTING.on?'':(LIGHTING.offFps?' / LIGHT OFF ('+LIGHTING.offFps+' FPS LIT)':' / NO LIGHT')); }
function toggleFps(){ fpsOn=!fpsOn; try{ localStorage.setItem('nbc_fps', fpsOn?'1':'0'); }catch(e){} fpsShow(null); toast(fpsOn?'FPS SHOWN':'FPS HIDDEN'); }
function fitCanvas(){
  const wrap=document.getElementById('screen-wrap');
  const cs=getComputedStyle(canvas);                // the frame border sits INSIDE the canvas box (border-box), so
  const bx=(parseFloat(cs.borderLeftWidth)||0)+(parseFloat(cs.borderRightWidth)||0);   // size the picture area itself,
  const by=(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);   // then add the frame back on
  const aw=wrap.clientWidth-bx, ah=wrap.clientHeight-by;
  const fit=Math.min(aw/W, ah/H);                 // CSS px per game pixel that would fill the space
  const dpr=window.devicePixelRatio||1;
  const dev=Math.floor(fit*dpr);                  // snap to WHOLE physical screen pixels per game pixel, so every
  let scale;                                      // pixel column is the same width (uneven scales made thin
  if(dev>=1) scale=dev/dpr;                       // letter strokes randomly thicken or vanish)
  else scale=Math.max(0.5,fit);                   // only on absurdly tiny windows
  canvas.style.width=(W*scale+bx)+'px';
  canvas.style.height=(H*scale+by)+'px';
  lightFit(); try{ overlayApply(); }catch(e){}
}
function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)/r.width*W;
  const cy=(e.clientY-r.top)/r.height*H;
  return {x:cx, y:cy};
}
function handleTap(e){
  ensureAudio(); resumeAudio();
  if(deathScene) return;
  const p=canvasPoint(e);
  // iterate regions in reverse (later drawn = on top)
  for(let i=clickRegions.length-1;i>=0;i--){ const r=clickRegions[i]; if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){ r.fn(); return; } }
}
function bindBtn(id, downFn, upFn){
  const el=document.getElementById(id); if(!el) return;
  const d=ev=>{ ev.preventDefault(); ensureAudio(); resumeAudio(); downFn(); };
  const u=ev=>{ ev.preventDefault(); if(upFn)upFn(); };
  el.addEventListener('touchstart', d, {passive:false});
  el.addEventListener('touchend', u, {passive:false});
  el.addEventListener('mousedown', d);
  el.addEventListener('mouseup', u);
  el.addEventListener('mouseleave', ()=>{ if(upFn)upFn(); });
}
function init(){
  canvas=document.getElementById('screen'); ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=false;
  initStorage();
  buildFont(); buildMap();
  lightInit();
  // dpad
  document.querySelectorAll('.dbtn').forEach(el=>{ const dir=el.getAttribute('data-dir');
    bindBtn(el.id, ()=>pressDir(dir), ()=>{ if(held===dir) releaseDir(); }); });
  bindBtn('b-a', ()=>pressA(), null);
  bindBtn('b-b', ()=>pressB(), null);
  bindBtn('b-menu', ()=>pressMenu(), null);
  bindBtn('b-opts', ()=>pressSelect(), null);
  hhSetup();
  window.addEventListener('rqpad:layout', ()=>{ try{ rqRestyle(); fitCanvas(); }catch(e){} });
  // canvas taps
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); handleTap(e.touches[0]); }, {passive:false});
  canvas.addEventListener('mousedown', e=>{ handleTap(e); });
  // keyboard (desktop convenience)
  window.addEventListener('keydown', e=>{
    ensureAudio(); resumeAudio(); if(e.isTrusted) hideControls(); if(hhStartGone()){ e.preventDefault(); return; }
    const k=e.key.toLowerCase();
    if(gpWasPresent && GP_ECHO_KEYS[k] && (gpAnyDown || performance.now()-gpLastT<150)){ e.preventDefault(); return; }   // controller press echoed as a key: already handled
    if(GP_ECHO_KEYS[k]) kbLastT=performance.now();
    if(k==='goback'||k==='browserback'){ e.preventDefault(); pressB(); return; }
    if(G.screen==='NAMING'){
      if(k==='enter'){ nameConfirm(); }
      else if(k==='escape'){ nameCancel(); }
      else if(k==='backspace'){ nameDel(); }
      else if(k==='arrowup'){ namingDir('up'); }
      else if(k==='arrowdown'){ namingDir('down'); }
      else if(k==='arrowleft'){ namingDir('left'); }
      else if(k==='arrowright'){ namingDir('right'); }
      else if(e.key.length===1 && /^[A-Za-z0-9 .,!?'\-]$/.test(e.key)){ nameAppend(e.key); }
      e.preventDefault(); return;
    }
    if(k==='arrowup'||k==='w')pressDir('up'); else if(k==='arrowdown'||k==='s')pressDir('down');
    else if(k==='arrowleft'||k==='a')pressDir('left'); else if(k==='arrowright'||k==='d')pressDir('right');
    else if(k==='z'||k==='enter'||k===' ')pressA(); else if(k==='x'||k==='escape'||k==='backspace')pressB();
    else if(k==='c'||k==='m')pressMenu();
    else if(k==='n')toggleMute();
    else if(k==='o')pressSelect();
    if(HANDHELD && GP_ECHO_KEYS[k]) e.preventDefault();
    else if(k==='f')toggleFps();
  });
  window.addEventListener('keyup', e=>{ const k=e.key.toLowerCase(); const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}; if(map[k]===held) releaseDir(); });
  // touching/clicking the screen means the player is back on touch -> bring the controls back
  document.addEventListener('touchstart', showControls, {passive:true});
  document.addEventListener('mousedown', showControls);
  window.addEventListener('resize', fitCanvas);
  fitCanvas();
  rqInstall();
  resetFollowers();
  // (3.67) try to start the sound right away. Packaged builds (Electron for Steam, an Android/iOS web-view app) can allow
  // this - the title theme then plays from the first frame. A plain browser keeps audio locked until the first tap/key,
  // and the theme starts then instead.
  //   Electron:  app.commandLine.appendSwitch('autoplay-policy','no-user-gesture-required')
  //   Android :  webView.getSettings().setMediaPlaybackRequiresUserGesture(false)   (Cordova: MediaPlaybackRequiresUserAction=false)
  //   iOS     :  config.mediaTypesRequiringUserActionForPlayback = []
  try{ ensureAudio(); resumeAudio(); }catch(e){}
  requestAnimationFrame(frame);
}

/* ===END GAME JS=== */
if (typeof module !== 'undefined' && module.exports){
  module.exports = { PAL, SKILLS, SPECIES, EQUIP, ITEMS, TIERS, G,
    makeMonster, computeStats, makeBattler, makeEnemyBattler, makeEnemyTeam,
    execAction, chooseEnemyAction, simulateBattle, damageCalc, affFor, canAct, roundTick, tickStatuses,
    buyMonster, buyEquip, buyItem, equipTo, unequip, makeEssence, doFusion, applyEssence,
    __t:{ setBattle:v=>{battle=v;}, getBattle:()=>battle, setMenu:v=>{menu=v;}, getMenu:()=>menu,
      getBattleNav, battleMove, battleConfirm, menuMove, menuConfirm,
      sampleTrail, setTrail:v=>{trail.length=0;v.forEach(p=>trail.push(p));}, getTrail:()=>trail,
      setPlayer:(x,y)=>{player.px=x;player.py=y;} },
    __s:{ getG:()=>G, initStorage, getBackendName:()=>storageBackend?storageBackend.name:null,
      setCachedSave:v=>{cachedSave=v;}, getCachedSave:()=>cachedSave,
      serializeGame, saveGame, loadGame, hasSave, buildMapFrom, objAt, doorAt,
      getMap:()=>map, getSolid:()=>solid, getDoors:()=>doors,
      openChest, chestStore, chestTake, pcDeposit, pcWithdraw, getMenu:()=>menu,
      makeMonster, computeStats, buyEquip, equipTo, MAPS } };
}
if (typeof window !== 'undefined' && typeof document !== 'undefined'){
  window.addEventListener('DOMContentLoaded', init);
}
</script>
