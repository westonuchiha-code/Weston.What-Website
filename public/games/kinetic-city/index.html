<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kinetic City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-bleed game canvas; DOM overlays sit on top as left-anchored neon panels. Single dark theme by design. */
:root{
  --bg:#05060b;
  --panel:rgba(9,11,20,.93);
  --line:rgba(120,140,190,.22);
  --ink:#e8ecf7;
  --dim:#8790aa;
  --cyan:#3ce0ff;
  --pink:#ff3d8b;
  --gold:#ffc24a;
  --good:#38d0ff;
  --evil:#ff3355;
  --font-display:"Tilt Neon","Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--font-body);color:var(--ink)}
#game{position:fixed;display:block}
.layer{position:fixed;inset:0;display:none;z-index:10}
.layer.on{display:flex}
button{font-family:inherit;color:inherit}
.nav{outline:none}
/* ---------- glyphs ---------- */
.g{display:inline-flex;vertical-align:middle;line-height:0}
.g svg{height:1.5em;width:auto}
/* ---------- title ---------- */
#title{flex-direction:column;justify-content:flex-end;padding:3vh 6vw 7vh;overflow-y:auto;background:linear-gradient(90deg,rgba(5,6,11,.92) 0%,rgba(5,6,11,.65) 38%,rgba(5,6,11,0) 70%)}
.logo{font-family:var(--font-display);font-size:clamp(34px,min(9vw,13vh),118px);line-height:.92;margin:0;color:#dffcff;letter-spacing:.02em;text-wrap:balance;
  text-shadow:0 0 6px #fff,0 0 18px var(--cyan),0 0 42px var(--cyan),0 0 80px rgba(60,224,255,.6)}
.logo span{display:block;color:#ffe0ee;text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 42px var(--pink),0 0 80px rgba(255,61,139,.6);animation:flick 6s infinite}
@keyframes flick{0%,18%,22%,60%,100%{opacity:1}19%,21%{opacity:.35}61%{opacity:.6}}
#tmenu{margin-top:26px}
.menu{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mbtn{background:transparent;border:0;border-left:3px solid transparent;padding:8px 18px 8px 14px;font-size:clamp(18px,2vw,24px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:color .12s,border-color .12s,background .12s}
.mbtn:hover,.mbtn.focus{color:#fff;border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(60,224,255,.16),rgba(60,224,255,0))}
.mbtn[disabled]{opacity:.35;cursor:default}
.padstat{margin-top:28px;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dim);max-width:60ch;line-height:1.4}
.padstat .dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.padstat.ok .dot{background:#4dff9a;box-shadow:0 0 10px #4dff9a}
.padstat.warn .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
/* ---------- dialogue ---------- */
#dlg{align-items:flex-end;justify-content:center;padding:0 16px 4vh;pointer-events:auto}
#dbox{width:min(880px,100%);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:16px 22px 14px;box-shadow:0 10px 60px rgba(0,0,0,.6)}
#dwho{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px}
#dtext{font-size:clamp(16px,1.7vw,21px);line-height:1.45;min-height:2.9em;max-width:68ch}
#dchoices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{background:rgba(255,255,255,.03);border:1px solid var(--line);border-left:3px solid var(--dim);text-align:left;padding:10px 14px;font-size:17px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.choice small{font-weight:500;opacity:.85}
.choice.good{border-left-color:var(--good)}.choice.good small{color:var(--good)}
.choice.evil{border-left-color:var(--evil)}.choice.evil small{color:var(--evil)}
.choice:hover,.choice.focus{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.5)}
#dhint{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:13px;color:var(--dim);margin-top:8px}
/* ---------- pause ---------- */
#pause{background:rgba(4,5,10,.84);backdrop-filter:blur(3px);align-items:stretch;justify-content:center;overflow:hidden}
.pwrap{width:min(1120px,100%);height:100%;padding:4vh 24px 3vh;display:flex;flex-direction:column;gap:18px}
#pbody{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ptitle{font-family:var(--font-display);font-size:40px;margin:0;color:#e6fbff;text-shadow:0 0 14px var(--cyan)}
.tabs{display:flex;gap:6px;align-items:center}
.tab{background:transparent;border:1px solid transparent;padding:6px 14px;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.tab.sel{color:#fff;border-color:var(--line);background:rgba(255,255,255,.06)}
.tab.focus{color:#fff;border-color:var(--cyan)}
.stats{display:flex;flex-wrap:wrap;gap:22px;font-size:15px;color:var(--dim)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col h3{margin:0 0 4px;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.col p.req{margin:0 0 10px;font-size:13px;color:var(--dim)}
.col.good h3{color:var(--good)}.col.evil h3{color:var(--evil)}
.card{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .nm{font-weight:700;font-size:15px;letter-spacing:.06em}
.card .ds{font-size:13.5px;color:#b9c0d4;margin-top:4px;line-height:1.35}
.card .st{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.pips{display:flex;gap:3px}.pips i{width:12px;height:5px;background:rgba(255,255,255,.14);display:block}.pips i.f{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.card.can .st{color:var(--gold)}
.card.lock{opacity:.45}
.card:hover,.card.focus{border-color:#fff;background:rgba(255,255,255,.08)}
.col.good .card.focus{border-color:var(--good)}.col.evil .card.focus{border-color:var(--evil)}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:820px){.ctl{grid-template-columns:1fr}}
.ctl h3{margin:0 0 10px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ctl ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ctl li{display:flex;align-items:center;gap:12px;font-size:16px}
.ctl li .k{min-width:84px;display:flex;justify-content:flex-end}
.ctl li span.d{color:#c7cde0}
.ctl li.fixed{padding:2px 8px;opacity:.75}
.bind{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:2px 8px;font-size:inherit;cursor:pointer}
.bind:hover,.bind.focus{border-color:var(--cyan);background:rgba(60,224,255,.08)}
.bind .wait{color:var(--gold);font-weight:700}
.rst{margin-top:12px;padding:6px 14px;font-size:12px}
.bindmsg{margin:14px 0 0;font-size:13px;color:var(--dim)}
.setgrid{display:flex;flex-direction:column;gap:8px;max-width:560px}
.sethead{margin:10px 0 0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.sethead:first-child{margin-top:0}
.set.warn .v{color:var(--evil)}
.set{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:12px 14px;font-size:16px;font-weight:600;cursor:pointer;text-align:left}
.set.focus,.set:hover{border-color:var(--cyan);background:rgba(255,255,255,.07)}
.set .v{color:var(--cyan);font-variant-numeric:tabular-nums}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.pfoot .acts{display:flex;gap:8px}
.pbtn{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:10px 18px;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.pbtn.focus,.pbtn:hover{border-color:var(--cyan);color:#fff;background:rgba(60,224,255,.12)}
.hints{display:flex;gap:16px;font-size:13px;color:var(--dim);align-items:center}
.hints span{display:inline-flex;gap:6px;align-items:center}
/* ---------- neon theme: menus styled like the city's signs (colour per item, glow, slanted plates) ---------- */
:root{--purple:#b26bff;--green:#4dff9a}
#title::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
#tmenu{margin-top:30px;gap:12px;position:relative;padding-top:24px}
#tmenu::before{content:"";position:absolute;top:0;left:0;width:min(460px,60vw);height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--pink) 60%,transparent);box-shadow:0 0 12px var(--pink),0 0 26px rgba(60,224,255,.6)}
.mbtn{--c:var(--cyan);position:relative;min-width:min(330px,70vw);text-align:left;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:4px;transform:skewX(-9deg);padding:10px 26px 10px 22px;
  color:color-mix(in srgb,var(--c) 70%,#fff);background:rgba(6,8,16,.6);text-shadow:0 0 9px color-mix(in srgb,var(--c) 75%,transparent);
  box-shadow:0 0 10px color-mix(in srgb,var(--c) 28%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 12%,transparent);transition:color .12s,background .12s,box-shadow .12s,transform .12s,border-color .12s}
#tmenu .mbtn:nth-child(1){--c:var(--cyan)}#tmenu .mbtn:nth-child(2){--c:var(--pink)}#tmenu .mbtn:nth-child(3){--c:var(--gold)}#tmenu .mbtn:nth-child(4){--c:var(--purple)}
.mbtn:hover,.mbtn.focus{color:#fff;border-color:var(--c);border-left-color:var(--c);transform:skewX(-9deg) translateX(16px);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 8%,transparent));
  text-shadow:0 0 6px #fff,0 0 14px var(--c);box-shadow:0 0 8px var(--c),0 0 26px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.mbtn.focus::before{content:"";position:absolute;left:-20px;top:50%;width:9px;height:9px;margin-top:-5px;background:var(--c);transform:rotate(45deg);box-shadow:0 0 10px var(--c)}
.mbtn[disabled]{opacity:.32;box-shadow:none;text-shadow:none}
.padstat{margin-top:30px}
#pause{background:radial-gradient(110% 80% at 15% 0%,rgba(60,224,255,.13),transparent 55%),radial-gradient(110% 80% at 100% 100%,rgba(255,61,139,.14),transparent 55%),rgba(4,5,12,.87)}
.phead{border-bottom:2px solid;border-image:linear-gradient(90deg,var(--cyan),var(--pink) 55%,transparent) 1}
.pfoot{border-top:2px solid;border-image:linear-gradient(90deg,transparent,var(--pink) 45%,var(--cyan)) 1}
.ptitle{color:#fff;text-shadow:0 0 6px #fff,0 0 16px var(--cyan),0 0 38px var(--cyan)}
.tab{border-radius:3px;transform:skewX(-9deg);border-width:2px}
.tab.sel{color:#fff;border-color:var(--pink);background:rgba(255,61,139,.16);text-shadow:0 0 9px var(--pink);box-shadow:0 0 14px rgba(255,61,139,.5),inset 0 0 12px rgba(255,61,139,.22)}
.tab.focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(60,224,255,.6)}
.stats b{text-shadow:0 0 8px currentColor}
.col{--cc:var(--gold)}.col.good{--cc:var(--good)}.col.evil{--cc:var(--evil)}
.col h3{color:var(--cc);text-shadow:0 0 10px color-mix(in srgb,var(--cc) 70%,transparent)}
.card{border-left:3px solid var(--cc);border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 9%,transparent),rgba(255,255,255,.02) 60%)}
.card:hover,.card.focus,.col.good .card.focus,.col.evil .card.focus{border-color:var(--cc);background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 24%,transparent),color-mix(in srgb,var(--cc) 5%,transparent));box-shadow:0 0 16px color-mix(in srgb,var(--cc) 50%,transparent),inset 0 0 16px color-mix(in srgb,var(--cc) 14%,transparent)}
.card.can .st{text-shadow:0 0 8px var(--gold)}
.sethead{color:var(--pink);text-shadow:0 0 9px rgba(255,61,139,.65)}
.set{border-left:3px solid color-mix(in srgb,var(--cyan) 60%,transparent);border-radius:3px}
.set.focus,.set:hover{box-shadow:0 0 16px rgba(60,224,255,.45),inset 0 0 16px rgba(60,224,255,.12);background:linear-gradient(90deg,rgba(60,224,255,.2),rgba(60,224,255,.04))}
.set .v{text-shadow:0 0 9px currentColor}
.set.warn{border-left-color:var(--evil)}
.pbtn{--c:var(--cyan);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:3px;transform:skewX(-9deg);color:color-mix(in srgb,var(--c) 70%,#fff);background:rgba(6,8,16,.6);
  text-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--c) 25%,transparent)}
#bQuit{--c:var(--pink)}.rst{--c:var(--gold)}
.pbtn.focus,.pbtn:hover{border-color:var(--c);color:#fff;background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:0 0 8px var(--c),0 0 24px color-mix(in srgb,var(--c) 55%,transparent)}
.ctl h3{color:var(--cyan);text-shadow:0 0 9px rgba(60,224,255,.6)}.ctl>div:nth-child(2) h3{color:var(--pink);text-shadow:0 0 9px rgba(255,61,139,.6)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.look{--cc:var(--cyan);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 10%,transparent),rgba(255,255,255,.02));border:2px solid var(--line);border-radius:4px;cursor:pointer}
.look canvas{width:108px;height:138px;image-rendering:pixelated}
.look .nm{font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.look .st{font-size:12px;letter-spacing:.06em;color:var(--dim);text-align:center;min-height:2.4em;line-height:1.2}
.look.on{--cc:var(--gold);border-color:var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}.look.on .st{color:var(--gold)}
.look.lock canvas{filter:brightness(0) opacity(.55)}.look.lock .nm{color:var(--dim)}
.look:hover,.look.focus{border-color:var(--cc);box-shadow:0 0 18px color-mix(in srgb,var(--cc) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--cc) 14%,transparent)}
.lookhint{margin:0 0 12px;font-size:13px;color:var(--dim)}
.bind{border-radius:3px}.bind:hover,.bind.focus{box-shadow:0 0 14px rgba(60,224,255,.4),inset 0 0 12px rgba(60,224,255,.1)}
@media (max-height:520px){#tmenu{margin-top:10px}.mbtn{padding:4px 14px 4px 12px;font-size:17px}.menu{gap:2px}.padstat{margin-top:12px;font-size:12px}#title{padding-bottom:4vh}
  .pwrap{padding:10px 20px 8px;gap:8px}.phead{padding-bottom:6px}.ptitle{font-size:24px}.tab{padding:4px 12px;font-size:13px}.pfoot{padding-top:6px}.pbtn{padding:6px 14px;font-size:13px}
  .ctl{gap:20px}.ctl h3{margin-bottom:5px;font-size:12px}.ctl ul{gap:2px}.ctl li{font-size:12.5px;gap:8px}.ctl li .k{min-width:60px}}
@media (prefers-reduced-motion:reduce){.logo span{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="layer on">
  <h1 class="logo">KINETIC<span>CITY</span></h1>
  <div class="menu" id="tmenu">
    <button class="mbtn nav" id="bNew">New game</button>
    <button class="mbtn nav" id="bCont">Continue</button>
    <button class="mbtn nav" id="bCtl">Controls</button>
    <button class="mbtn nav" id="bSet">Settings</button>
  </div>
  <div class="padstat" id="padstat"><span class="dot"></span><span id="padtxt">Press any button on your controller.</span></div>
</div>

<div id="dlg" class="layer">
  <div id="dbox">
    <div id="dwho"></div>
    <div id="dtext"></div>
    <div id="dchoices"></div>
    <div id="dhint"><span class="g" data-act="confirm"></span><span>Continue</span></div>
  </div>
</div>

<div id="pause" class="layer">
  <div class="pwrap">
    <div class="phead">
      <h2 class="ptitle" id="ptitle">Paused</h2>
      <div class="tabs" id="tabs">
        <span class="g" data-act="tabL"></span>
        <button class="tab nav" data-tab="skills">Skills</button>
        <button class="tab nav" data-tab="looks">Costumes</button>
        <button class="tab nav" data-tab="controls">Controls</button>
        <button class="tab nav" data-tab="settings">Settings</button>
        <span class="g" data-act="tabR"></span>
      </div>
    </div>
    <div id="pbody"></div>
    <div class="pfoot">
      <div class="hints"><span><span class="g" data-act="confirm"></span>Select</span><span><span class="g" data-act="back"></span><span id="backLbl">Resume</span></span></div>
      <div class="acts"><button class="pbtn nav" id="bResume">Resume</button><button class="pbtn nav" id="bQuit">Quit to title</button></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================================
   KINETIC CITY  -  rebuilt, controller-first
   -------------------------------------------------------------------------------------
   One HTML file, no dependencies, Canvas 2D. Built from the original prototype's design:
   physics-as-damage, five force powers, karma with visible consequences, three districts
   (hideouts -> boss -> spare/kill -> liberated/dominated), heat/police, XP/combo/upgrades.

   FILE MAP (sections are concatenated in this order)
     01 core       constants, math, colour helpers, seeded rng
     02 input      gamepad (standard mapping) + keyboard/mouse -> actions, rumble, glyph labels
     03 audio      WebAudio synth sfx, rain ambience, adaptive music
     04 world      procedural city: blocks, buildings (with heights), lamps, signs, nav grid, flow field
     05 entities   entity defs + factory
     06 physics    integration, tile collision, spatial hash, impact damage
     07 combat     damage, death, karma, xp, heat, explosions, feedback (hitstop/shake/rumble)
     08 player     movement + powers; telekinesis target lock / spring hold / aim-assisted throw
     09 ai         civilians, gang, cops, bosses, hideouts, traffic
     10 game       population, encounters, story, districts, upgrades, save/load
     11 render     camera, fake-3D buildings, additive lighting, rain, entities, effects
     12 hud        canvas HUD, minimap, waypoints, prompts, city map
     13 ui         DOM overlays (title, dialogue, pause) with controller navigation
     14 main       loop + debug hooks (window.KC)
   ===================================================================================== */

/* ---------- world scale ---------- */
const TILE = 32;
const PERIOD = 12, ROAD = 3;            // each 12-tile period = 3 road tiles + 9 block tiles
const DCOLS = 4;                        // block columns per district
const BCOLS = DCOLS * 3, BROWS = 7;     // 3 districts x 4 block columns, 7 block rows
const MAP_W = BCOLS * PERIOD + ROAD;    // 147 tiles
const MAP_H = BROWS * PERIOD + ROAD;    // 87 tiles
const WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;
const GATE_TX = [DCOLS * PERIOD + 1, DCOLS * 2 * PERIOD + 1];   // tile column of the barricade between districts (middle of the road)
const DIST_SPLIT = [GATE_TX[0] * TILE + 16, GATE_TX[1] * TILE + 16];

/* ---------- simulation ---------- */
const STEP = 1 / 60;
const ACTIVE_R = 760;                   // entities this close to the player are simulated
const MAX_SPEED = 840;
const IMPACT_K = 9e-5;                  // kinetic energy -> damage. THE main balance knob.
const IMPACT_MIN = 110;                 // closing speed below this does no damage
const PLAYER_SPEED = 196, DASH_SPEED = 640, DASH_TIME = .17;
const TK_RANGE = 250;
const CAM_D = 1500;                     // virtual camera height used for building perspective
const VIEW_H = 340;                     // world units visible vertically
const KARMA_MAX = 100;

/* camera in world units (filled in by the renderer each frame) */
const cam = { x: 0, y: 0, w: 960, h: VIEW_H, zoom: 1, scale: 1, cx: 0, cy: 0, trauma: 0, sx: 0, sy: 0, viewH: VIEW_H };

/* ---------- math ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist2 = (a, b) => (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
const dist = (a, b) => Math.sqrt(dist2(a, b));
const TAU = Math.PI * 2;
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }

/* ============================== 08 PLAYER & POWERS ============================== */
/* TELEKINESIS, rebuilt around a controller:
   - Target lock: the right stick sweeps an aim cone; the best grabbable object in the cone (angle first,
     distance second, line of sight required) is highlighted, with hysteresis so it doesn't flicker.
   - Hold RT: the object is yanked onto a damped spring in front of you. Heavier objects lag and swing,
     and anything swung fast enough bats enemies aside.
   - Release RT: thrown along your aim with light aim assist + target leading. A trajectory line shows
     exactly where it will land while you hold it. B drops it gently.
   Other powers: RB repulse (shove + reflect bullets), LB gravity well, A dash (i-frames, dash strike),
   LT absorb (hold to soak damage into charge, release = blast). X / Y: hold to heal / drain civilians. */
const aim = { x: 0, y: 0, dx: 1, dy: 0, ang: 0, dist: 170, idle: 0 };

function screenToWorld(sx, sy) { return { x: cam.x + (sx - FRAME.x) / cam.scale, y: cam.y + (sy - FRAME.y) / cam.scale }; }

function updateAim(dt, mv) {
  const p = P;
  if (Input.device === 'kbm') {
    const w = screenToWorld(Input.mouse.sx, Input.mouse.sy), dx = w.x - p.x, dy = w.y - p.y;
    aim.ang = Math.atan2(dy, dx); aim.dist = Math.hypot(dx, dy);

function updatePlayer(dt) {
  const p = P; const alive = G.mode === 'play';
  p.sinceHit += dt; p.repCd -= dt; p.wellCd -= dt; p.dashCd -= dt; p.drainCd -= dt; p.invT -= dt; p.throwT -= dt; p.sinceUse += dt; p.flash -= dt;

/* ---------- combat dispatcher ---------- */
function aiCombat(e, dt) {

    face(e, Math.atan2(dy, dx), dt, 5); e.walk += dt * Math.hypot(e.vx, e.vy) * .07; return;

/* ---------- traffic ---------- */
/* Right-hand traffic. E-W road band k spans y in [k*384, k*384+96]: eastbound lane y+68, westbound y+28.
   N-S bands: southbound x+28, northbound x+68. Cars choose a turn on entering an intersection and
   commit when they cross the new lane's centre line. */
const BAND = PERIOD * TILE;
const laneFor = (dx, dy, base) => dx > 0 ? base + 68 : dx < 0 ? base + 28 : dy > 0 ? base + 28 : base + 68;
function aiCar(e, dt) {

  if (inter && !e.wasInter) {
    const cx = Math.floor(e.x / BAND) * BAND + 48, cy = Math.floor(e.y / BAND) * BAND + 48;
    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([ox, oy]) => !(ox === -e.dx && oy === -e.dy) && walkable(cx + ox * 140, cy + oy * 140, 16) && roadAt(cx + ox * 140, cy + oy * 140));

    e.plan = (straight && Math.random() < .55) ? null : (opts.filter(o => o !== straight).length ? pick(opts.filter(o => o !== straight)) : null);
    if (!straight && !e.plan) e.plan = [-e.dx, -e.dy];
  }
  e.wasInter = inter;
  if (inter && e.plan) {
    const [ndx, ndy] = e.plan;
    if (ndx === -e.dx && ndy === -e.dy) { e.dx = ndx; e.dy = ndy; e.plan = null; }
    else if (ndy !== 0) { const lx = laneFor(0, ndy, Math.floor(e.x / BAND) * BAND); if (Math.abs(e.x - lx) < 6) { e.x = lx; e.dx = 0; e.dy = ndy; e.plan = null; } }
    else { const ly = laneFor(ndx, 0, Math.floor(e.y / BAND) * BAND); if (Math.abs(e.y - ly) < 6) { e.y = ly; e.dx = ndx; e.dy = 0; e.plan = null; } }
  }
  // dead end (closed barricade / map edge): U-turn
  const look = 27 + e.r; if (!walkable(e.x + e.dx * look, e.y + e.dy * look, 12)) { e.dx = -e.dx; e.dy = -e.dy; e.plan = null; }
  let sp = 128 * (e.vs ? e.vs.spd : 1);
  e.blockT = e.blockT || 0;
  for (const o of act) {
    if (o === e || o.dead || o.static || o.held) continue;
    const rx = o.x - e.x, ry = o.y - e.y, fwd = rx * e.dx + ry * e.dy; if (fwd <= 0 || fwd > e.r + o.r + 34) continue;
    if (Math.abs(rx * e.dy - ry * e.dx) < (o.curb ? 14 : 15 + o.r * .5)) { sp = 0; break; }

  let tvx = e.dx * sp, tvy = e.dy * sp;
  if (!inter || !e.plan) {
    if (e.dx !== 0) tvy = (laneFor(e.dx, 0, Math.floor(e.y / BAND) * BAND) - e.y) * 4;
    else tvx = (laneFor(0, e.dy, Math.floor(e.x / BAND) * BAND) - e.x) * 4;
  }
  const k = Math.min(1, dt * 4); e.vx += (tvx - e.vx) * k; e.vy += (tvy - e.vy) * k;
  if (Math.hypot(e.vx, e.vy) > 8) e.ang += angDiff(Math.atan2(e.vy, e.vx), e.ang) * Math.min(1, dt * 10);
}

/* ---------- watchtower lookout ---------- */
/* A grunt stands on the deck and shoots like any gunman (same aim laser, same bullets) while you are on the

function aiTower(e, dt) {

  e.losT = (e.losT || 0) - dt; if (e.losT <= 0) { e.losT = .2; e.losC = on && los(e, P); }

/* ---------- per tick ---------- */
function updateAI(dt) {
  let threat = 0;
  for (const e of act) {
    if (e.dead) continue; e.flash -= dt;
    switch (e.kind) {
      case 'civ': aiCivilian(e, dt); break;
      case 'grunt': case 'brute': case 'sup': case 'boss': case 'cop': aiCombat(e, dt); if (e.tgt === P && dist2(e, P) < 520 * 520) threat += e.kind === 'boss' ? 4 : 1; break;
      case 'hideout': aiHideout(e, dt); break;

function updateBullets(dt) {

    if (b.life <= 0 || solidAt(b.x, b.y)) { b.dead = true; if (b.life > 0) FX.sparks(b.x, b.y, 3, b.col, 120); continue; }
    if (P.absorbing && b.team !== 'player' && Math.hypot(b.x - P.x, b.y - P.y) < 28) { absorb(b.dmg * 1.5); b.dead = true; FX.flash(b.x, b.y, 30, '#9ff', .1); continue; }

      else if (b.team === 'player') hit = e.team === 'gang' || (e.team === 'police' && !e.ally);

  for (const z of zones) {
    z.t -= dt; if (Math.random() < dt * 6) FX.embers(z.x, z.y, 1);
    if (dist2(z, P) < (z.r + P.r) * (z.r + P.r)) { P.burnT = (P.burnT || 0) - dt; if (P.burnT <= 0) { P.burnT = .25; hurt(P, z.dmg * .25, { by: 'fire' }); } }
  }

  for (const w of warns) w.life -= dt; for (let i = warns.length - 1; i >= 0; i--) if (warns[i].life <= 0) warns.splice(i, 1);

/* ============================== 09b STREET LIFE ============================== */
/* GTA-style ambient life. None of it is clever; it just fills the world:
   - Pedestrians walk loops around the sidewalk of a block, sometimes crossing the road at a corner to
     the next block, sometimes walking into a building door (and vanishing), and new ones walk out of doors.
   - Drivers occasionally pull over and park on the curb, get out, and walk off. Pedestrians sometimes walk
     up to a curb-parked car, get in, and drive away.
   - Population streams around the player: people and traffic are topped up just off-screen and removed
     when far away, so the streets near you stay busy without simulating the whole city. */
const RING = 1024;                       // sidewalk loop length around a block (4 sides x 256)
const blockAt = (x, y) => blocks[clamp(Math.round((y - 240) / BAND), 0, BROWS - 1) * BCOLS + clamp(Math.round((x - 240) / BAND), 0, BCOLS - 1)];

  s = ((s % RING) + RING) % RING; const side = (s / 256) | 0, t = s - side * 256;

  if (side === 1) return { x: b.x + 272, y: b.y + 16 + t };

}

  const cx = clamp(x, b.x + 16, b.x + 272), cy = clamp(y, b.y + 16, b.y + 272);
  const c = [[Math.abs(y - (b.y + 16)), cx - b.x - 16], [Math.abs(x - (b.x + 272)), 256 + cy - b.y - 16], [Math.abs(y - (b.y + 272)), 512 + b.x + 272 - cx], [Math.abs(x - (b.x + 16)), 768 + b.y + 272 - cy]];
  c.sort((p, q) => p[0] - q[0]); return c[0][1];
}
/* doors: one per building wall that faces the sidewalk loop */
function computeDoors() {
  for (const blk of blocks) {
    blk.doors = [];
    for (const b of blk.bld) {
      const mx = b.x + b.w / 2, my = b.y + b.h / 2;
      if (b.y + b.h === blk.y + blk.h - TILE) { blk.doors.push({ x: mx, y: b.y + b.h + 2, s: 512 + (blk.x + 272 - mx), front: true }); b.door = { u: .5 }; }
      if (b.y === blk.y + TILE) blk.doors.push({ x: mx, y: b.y - 2, s: mx - blk.x - 16 });
      if (b.x === blk.x + TILE) blk.doors.push({ x: b.x - 2, y: my, s: 768 + blk.y + 272 - my });
      if (b.x + b.w === blk.x + blk.w - TILE) blk.doors.push({ x: b.x + b.w + 2, y: my, s: 256 + my - blk.y - 16 });

/* ---------- pedestrians ---------- */
function walkStreet(e, dt) {
  if (!e.blk) { e.blk = blockAt(e.x, e.y); e.s = ringProject(e.blk, e.x, e.y); e.dir = e.dir || (Math.random() < .5 ? 1 : -1); e.street = 'walk'; }
  const sp = e.speed;
  if (e.street === 'exit' || e.street === 'enter' || e.street === 'toCar' || e.street === 'cross') {
    const t = e.goal, dx = t.x - e.x, dy = t.y - e.y, d = Math.hypot(dx, dy);
    steer(e, dx, dy, e.street === 'cross' ? sp * 1.25 : sp, dt); face(e, Math.atan2(dy, dx), dt, 8);
    if (d < 6) {
      if (e.street === 'enter') { e.fadeOut = .35; e.street = 'gone'; }
      else if (e.street === 'toCar') { const c = e.car; if (c && !c.dead && !c.held && c.curb && !c.driving) startDriving(c); e.fadeOut = .15; e.street = 'gone'; }
      else { if (e.street === 'cross') { e.blk = e.nextBlk; } e.s = ringProject(e.blk, e.x, e.y); e.street = 'walk'; }
    }
    return;
  }
  if (e.street === 'gone') { steer(e, 0, 0, 0, dt); return; }
  // walking the loop: aim a little ahead of our spot on the ring
  const target = ringPt(e.blk, e.s + e.dir * 18);
  if (dist(e, target) > 60) e.s = ringProject(e.blk, e.x, e.y);   // knocked off the path: pick up from here
  let tx = target.x, ty = target.y;
  // step around parked cars and props on the sidewalk
  for (const o of act) {
    if (o === e || o.dead || !o.prop || o.held) continue;
    const ox = o.x - e.x, oy = o.y - e.y, fx = tx - e.x, fy = ty - e.y, fl = Math.hypot(fx, fy) || 1;
    const fwd = (ox * fx + oy * fy) / fl; if (fwd < 0 || fwd > o.r + 22) continue;
    const lat = (ox * fy - oy * fx) / fl; if (Math.abs(lat) < o.r + 10) { tx += -fy / fl * (o.r + 14) * (lat >= 0 ? 1 : -1); ty += fx / fl * (o.r + 14) * (lat >= 0 ? 1 : -1); }
  }

  if (dist(e, ringPt(e.blk, e.s)) < 26) e.s += e.dir * sp * dt;

  e.decT = rnd(1.2, 2.6);

    if (Math.abs(((dr.s - e.s + RING * 1.5) % RING) - RING / 2) < 30) { e.street = 'enter'; e.goal = { x: dr.x, y: dr.y }; return; }
  }
  // get into a curb-parked car
  if (Math.random() < .6) for (const c of act) {
    if (c.kind === 'car' && c.curb && !c.driving && !c.dead && !c.held && !c.claimed && dist(c, e) < 95) { c.claimed = true; e.car = c; e.street = 'toCar'; e.goal = { x: c.x - Math.sin(c.ang) * (c.r + 4) * Math.sign(c.curbSide || 1), y: c.y + Math.cos(c.ang) * (c.r + 4) * Math.sign(c.curbSide || 1) }; return; }
  }
  // cross the road at a corner
  const corner = Math.round(e.s / 256) * 256;
  if (Math.abs(e.s - corner) < 20 && Math.random() < .35) {
    const p = ringPt(e.blk, corner), opts = [];
    for (const [ox, oy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nb = blocks[(e.blk.by + oy) * BCOLS + e.blk.bx + ox];
      if (!nb || e.blk.by + oy < 0 || e.blk.by + oy >= BROWS || e.blk.bx + ox < 0 || e.blk.bx + ox >= BCOLS) continue;
      const g = { x: p.x + ox * 128, y: p.y + oy * 128 };
      if (Math.abs(g.x - p.x) + Math.abs(g.y - p.y) > 0 && walkable(g.x, g.y, 8) && blockAt(g.x, g.y) === nb && los(p, g)) opts.push({ g, nb });
    }

  }
}

/* ---------- parking ---------- */

}
function startDriving(c) {
  c.driving = true; c.hasDriver = true; c.curb = false; c.reDrive = (c.reDrive || 0) + 1; c.claimed = false; c.parkCd = rnd(25, 50);
  const a = c.ang; if (Math.abs(Math.cos(a)) > Math.abs(Math.sin(a))) { c.dx = Math.sign(Math.cos(a)); c.dy = 0; } else { c.dx = 0; c.dy = Math.sign(Math.sin(a)); }
}
function parkingTick(e, dt) {   // called by aiCar; returns true while it is handling the car
  e.parkCd = (e.parkCd === undefined ? rnd(4, 18) : e.parkCd) - dt;
  if (!e.parkTo && e.parkCd <= 0 && e.hasDriver && !e.plan) {
    e.parkCd = rnd(8, 20);
    const inter = (e.y % BAND) < 96 && (e.x % BAND) < 96;
    let parked = 0; for (const o of act) if (o.curb) parked++;
    const s = !inter && parked < 6 && Math.random() < .8 ? curbSpot(e) : null;
    if (s) e.parkTo = s;
  }
  if (!e.parkTo) return false;
  const s = e.parkTo, k = Math.min(1, dt * 3);
  const tvx = e.dx * 50 + (s.x !== undefined ? (s.x - e.x) * 3 : 0), tvy = e.dy * 50 + (s.y !== undefined ? (s.y - e.y) * 3 : 0);
  e.vx += (tvx - e.vx) * k; e.vy += (tvy - e.vy) * k;
  if (Math.hypot(e.vx, e.vy) > 8) e.ang += angDiff(Math.atan2(e.dy, e.dx), e.ang) * Math.min(1, dt * 6);
  const off = s.x !== undefined ? Math.abs(s.x - e.x) : Math.abs(s.y - e.y);

      const px = e.x - Math.sin(e.ang) * (e.r + 10) * s.side * -1, py = e.y + Math.cos(e.ang) * (e.r + 10) * s.side * -1;
      const c = spawnCiv(e.x + (s.x !== undefined ? (s.side > 0 ? 22 : -22) : 0), e.y + (s.y !== undefined ? (s.side > 0 ? 22 : -22) : 0));

/* ---------- streaming population around the player ---------- */

function spawnTraffic(d) {

function updateFX(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; const f = p.k === 'm' ? .97 : p.k === 's' ? .9 : .94; p.vx *= f; p.vy *= f; if (p.k === 'r') p.a += p.va * dt; p.life -= dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  if (parts.length > 900) parts.splice(0, parts.length - 900);
  for (const t of texts) t.life -= dt; for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
  for (const r of rings) { r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 12); } for (let i = rings.length - 1; i >= 0; i--) if (rings[i].life <= 0) rings.splice(i, 1);
  for (const l of dlights) l.life -= dt; for (let i = dlights.length - 1; i >= 0; i--) if (dlights[i].life <= 0) dlights.splice(i, 1);
  for (const d of decals) d.life -= dt; for (let i = decals.length - 1; i >= 0; i--) if (decals[i].life <= 0) decals.splice(i, 1);
  for (const t of G.toasts) t.life -= dt; G.toasts = G.toasts.filter(t => t.life > 0);
}
function runTimers(dt) {
  for (const t of timers) t.t -= dt;
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); try { f(); } catch (e) { console.error(e); } }
}
function tick(dt) { update(dt); runTimers(dt); updateFX(dt); }

/* attract mode behind the title screen: slow drift over Ground Zero with live traffic */
function titleTick(dt) {
  G.time += dt;
  cam.viewH = VIEW_H * 1.15;
  cam.cx = 980 + Math.sin(G.time * .045) * 620; cam.cy = 760 + Math.sin(G.time * .033) * 420; placeCam(); cam.sx = cam.sy = 0;
  act.length = 0; for (const e of ents) if (!e.dead && e !== P && inView(e.x, e.y, 260) && (e.kind === 'car' || e.kind === 'civ' || e.prop)) act.push(e);
  for (const e of act) { if (e.kind === 'car') aiCar(e, dt); else if (e.kind === 'civ') wander(e, dt, e.speed, civWalk), e.walk += dt * Math.hypot(e.vx, e.vy) * .07; }
  physics(dt); updateFX(dt);
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  try {
    Input.poll(dt);
    const wasLive = G.mode === 'play' || G.mode === 'dead';
    UI.update(dt);
    if (!wasLive || !(G.mode === 'play' || G.mode === 'dead')) Input.endTick();
    if (G.mode === 'title') titleTick(dt);
    else if (G.mode === 'play' || G.mode === 'dead') {
      if (G.hitstop > 0) G.hitstop -= dt;
      else {
        const k = G.slowT > 0 ? .3 : 1; if (G.slowT > 0) G.slowT -= dt;
        acc += dt * k; let n = 0;
        while (acc >= STEP && n < 5) { tick(STEP); Input.endTick(); acc -= STEP; n++; }
        if (n === 5) acc = 0;
      }
      updateCamera(dt);
    }
    G.flash = Math.max(0, G.flash - dt * 1.4);
    render(dt);
    if (G.mode !== 'title') drawHUD(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

resize();
newGame(null);                       // builds the city for the title backdrop
G.mode = 'title';
if (document.fonts && document.fonts.load) document.fonts.load('600 16px "Chakra Petch"').catch(() => { });
requestAnimationFrame(frame);

/* Debug / test hooks: KC.step(n) runs n fixed ticks synchronously; KC.skipTo(d) jumps to district d. */
window.KC = {
  G, DS, ents, bullets, ups, S, cam, aim, wells, parts, pickups, Input, UI,
  get P() { return P; }, get tkTarget() { return tkTarget; }, get traj() { return traj; },
  step(n = 1) { for (let i = 0; i < n; i++) { tick(STEP); Input.endTick(); } },
  start() { document.getElementById('bNew').click(); },
  skip() { let g = 0; while (G.mode === 'dialog' && g++ < 50) { const l = UI.dialogLine; if (!l) break; if (l.choices) { UI.finishTyping(); return l.choices; } UI.finishTyping(); UI.nextLine(); } return null; },
  tp(x, y) { P.x = x; P.y = y; snapCamera(); }, giveXP(n) { addXP(n); }, setKarma(k) { G.karma = clamp(k, -100, 100); },
  skipTo(d) {
    for (let i = 0; i < d; i++) { gatesOpen[i] = true; openGate(i); DS[i].bossDone = true; DS[i].hideoutsLeft = 0; DS[i].status = 'liberated'; for (const e of ents) if (e.kind === 'hideout' && e.did === i) { e.cleared = true; e.gateOpen = true; e.gateT = 1; } else if (e.guardOf !== undefined && e.did === i) e.dead = true; }
    drawMinimapBase(); const c = checkpointFor(d); P.x = c.x; P.y = c.y; DS[d].intro = true; snapCamera();
  },
  costume(n) { if (HERO_COSTUMES[n]) heroCostume = n; return heroCostume; },
  see(n) { if (n !== undefined) SEE = n; return SEE; },   // how the hero shows behind buildings: 0 hidden, 1 silhouette, 2 window, 3 see-through wall
  spawn: mk, spawnGang, spawnBoss, render, drawHUD, snapCamera, hurt, kill, explosion
};

</script>
