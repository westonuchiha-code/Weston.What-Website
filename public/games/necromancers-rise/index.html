function setPlacing(type){
  placing = type;
  if(type) closeDrawer();
  selKey = null; drawerKey = null;
  if(S) renderConsole();
}

/* =========================================================
   RENDER UI
   ========================================================= */
function renderUI(){
  if(!S) return;
  for(const r of RES) setT(topRes[r.id], fmt(S.res[r.id]));
  setT(popEl.querySelector('b'), `${popCount()}/${cap()}`); popEl.classList.toggle('full', popCount() >= cap());
  const dayNow = S.t < 105 || S.t >= 222;
  const until = S.t < 105 ? 105 - S.t : S.t < 222 ? 222 - S.t : CYCLE - S.t + 105;
  const di = $('dialicon'); if(di._t !== dayNow){ di._t = dayNow; di.replaceChildren(icon(dayNow ? 'sun' : 'moon')); }
  setT($('dialtxt'), dayNow ? `Dusk ${mmss(until)}` : `Dawn ${mmss(until)}`); $('dial').title = dayNow ? 'Daytime. Your undead are slower.' : 'Night. Your undead are at full strength.';
  const ue = $('unease');
  ue.style.visibility = S.won ? 'hidden' : 'visible';
  setT($('uetxt'), S.mobActive ? 'Mob!' : S.alarm >= 100 ? 'At dawn' : Math.floor(S.alarm) + '%');
  $('uebar').style.width = S.alarm + '%';
  ue.classList.toggle('hot', S.mobActive || S.alarm >= 100);
  ue.title = 'Village unease';
  document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === S.speed)));
  const g = currentGoal(), ob = $('objective'), gk = g ? g.id : 'done';
  if(ob._t !== gk){ ob._t = gk; ob.replaceChildren(icon('banner'), h('span', {text: g ? g.short : 'Level complete'})); }
  ob.style.display = (sel && resolveSel()) || placing ? 'flex' : 'none';
  const stuck = S.buildings.some(b => !b.done && b.noPath && S.clock - b.noPath < 15);
  const attn = {jobs:(S.buildings.some(b => !b.done) && !jobCount('build')) || (S.orders.length > 0 && !jobCount('craft')) || (S.mobActive && !jobCount('guard')), build:stuck};
  document.querySelectorAll('.cmd[data-cmd]').forEach(b => b.classList.toggle('attn', !!attn[b.dataset.cmd] && drawer !== b.dataset.cmd));
  renderConsole();
  renderDrawer();
}
const currentGoal = () => L.goals.find(g => !g.bonus && !S.goalsDone[g.id]);

/* =========================================================
   CAMPAIGN SCREENS
   ========================================================= */
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII'];
function showCamp(){
  campOpen = true; placing = null; closeDrawer(); sel = null;
  renderCamp();
  $('camp').classList.add('show'); $('camp').scrollTop = 0;
}
function hideCamp(){ campOpen = false; $('camp').classList.remove('show'); }
function renderCamp(){
  const c = $('campin'); c.replaceChildren();
  c.append(h('h1', {class:'camp-title', text:"Necromancer's Rise"}), h('hr', {class:'camp-rule'}));
  c.append(h('p', {class:'camp-sub', text:'Every level starts fresh. Raise the hero hidden on each map and keep him alive, and he will follow you into the next one.'}));
  LEVELS.forEach((lv, k) => {
    const inProg = S && S.levelId === lv.id && !S.won, done = CAMP.done[lv.id];
    const locked = lv.soon || !CAMP.unlocked.includes(lv.id);
    const status = lv.soon ? 'Coming soon' : locked ? 'Locked' : inProg ? `In progress, day ${dayNum()}` : done ? `Won in ${done.days} day${done.days === 1 ? '' : 's'}` : 'Ready';
    const row = h('button', {class:'mission' + (locked ? ' locked' : '') + (done && !inProg ? ' done' : ''), type:'button'},
      h('span', {class:'num', text:ROMAN[k]}), h('span', {}, h('span', {class:'mname', text:lv.name}), h('span', {class:'msub', text:lv.sub})), h('span', {class:'mstat', text:status}));
    if(locked) row.disabled = true; else row.addEventListener('click', () => briefing(lv));
    c.append(row);
  });
  const r = h('div', {class:'roster'}, h('h2', {text:'Your heroes'}));
  if(!CAMP.roster.length) r.append(h('p', {class:'dn', text:'No heroes yet. Each level hides one.'}));
  else { const list = h('div', {class:'heroes'}); for(const id of CAMP.roster){ const d = HEROES[id]; list.append(h('div', {class:'herochip'}, h('div', {}, h('b', {text:`${d.name}, ${d.title}`}), d.perk))); } r.append(list); }
  c.append(r, h('p', {class:'camp-note', text:'Your campaign and the level in progress save on their own.'}));
}
function briefing(lv){
  const inProg = S && S.levelId === lv.id && !S.won;
  const other = S && !S.won && S.levelId !== lv.id ? LEVELS.find(l => l.id === S.levelId) : null;
  const heroes = CAMP.roster.length ? ` Your heroes come too: ${CAMP.roster.map(id => HEROES[id].name).join(' and ')}.` : '';
  const body = [lv.story, sec('Objective', lv.objective), sec('Bonus', lv.bonus), sec('You start with', lv.startText + heroes)];
  const start = () => { if(other) confirmDialog(`Leave ${other.name}?`, `Starting ${lv.name} throws away your game in ${other.name}.`, `Start ${lv.name}`, () => startLevel(lv.id)); else startLevel(lv.id); };
  const buttons = inProg
    ? [{label:'Resume', kind:'primary', onClick:resumeLevel}, {label:'Restart from scratch', kind:'ghost', onClick:() => confirmDialog(`Restart ${lv.name}?`, 'You will lose everything you built on this map.', 'Restart', () => startLevel(lv.id))}, {label:'Back', kind:'ghost'}]
    : [{label:'Start', kind:'primary', onClick:start}, {label:'Back', kind:'ghost'}];
  dialog({title:lv.name, body, buttons});
}
function startLevel(id){
  newLevel(id);
  sel = null; placing = null; drawerKey = null; selKey = null; closeDrawer(); feedEl.replaceChildren();
  hideCamp(); resize(); centerCam();
  saveLevel(); renderUI();
}
function resumeLevel(){ sel = null; selKey = null; drawerKey = null; hideCamp(); resize(); centerCam(); renderUI(); }
function openMenu(){
  if(!S) return;
  dialog({title:L.name, body:[`Day ${dayNum()}. Your progress saves on its own.`], buttons:[
    {label:'Resume', kind:'primary'},
    {label:'Campaign map', kind:'ghost', onClick:() => { saveLevel(); showCamp(); }},
    {label:'Restart this level', kind:'danger', onClick:() => confirmDialog(`Restart ${L.name}?`, 'You will lose everything you built on this map.', 'Restart', () => startLevel(L.id))},
  ]});
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function serialize(){
  const o = Object.assign({}, S);
  o.minions = S.minions.map(m => ({id:m.id, kind:m.kind, hero:m.hero, name:m.name, x:m.x, y:m.y, job:m.job, tool:m.tool, hp:m.hp, carry:m.carry, face:m.face}));
  o.villagers = []; o.mobActive = false;
  o.graves = S.graves.map(g => ({x:g.x, y:g.y, type:g.type, hero:g.hero, far:g.far, dug:g.dug, stone:g.stone, first:g.first, label:g.label}));
  o.drops = S.drops.map(d => ({x:d.x, y:d.y, kind:d.kind, n:d.n}));
  o.buildings = S.buildings.map(b => ({id:b.id, type:b.type, x:b.x, y:b.y, done:b.done, progress:b.progress, hp:b.hp, r:b.r}));
  return JSON.stringify(o);
}
async function store(k, v){ try{ if(window.storage) await window.storage.set(k, v, false); }catch(e){ console.warn('Save failed', e); } }
async function fetchKey(k){ try{ if(!window.storage) return null; const r = await window.storage.get(k, false); return r && r.value ? r.value : null; }catch(e){ return null; } }
function saveCamp(){ return store(CAMP_KEY, JSON.stringify(CAMP)); }
function saveLevel(){ if(S && !S.won) return store(LEVEL_KEY, serialize()); }
function clearLevelSave(){ return store(LEVEL_KEY, ''); }
async function loadAll(){
  const c = await fetchKey(CAMP_KEY);
  if(c){ try{ const o = JSON.parse(c); if(o.version === 3) CAMP = Object.assign(CAMP, o); }catch(e){} }
  const l = await fetchKey(LEVEL_KEY);
  if(l){ try{
    const o = JSON.parse(l); const def = LEVELS.find(x => x.id === o.levelId);
    if(o.version === 3 && def && !def.soon){
      applyLevel(def); S = o;
      S.minions.forEach(m => Object.assign(m, {task:null, path:[], phase:'', work:0, think:Math.random()}));
      S.drops.forEach(d => d.res = null);
      if(!S.blessed) S.blessed = new Array(W*H).fill(0);
      S.monkT = S.monkT ?? 150; S.bodyT = S.bodyT ?? 10; S.doctorT = S.doctorT ?? 0;
      S.stats = Object.assign({breaches:0, monksKilled:0, doctorsKilled:0, bodiesCollected:0, bodyRaised:0, burned:0, blessings:0}, S.stats);
      S.villagers = []; spawnWanderers();
      indexGraves(); recomputeBlight();
    }
  }catch(e){ S = null; } }
}


/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now(), acc = 0, uiT = 0;
function frame(now){
  const real = Math.min(0.25, Math.max(0, (now - last)/1000)); last = now;
  if(S && !campOpen){
    if(!paused && S.speed > 0){
      acc += real*S.speed;
      let n = 0;
      while(acc >= 0.1 && n++ < 40 && S){ step(0.1); acc -= 0.1; }
      if(n >= 40) acc = 0;
    }
    if(S){ draw(real); uiT -= real; if(uiT <= 0){ uiT = 0.2; renderUI(); } }
  }
  requestAnimationFrame(frame);
}
(async () => {
  buildArt(); buildChrome(); makePics();
  await loadAll();
  $('loading').remove();
  showCamp();
  new ResizeObserver(() => { if(S) resize(); }).observe(wrap);
  requestAnimationFrame(t => { last = t; frame(t); });
  setInterval(saveLevel, 15000);
  document.addEventListener('visibilitychange', () => { if(document.hidden) saveLevel(); });
  window.addEventListener('pagehide', saveLevel);
})();

</script>
